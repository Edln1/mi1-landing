h the listing title.\" aria-label=\"Show supplier reference 2\" aria-pressed=\"false\">\u003cimg src=\"assets/ai-recorder-reference-2.jpg\" alt=\"\" width=\"100\" height=\"80\">\u003c/button>\u003cbutton type=\"button\" data-lf-image=\"assets/ai-recorder-reference-3.jpg\" data-lf-alt=\"Supplier product information image 3\" data-lf-caption=\"Supplier app feature overview. Interface and service availability may vary by market.\" aria-label=\"Show supplier reference 3\" aria-pressed=\"false\">\u003cimg src=\"assets/ai-recorder-reference-3.jpg\" alt=\"\" width=\"100\" height=\"80\">\u003c/button>\u003cbutton type=\"button\" data-lf-image=\"assets/ai-recorder-reference-4.jpg\" data-lf-alt=\"Supplier product information image 4\" data-lf-caption=\"Supplier language and accuracy claims; neither has been independently validated.\" aria-label=\"Show supplier reference 4\" aria-pressed=\"false\">\u003cimg src=\"assets/ai-recorder-reference-4.jpg\" alt=\"\" width=\"100\" height=\"80\">\u003c/button>\u003cbutton type=\"button\" data-lf-image=\"assets/ai-recorder-reference-5.jpg\" data-lf-alt=\"Supplier product information image 5\" data-lf-caption=\"Supplier illustration of conversational voice interaction through the phone app.\" aria-label=\"Show supplier reference 5\" aria-pressed=\"false\">\u003cimg src=\"assets/ai-recorder-reference-5.jpg\" alt=\"\" width=\"100\" height=\"80\">\u003c/button>\u003cbutton type=\"button\" data-lf-image=\"assets/ai-recorder-reference-6.jpg\" data-lf-alt=\"Supplier product information image 6\" data-lf-caption=\"Supplier illustration of speaker identification.\" aria-label=\"Show supplier reference 6\" aria-pressed=\"false\">\u003cimg src=\"assets/ai-recorder-reference-6.jpg\" alt=\"\" width=\"100\" height=\"80\">\u003c/button>\u003c/div>\u003cp id=\"lf-image-caption\">Generated lifestyle concept. Hardware appearance follows the supplier reference.\u003c/p>\u003c/div>\u003cdiv class=\"robot-copy lf-copy\">\u003cp class=\"lf-eyebrow\">NEXORA / GADGETS\u003c/p>\u003ch1>AI Voice\u003cbr> Recorder\u003c/h1>\u003cp class=\"lf-deck\">A sharp little mind.\u003c/p>\u003cp>A distinctive pocket recorder with tactile controls and an app-powered way to turn conversations into something useful.\u003c/p>\u003cdiv class=\"lf-highlights\">\u003cspan>32GB storage\u003c/span>\u003cspan>Wi-Fi enabled\u003c/span>\u003cspan>Two recording modes\u003c/span>\u003c/div>\u003cdiv class=\"robot-status lf-status\">\u003cstrong>New collection preview\u003c/strong>\u003cp>Price and availability to be announced. Ordering is not open yet.\u003c/p>\u003c/div>\u003ca class=\"lf-button\" href=\"#robot-details\">Meet the recorder \u003cspan>\u2193\u003c/span>\u003c/a>\u003cp class=\"lf-small\">Supplier-listed configuration \u00b7 AI services subject to confirmation\u003c/p>\u003c/div>\u003c/div>\u003c/section>\n \u003csection class=\"lf-banner\" id=\"robot-details\">\u003cimg src=\"assets/ai-voice-recorder-life-v1.webp\" alt=\"Generated recorder scene on a walnut home-office desk\" width=\"1672\" height=\"941\" loading=\"lazy\">\u003cdiv class=\"lf-banner-copy lf-reveal\">\u003cp class=\"lf-eyebrow\">SMALL OBJECT. BIG IDEAS.\u003c/p>\u003ch2>Keep the thought.\u003cbr> Stay in the moment.\u003c/h2>\u003cp>A notebook for your voice. Designed around a simple physical recording workflow, with a more intelligent next step in the app.\u003c/p>\u003c/div>\u003csmall>Generated lifestyle concept\u003c/small>\u003c/section>\n \u003csection class=\"lf-wrap lf-section lf-reveal\">\u003cdiv class=\"lf-section-heading\">\u003cp class=\"lf-eyebrow\">TACTILE BY DESIGN\u003c/p>\u003ch2>Two circles.\u003cbr> A different kind of gadget.\u003c/h2>\u003cp>A slim silhouette, a physical mode selector and a dedicated AI button. A piece of technology that invites a closer look.\u003c/p>\u003c/div>\u003cdiv class=\"recorder-modes\">\u003cdiv class=\"recorder-reference\">\u003cimg src=\"assets/ai-recorder-reference-2.jpg\" alt=\"Supplier diagram showing recorder controls, thin profile and call/ambient modes\" width=\"800\" height=\"800\" loading=\"lazy\">\u003csmall>Supplier illustration \u00b7 final enclosure material to be confirmed\u003c/small>\u003c/div>\u003cdiv>\u003cdiv class=\"recorder-tabs\" role=\"tablist\" aria-label=\"Recording modes\">\u003cbutton id=\"ambient-tab\" role=\"tab\" aria-selected=\"true\" aria-controls=\"ambient-panel\" data-recorder-mode=\"ambient\">01 / Ambient\u003c/button>\u003cbutton id=\"call-tab\" role=\"tab\" aria-selected=\"false\" aria-controls=\"call-panel\" data-recorder-mode=\"call\" tabindex=\"-1\">02 / Calls\u003c/button>\u003c/div>\u003cdiv id=\"ambient-panel\" role=\"tabpanel\" aria-labelledby=\"ambient-tab\" data-recorder-panel=\"ambient\">\u003ch3>For the room around you.\u003c/h3>\u003cp>Meetings, interviews and spoken ideas. The supplier describes one-tap standalone recording, saved internally and synced to the app when connected.\u003c/p>\u003c/div>\u003cdiv id=\"call-panel\" role=\"tabpanel\" aria-labelledby=\"call-tab\" data-recorder-panel=\"call\" hidden=\"\">\u003ch3>For the other end of the line.\u003c/h3>\u003cp>A separate physical setting is intended for phone calls. The supplier describes contact-based capture; compatibility with specific phones and cases remains to be tested.\u003c/p>\u003c/div>\u003cp class=\"lf-small\">Mode descriptions follow supplier documentation.\u003c/p>\u003c/div>\u003c/div>\u003c/section>\n \u003csection class=\"lf-wrap lf-section lf-reveal\">\u003cdiv class=\"lf-section-heading\">\u003cp class=\"lf-eyebrow\">AFTER THE RECORDING\u003c/p>\u003ch2>From spoken words\u003cbr> to your next idea.\u003c/h2>\u003cp>The supplier\u2019s companion app describes these tools. The final service package and English-language experience are being evaluated.\u003c/p>\u003c/div>\u003cdiv class=\"lf-use-grid\">\u003carticle>\u003cspan>01 / CAPTURE\u003c/span>\u003ch3>A conversation, in writing.\u003c/h3>\u003cp>Transcription and speaker identification are designed to turn recorded discussions into readable notes.\u003c/p>\u003c/article>\u003carticle>\u003cspan>02 / ORGANISE\u003c/span>\u003ch3>Find the useful part.\u003c/h3>\u003cp>Summaries, mind maps and presentation generation offer different ways to revisit the material.\u003c/p>\u003c/article>\u003carticle>\u003cspan>03 / EXPLORE\u003c/span>\u003ch3>Keep the ideas moving.\u003c/h3>\u003cp>Voice Q&amp;A and translation add a conversational layer through the connected app.\u003c/p>\u003c/article>\u003c/div>\u003c/section>\n \u003csection class=\"lf-wrap lf-section lf-split lf-reveal\">\u003cdiv class=\"recorder-reference\">\u003cimg src=\"assets/ai-recorder-reference-3.jpg\" alt=\"Supplier app screenshots illustrating transcription, mind maps, summaries and voice Q&amp;A\" width=\"800\" height=\"800\" loading=\"lazy\">\u003csmall>Original supplier interface \u00b7 regional software and fees unconfirmed\u003c/small>\u003c/div>\u003cdiv>\u003cp class=\"lf-eyebrow\">HARDWARE MEETS SOFTWARE\u003c/p>\u003ch2>Record here.\u003cbr> Work with it there.\u003c/h2>\u003cp>The recorder handles capture. The phone app is where the supplier demonstrates transcripts, summaries and AI interactions.\u003c/p>\u003cp>We are checking how that experience works in English, which features require an account and what ongoing services cost.\u003c/p>\u003ca class=\"lf-source\" href=\"#recorder-specifications\">See the details \u2197\u003c/a>\u003c/div>\u003c/section>\n \u003csection class=\"lf-wrap lf-section lf-reveal\" id=\"recorder-specifications\">\u003cdiv class=\"lf-section-heading\">\u003cp class=\"lf-eyebrow\">THE HARDWARE &amp; THE DETAILS\u003c/p>\u003ch2>Inside the idea.\u003c/h2>\u003cp>Specifications below are supplier statements, not independent test results.\u003c/p>\u003c/div>\u003cdl class=\"lf-spec-table\">\u003cdiv>\u003cdt>Storage\u003c/dt>\u003cdd>32GB, as listed by the supplier\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Connectivity\u003c/dt>\u003cdd>Wi-Fi listed; final phone and app compatibility to be confirmed\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Recording modes\u003c/dt>\u003cdd>Physical call / ambient selector\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Battery\u003c/dt>\u003cdd>Up to 40 hours advertised in listing title; test conditions unconfirmed\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Profile\u003c/dt>\u003cdd>5.4 mm thickness claimed in supplier imagery\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Controls\u003c/dt>\u003cdd>Three physical buttons listed; dedicated AI control shown\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Attachment\u003c/dt>\u003cdd>Magnetic format described by supplier\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Finish\u003c/dt>\u003cdd>Dark finish. Listing title and images disagree on enclosure material\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>AI workflow\u003c/dt>\u003cdd>App-based transcription, summaries, speaker identification, Q&amp;A and translation\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Software\u003c/dt>\u003cdd>English interface, subscriptions and cloud/data terms under review\u003c/dd>\u003c/div>\u003c/dl>\u003ca class=\"lf-source\" href=\"https://www.alibaba.com/product-detail/Chat-GPT-AI-driven-32GB-Voice_1601799169978.html\" target=\"_blank\" rel=\"noopener noreferrer\">View the exact supplier listing \u2197\u003c/a>\u003c/section>\n \u003csection class=\"lf-wrap lf-section lf-reveal\">\u003cdiv class=\"lf-section-heading\">\u003cp class=\"lf-eyebrow\">GOOD TO KNOW\u003c/p>\u003ch2>A few clear answers.\u003c/h2>\u003c/div>\u003cdiv class=\"lf-faq\">\u003cdetails>\u003csummary>Is this a robot?\u003cspan aria-hidden=\"true\">+\u003c/span>\u003c/summary>\u003cp>It is a slim voice recorder. The twin circular controls give it a distinctive, almost robotic character, but it has no moving body or built-in face display.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>Can it record without a phone?\u003cspan aria-hidden=\"true\">+\u003c/span>\u003c/summary>\u003cp>The supplier describes standalone ambient recording to internal storage, followed by syncing when connected to a phone. AI processing is an app-based workflow.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>Are AI services included?\u003cspan aria-hidden=\"true\">+\u003c/span>\u003c/summary>\u003cp>Not yet confirmed. We are checking the software package, English-language experience, account requirements and any subscription or usage fees before offering it for sale.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>Does it support call recording on my phone?\u003cspan aria-hidden=\"true\">+\u003c/span>\u003c/summary>\u003cp>The supplier shows a dedicated call mode. Compatibility with particular phones, cases and calling apps still needs testing.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>Is it an OpenAI or ChatGPT device?\u003cspan aria-hidden=\"true\">+\u003c/span>\u003c/summary>\u003cp>No. This is a third-party supplier product. The seller uses AI platform names in its marketing; that does not establish an official partnership or included access.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>When can I order in the US or Canada?\u003cspan aria-hidden=\"true\">+\u003c/span>\u003c/summary>\u003cp>This page is a collection preview. Retail price, final specification, delivery and warranty will be confirmed before orders open.\u003c/p>\u003c/details>\u003c/div>\u003c/section>\n \u003csection class=\"lf-wrap lf-section lf-related\">\u003cdiv class=\"lf-section-heading\">\u003cp class=\"lf-eyebrow\">KEEP EXPLORING\u003c/p>\u003ch2>Curiosity looks good on you.\u003c/h2>\u003c/div>\u003cdiv>\u003ca href=\"sc-s1-companion-robot.html\">\u003cimg src=\"assets/sc-s1-companion-robot-card-real-v1.webp\" alt=\"SC-S1 Companion Robot \u2014 generated lifestyle concept\" loading=\"lazy\">\u003cspan>Smart Living\u003c/span>\u003ch3>SC-S1 Companion Robot \u003cb>\u2197\u003c/b>\u003c/h3>\u003c/a>\u003ca href=\"levitating-speaker.html\">\u003cimg src=\"assets/levitating-speaker-card-real-v1.webp\" alt=\"Levitating Speaker \u2014 generated lifestyle concept\" loading=\"lazy\">\u003cspan>Levitating audio\u003c/span>\u003ch3>Levitating Speaker \u003cb>\u2197\u003c/b>\u003c/h3>\u003c/a>\u003ca href=\"lightfield-frame.html\">\u003cimg src=\"assets/lightfield-frame-life-1-v1.webp\" alt=\"Lightfield Frame \u2014 generated lifestyle concept\" loading=\"lazy\">\u003cspan>Spatial displays\u003c/span>\u003ch3>Lightfield Frame \u003cb>\u2197\u003c/b>\u003c/h3>\u003c/a>\u003c/div>\u003ca class=\"lf-source\" href=\"gadgets.html\">Explore Gadgets \u2197\u003c/a>\u003c/section>\u003c/main>\u003cfooter class=\"site-footer\">\u003cdiv class=\"lf-wrap lf-footer\">\u003ca class=\"on-logo\" href=\"index.html\">NEXORA\u003c/a>\u003cp>A little ahead. Right at home.\u003c/p>\u003cnav aria-label=\"Footer\">\u003ca href=\"shop.html#catalog-products\">Collection\u003c/a>\u003ca href=\"nexus-hub.html\">Nexus Hub\u003c/a>\u003ca href=\"product.html\">Recorder showcase\u003c/a>\u003c/nav>\u003csmall>\u00a9 2026 Nexora\u003c/small>\u003c/div>\u003c/footer>\n\u003cscript src=\"assets/nexora-cart.js\">\u003c/script>\u003cscript src=\"assets/nexora-discovery.js\">\u003c/script>\u003c/body>\u003c/html>","ar99-display-glasses.html":"\u003c!DOCTYPE html>\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>AR99 Display Glasses \u2014 Nexora\u003c/title>\u003clink rel=\"stylesheet\" href=\"assets/theme.css\">\u003cscript src=\"assets/theme.js\" defer=\"\">\u003c/script>\u003cscript src=\"assets/product.js\" defer=\"\">\u003c/script>\u003clink rel=\"stylesheet\" href=\"assets/shared-navigation.css\">\u003clink rel=\"stylesheet\" href=\"assets/catalog.css\">\u003cscript src=\"assets/opennote-menu.js?v=lf2\" defer=\"\">\u003c/script>\u003cscript src=\"assets/catalog.js\" defer=\"\">\u003c/script>\u003clink rel=\"stylesheet\" href=\"assets/oem-candidates.css\">\u003cscript src=\"assets/oem-candidates.js\" defer=\"\">\u003c/script>\u003 003c/p>\u003cdiv class=\"robot-status\">\u003cstrong>Under consideration\u003c/strong>\u003cp>Price and availability have not been confirmed. This model is not available to order.\u003c/p>\u003c/div>\u003cdiv class=\"robot-specs\">\u003cspan>Color\u003cbr>\u003cstrong>Black\u003c/strong>\u003c/span>\u003cspan>Supplier model\u003cbr>\u003cstrong>AR99 supplier platform\u003c/strong>\u003c/span>\u003c/div>\u003ca class=\"nx-button\" href=\"#robot-details\">Explore the details \u2193\u003c/a>\u003c/div>\u003c/div>\u003cdiv class=\"robot-features\" id=\"robot-details\">\u003carticle>\u003ch2>Information in view\u003c/h2>\u003cp>A single-green display presents information to the right eye.\u003c/p>\u003c/article>\u003carticle>\u003ch2>Connected to your phone\u003c/h2>\u003cp>Bluetooth connects the hardware to a paired phone; supported features depend on the app.\u003c/p>\u003c/article>\u003carticle>\u003ch2>An understated frame\u003c/h2>\u003cp>A camera-free design keeps the form familiar.\u003c/p>\u003c/article>\u003carticle>\u003ch2>A more personal interface\u003c/h2>\u003cp>Own-brand configuration and software scope are under evaluation.\u003c/p>\u003c/article>\u003c/div>\u003cdetails class=\"candidate-details\">\u003csummary>Before this model joins the collection\u003c/summary>\u003cp>This is not a full-colour cinema display. Navigation, captions and assistant functions depend on the agreed software package.\u003c/p>\u003cp>Supplier advertises branded pilots from 200 units. Pricing, English app experience and US/Canada support remain unconfirmed.\u003c/p>\u003cp>Supplier-listed features have not been independently tested. Branding, warranty and delivery terms are pending.\u003c/p>\u003ca href=\"https://www.topaiglasses.com/ar99.html\" target=\"_blank\" rel=\"noopener\">View the supplier specification \u2197\u003c/a>\u003c/details>\u003c/section>\u003clink rel=\"stylesheet\" href=\"assets/robot-lifestyle.css\">\u003csection class=\"robot-life candidate-life\" aria-labe f=\"shop.html\">Discover the collection \u003cspan>\u2197\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/details>\u003cdetails>\u003csummary class=\"nx-hover-button\">\u003cspan class=\"nx-hover-label\">Support\u003c/span>\u003cspan class=\"nx-hover-fill\" aria-hidden=\"true\">Support\u003c/span>\u003c/summary>\u003cdiv class=\"on-mini\">\u003cdiv class=\"on-menu-surface\">\u003ca href=\"store-guide.html?theme=blue\">Product guide \u003cspan>\u2197\u003c/span>\u003c/a>\u003ca href=\"store-faq.html?theme=blue\">FAQs \u003cspan>\u2197\u003c/span>\u003c/a>\u003ca href=\"store-contact.html?theme=blue\">Contact us \u003cspan>\u2197\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/details>\u003c/nav>\u003cdiv class=\"on-header-icons\">\u003ca href=\"#search\" aria-label=\"Search\">\u003csvg viewBox=\"0 0 24 24\">\u003ccircle cx=\"10\" cy=\"10\" r=\"7\">\u003c/circle>\u003cpath d=\"m15 15 6 6\">\u003c/path>\u003c/svg>\u003c/a>\u003ca href=\"#account\" aria-label=\"Account\">\u003csvg viewBox=\"0 0 24 24\">\u003ccircle cx=\"12\" cy=\"7\" r=\"4\">\u003c/circle>\u003cpath d=\"M3 23v-3c0-7 18-7 18 0v3\">\u003c/path>\u003c/svg>\u003c/a>\u003ca href=\"#cart\" aria-label=\"Cart\">\u003csvg viewBox=\"0 0 24 24\">\u003cpath d=\"M1 2h3l3 14h13l3-11H5\">\u003c/path>\u003ccircle cx=\"9\" cy=\"21\" r=\"1\">\u003c/circle>\u003ccircle cx=\"19\" cy=\"21\" r=\"1\">\u003c/circle>\u003c/svg>\u003c/a>\u003c/div>\u003c/div>\u003cdiv class=\"on-menu-backdrop\" aria-hidden=\"true\">\u003c/div>\u003c/header>\u003cmain id=\"MainContent\">\u003csection class=\"lf-intro lf-wrap\">\u003ca class=\"lf-crumb\" href=\"shop.html#catalog-products\">\u2190 Explore the collection\u003c/a>\u003cdiv class=\"robot-grid lf-product\" id=\"lf-product\">\u003cdiv class=\"lf-gallery\">\u003cimg id=\"lf-main-image\" src=\"assets/lightfield-frame-life-1-v1.webp\" alt=\"Generated lifestyle concept of a wood depth frame in a real home\" width=\"1672\" height=\"941\" fetchpriority=\"high\">\u003cdiv class=\"lf-thumbs\" role=\"group\" aria-label=\"Product gallery\">\u003cbutton type=\"button\" data-lf-image=\"assets/lightfield-frame-life-1-v1.webp\" data-lf-alt=\"Generated lifestyle concept of a wood depth frame in a real home\" data-lf-caption=\"Generated lifestyle concept. Frame appearance follows the supplier reference; displayed content is illustrative.\" aria-label=\"Show evening scene\" aria-pressed=\"true\">\u003cimg src=\"assets/lightfield-frame-life-1-v1.webp\" alt=\"\" width=\"100\" height=\"80\">\u003c/button>\u003cbutton type=\"button\" data-lf-image=\"assets/lightfield-frame-life-2-v1.webp\" data-lf-alt=\"Generated lifestyle concept with an illustrative pet portrait on screen\" data-lf-caption=\"Generated lifestyle concept. Frame appearance follows the supplier reference; displayed content is illustrative.\" aria-label=\"Show personal portrait scene\" aria-pressed=\"false\">\u003cimg src=\"assets/lightfield-frame-life-2-v1.webp\" alt=\"\" width=\"100\" height=\"80\">\u003c/button>\u003cbutton type=\"button\" data-lf-image=\"assets/depth-frame-reference-3.png\" data-lf-alt=\"Manufacturer wood-frame illustration; imagery outside the frame is an exaggerated visualization\" data-lf-caption=\"Manufacturer visualization. The protruding characters exaggerate optical depth; the device does not project objects into the room.\" aria-label=\"Show manufacturer reference\" aria-pressed=\"false\">\u003cimg src=\"assets/depth-frame-reference-3.png\" alt=\"\" width=\"100\" height=\"80\">\u003c/button>\u003c/div>\u003cp id=\"lf-image-caption\">Generated lifestyle concept. Frame appearance follows the supplier reference; displayed content is illustrative.\u003c/p>\u003c/div>\u003cdiv class=\"robot-copy lf-copy\">\u003cp class=\"lf-eyebrow\">NEXORA / SPATIAL DISPLAYS\u003c/p>\u003ch1>Lightfield\u003cbr> Frame\u003c/h1>\u003cp class=\"lf-deck\">A nostalgic touch.\u003cbr> A new dimension.\u003c/p>\u003cp>Warm wood. Familiar design. A glasses-free depth display that adds something unexpected to your space.\u003c/p>\u003cdiv class=\"lf-highlights\">\u003cspan>7.9-inch display\u003c/span>\u003cspan>49 views\u003c/span>\u003cspan>Natural wood\u003c/span>\u003c/div>\u003cdiv class=\"robot-status lf-status\">\u003cstrong>Collection preview\u003c/strong>\u003cp>Price and availability to be announced. Ordering is not open yet.\u003c/p>\u003c/div>\u003ca class=\"lf-button\" href=\"#robot-details\">Explore the frame \u003cspan>\u2193\u003c/span>\u003c/a>\u003cp class=\"lf-small\">E3D Holo Frame platform \u00b7 Wood configuration\u003c/p>\u003c/div>\u003c/div>\u003c/section>\n \u003csection class=\"lf-banner\" id=\"robot-details\">\u003cimg src=\"assets/lightfield-frame-life-1-v1.webp\" alt=\"Generated evening home scene with the frame displaying original sculptural artwork\" width=\"1672\" height=\"941\" loading=\"lazy\">\u003cdiv class=\"lf-banner-copy lf-reveal\">\u003cp class=\"lf-eyebrow\">NOSTALGIC BY DESIGN\u003c/p>\u003ch2>A familiar frame.\u003cbr> An unexpected view.\u003c/h2>\u003cp>Natural texture and a simple silhouette give the display its nostalgic character. The depth is the unexpected part.\u003c/p>\u003c/div>\u003csmall>Generated lifestyle concept\u003c/small>\u003c/section>\n \u003csection class=\"lf-wrap lf-section lf-reveal\" id=\"lf-depth\">\u003cdiv class=\"lf-section-heading\">\u003cp class=\"lf-eyebrow\">BEYOND A FLAT PICTURE\u003c/p>\u003ch2>A little movement.\u003cbr>A different perspective.\u003c/h2>\u003cp>The display sends different views across its viewing zone, giving suitable content a sense of depth as your position changes.\u003c/p>\u003c/div>\u003cdiv class=\"lf-principle\">\u003cdiv class=\"lf-view-diagram\" aria-label=\"Schematic showing three different viewing directions toward a frame\">\u003cdiv class=\"lf-mini-frame\">\u003cspan>3D\u003c/span>\u003c/div>\u003cdiv class=\"lf-view-rays\">\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003c/div>\u003cdiv class=\"lf-views\">\u003cspan>Left view\u003c/span>\u003cspan>Centre view\u003c/span>\u003cspan>Right view\u003c/span>\u003c/div>\u003csmall>Viewing principle \u00b7 schematic, not a hardware demonstration\u003c/small>\u003c/div>\u003cdiv>\u003ch3>The effect lives in the screen.\u003c/h3>\u003cp>No headset. No object projected into your room. A multiview optical display creates different perspectives within the frame itself.\u003c/p>\u003cp>The manufacturer specifies 49 views. Content, viewing position and room lighting all affect what you see.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"lf-stat-grid\">\u003cdiv>\u003cstrong>7.9\u2033\u003c/strong>\u003cspan>Portrait display\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>49\u003c/strong>\u003cspan>Manufacturer-listed views\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>19.3 cm\u003c/strong>\u003cspan>Approximate frame height\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>0.8 kg\u003c/strong>\u003cspan>Wood configuration\u003c/span>\u003c/div>\u003c/div>\u003c/section>\n \u003csection class=\"lf-wrap lf-section lf-split lf-reveal\">\u003cdiv class=\"lf-story-image\">\u003cimg src=\"assets/lightfield-frame-life-2-v1.webp\" alt=\"Generated natural-wood frame scene with an illustrative golden retriever portrait\" width=\"1672\" height=\"941\" loading=\"lazy\">\u003csmall>Generated lifestyle concept \u00b7 illustrative screen content\u003c/small>\u003c/div>\u003cdiv>\u003cp class=\"lf-eyebrow\">YOUR OWN PERSPECTIVE\u003c/p>\u003ch2>Make it yours.\u003c/h2>\u003cp>A portrait, a pet or an original scene. Choose imagery that feels at home in your space.\u003c/p>\u003cp>The manufacturer offers cloud conversion from ordinary photos to depth content. Conversion quality depends on the image; the final service and any fees will be confirmed before ordering opens.\u003c/p>\u003c/div>\u003c/section>\n \u003csection class=\"lf-wrap lf-section lf-reveal\">\u003cdiv class=\"lf-section-heading\">\u003cp class=\"lf-eyebrow\">ROOM FOR YOUR IMAGINATION\u003c/p>\u003ch2>What would you keep in yours?\u003c/h2>\u003c/div>\u003cdiv class=\"lf-use-grid\">\u003carticle>\u003cspan>01 / PERSONAL\u003c/span>\u003ch3>Favourite faces.\u003c/h3>\u003cp>Explore depth portraits made from the images that already mean something to you.\u003c/p>\u003c/article>\u003carticle>\u003cspan>02 / CREATIVE\u003c/span>\u003ch3>A small world of your own.\u003c/h3>\u003cp>The manufacturer lists a Unity plug-in for preparing compatible 3D imagery and video.\u003c/p>\u003c/article>\u003carticle>\u003cspan>03 / EVERYDAY\u003c/span>\u003ch3>A place in your space.\u003c/h3>\u003cp>A compact wooden enclosure brings the technology into a desk, shelf or quiet corner.\u003c/p>\u003c/article>\u003c/div>\u003c/section>\n \u003csection class=\"lf-wrap lf-section lf-reveal\" id=\"lf-specifications\">\u003cdiv class=\"lf-section-heading\">\u003cp class=\"lf-eyebrow\">THE DETAILS\u003c/p>\u003ch2>Inside the frame.\u003c/h2>\u003cp>Manufacturer-listed specifications for the wood configuration. Final Nexora configuration is subject to confirmation.\u003c/p>\u003c/div>\u003cdl class=\"lf-spec-table\">\u003cdiv>\u003cdt>Display\u003c/dt>\u003cdd>7.9-inch portrait / 1536 \u00d7 2048 panel resolution\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Optics\u003c/dt>\u003cdd>49-view multiview display; panel resolution is not resolution per view\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Enclosure\u003c/dt>\u003cdd>Wood / 192.7 \u00d7 152.8 \u00d7 48.3 mm\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Weight\u003c/dt>\u003cdd>0.8 kg (device)\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Brightness\u003c/dt>\u003cdd>250 cd/m\u00b2\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Touch\u003c/dt>\u003cdd>Listed for the wood configuration\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Memory\u003c/dt>\u003cdd>2 GB RAM / 32 GB storage\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Power\u003c/dt>\u003cdd>5 V \u2393 2 A; manufacturer lists a built-in battery, runtime unconfirmed\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Content\u003c/dt>\u003cdd>Holo OS / multi-tile format / cloud 2D-to-3D conversion\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Creator tools\u003c/dt>\u003cdd>Manufacturer-listed Unity plug-in\u003c/dd>\u003c/div>\u003c/dl>\u003ca class=\"lf-source\" href=\"https://www.e3d-meta.com/product/a-holographic-frame-that-combines-light-field-and-stereo-display-technology/\" target=\"_blank\" rel=\"noopener noreferrer\">View manufacturer specifications \u2197\u003c/a>\u003c/section>\n \u003csection class=\"lf-wrap lf-section lf-reveal\" id=\"lf-faq\">\u003cdiv class=\"lf-section-heading\">\u003cp class=\"lf-eyebrow\">A CLEARER PICTURE\u003c/p>\u003ch2>Good questions.\u003c/h2>\u003c/div>\u003cdiv class=\"lf-faq\">\u003cdetails>\u003csummary>Does it project a hologram into the room?\u003cspan aria-hidden=\"true\">+\u003c/span>\u003c/summary>\u003cp>No. The depth effect is produced within a multiview screen. Manufacturer artwork may illustrate content protruding from the frame, but that is not free-space projection.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>Can I use my own photographs?\u003cspan aria-hidden=\"true\">+\u003c/span>\u003c/summary>\u003cp>The manufacturer offers cloud conversion of photos into depth content. We are confirming the final upload process, account requirements and any conversion fees.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>Can several people see the same effect?\u003cspan aria-hidden=\"true\">+\u003c/span>\u003c/summary>\u003cp>The listed 49 views describe the display\u2019s viewing perspectives, not a guarantee of 49 viewers. The viewing zone and content determine the experience; we have not independently tested it.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>Is the metal version the same?\u003cspan aria-hidden=\"true\">+\u003c/span>\u003c/summary>\u003cp>No. The supplier lists separate wood and metal configurations with different electronics, inputs and power. The specifications on this page refer to the wood version.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>When can I order?\u003cspan aria-hidden=\"true\">+\u003c/span>\u003c/summary>\u003cp>This is a collection preview. Price, final configuration, warranty and delivery to the US and Canada will be published before ordering opens.\u003c/p>\u003c/details>\u003c/div>\u003c/section>\n \u003csection class=\"lf-wrap lf-section lf-related\">\u003cdiv class=\"lf-section-heading\">\u003cp class=\"lf-eyebrow\">KEEP EXPLORING\u003c/p>\u003ch2>A little further into tomorrow.\u003c/h2>\u003c/div>\u003cdiv>\u003ca href=\"sc-s1-companion-robot.html\">\u003cimg src=\"assets/sc-s1-companion-robot-card-real-v1.webp\" alt=\"SC-S1 Companion Robot \u2014 generated lifestyle concept\" loading=\"lazy\" width=\"1400\" height=\"500\">\u003cspan>Smart Living\u003c/span>\u003ch3>SC-S1 Companion Robot \u003cb aria-hidden=\"true\">\u2197\u003c/b>\u003c/h3>\u003c/a>\u003ca href=\"levitating-speaker.html\">\u003cimg src=\"assets/levitating-speaker-card-real-v1.webp\" alt=\"Levitating Speaker \u2014 generated lifestyle concept\" loading=\"lazy\" width=\"1400\" height=\"500\">\u003cspan>Levitating audio\u003c/span>\u003ch3>Levitating Speaker \u003cb aria-hidden=\"true\">\u2197\u003c/b>\u003c/h3>\u003c/a>\u003ca href=\"ar99-display-glasses.html\">\u003cimg src=\"assets/ar99-display-glasses-card-real-v1.webp\" alt=\"AR99 Display Glasses \u2014 generated lifestyle concept\" loading=\"lazy\" width=\"1400\" height=\"500\">\u003cspan>Wearable displays\u003c/span>\u003ch3>AR99 Display Glasses \u003cb aria-hidden=\"true\">\u2197\u003c/b>\u003c/h3>\u003c/a>\u003c/div>\u003ca class=\"lf-source\" href=\"shop.html#catalog-products\">Explore all products \u2197\u003c/a>\u003c/section>\u003c/main>\u003cfooter class=\"site-footer\">\u003cdiv class=\"lf-wrap lf-footer\">\u003ca class=\"on-logo\" href=\"index.html\">NEXORA\u003c/a>\u003cp>A little ahead. Right at home.\u003c/p>\u003cnav aria-label=\"Footer\">\u003ca href=\"shop.html#catalog-products\">Collection\u003c/a>\u003ca href=\"nexus-hub.html\">Nexus Hub\u003c/a>\u003ca hre 003cspan>\u2197\u003c/span>\u003c/a>\u003ca href=\"shop.html\">Discover the collection \u003cspan>\u2197\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/details>\u003cdetails>\u003csummary class=\"nx-hover-button\">\u003cspan class=\"nx-hover-label\">Support\u003c/span>\u003cspan class=\"nx-hover-fill\" aria-hidden=\"true\">Support\u003c/span>\u003c/summary>\u003cdiv class=\"on-mini\">\u003cdiv class=\"on-menu-surface\">\u003ca href=\"store-guide.html?theme=blue\">Product guide \u003cspan>\u2197\u003c/span>\u003c/a>\u003ca href=\"store-faq.html?theme=blue\">FAQs \u003cspan>\u2197\u003c/span>\u003c/a>\u003ca href=\"store-contact.html?theme=blue\">Contact us \u003cspan>\u2197\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/details>\u003c/nav>\u003cdiv class=\"on-header-icons\">\u003ca href=\"#search\" aria-label=\"Search\">\u003csvg viewBox=\"0 0 24 24\">\u003ccircle cx=\"10\" cy=\"10\" r=\"7\">\u003c/circle>\u003cpath d=\"m15 15 6 6\">\u003c/path>\u003c/svg>\u003c/a>\u003ca href=\"#account\" aria-label=\"Account\">\u003csvg viewBox=\"0 0 24 24\">\u003ccircle cx=\"12\" cy=\"7\" r=\"4\">\u003c/circle>\u003cpath d=\"M3 23v-3c0-7 18-7 18 0v3\">\u003c/path>\u003c/svg>\u003c/a>\u003ca href=\"#cart\" aria-label=\"Cart\">\u003csvg viewBox=\"0 0 24 24\">\u003cpath d=\"M1 2h3l3 14h13l3-11H5\">\u003c/path>\u003ccircle cx=\"9\" cy=\"21\" r=\"1\">\u003c/circle>\u003ccircle cx=\"19\" cy=\"21\" r=\"1\">\u003c/circle>\u003c/svg>\u003c/a>\u003c/div>\u003c/div>\u003cdiv class=\"on-menu-backdrop\" aria-hidden=\"true\">\u003c/div>\u003c/header>\u003cmain id=\"MainContent\">\u003csection class=\"hub-hero\">\u003cdiv class=\"wrap\">\u003cp class=\"eyebrow\">NEXUS HUB / CONNECTED LIVING\u003c/p>\u003ch1>Bring your smart home together.\u003c/h1>\u003cdiv class=\"intro\">\u003cp>A closer look at how a central hub can help compatible devices work together. Simpler controls. More considered routines. A home that works around you.\u003c/p>\u003c/div>\u003ca class=\"button\" href=\"#hub-guide\">Explore the possibilities \u2193\u003c/a>\u003c/div>\u003cdiv class=\"hub-image\">\u003cimg src=\"assets/product.webp\" alt=\"Nexus Hub concept illustration with connected home devices\" width=\"1536\" height=\"1024\">\u003c/div>\u003cp class=\"fineprint wrap\">Concept imagery. Explore individual product listings for confirmed features and availability.\u003c/p>\u003c/section>\u003csection class=\"wrap section-pad\" id=\"hub-guide\">\u003cdiv class=\"section-heading\">\u003cp class=\"eyebrow\">THE IDEA IS SIMPLE\u003c/p>\u003ch2>One place. More possibilities.\u003c/h2>\u003c/div>\u003cdiv class=\"guide-grid\">\u003carticle class=\"guide-card\">\u003cspan class=\"value-number\">01\u003c/span>\u003ch3>Connect with intention.\u003c/h3>\u003cdiv class=\"rte\">\u003cp>A hub is a central point for compatible smart devices. Start by checking the exact models and connection standards you already use.\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"guide-card\">\u003cspan class=\"value-number\">02\u003c/span>\u003ch3>Make a useful routine.\u003c/h3>\u003cdiv class=\"rte\">\u003cp>Link a trigger to an action: a time of day, a sensor reading, or a button press. Start small and test each routine.\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"guide-card\">\u003cspan class=\"value-number\">03\u003c/span>\u003ch3>Keep everyday control.\u003c/h3>\u003cdiv class=\"rte\">\u003cp>Think about everyone who shares your space. Clear controls and simple manual options matter as much as automation.\u003c/p>\u003c/div>\u003c/article>\u003c/div>\u003c/section>\u003csection class=\"hub-routines section-pad\">\u003cdiv class=\"wrap routine-layout\">\u003cdiv>\u003cp class=\"eyebrow\">ROOM FOR BETTER ROUTINES\u003c/p>\u003ch2>Less switching.\u003cbr>More living.\u003c/h2>\u003cp class=\"intro\">Start with one useful idea. Build from there.\u003c/p>\u003c/div>\u003cdiv>\u003cdetails class=\"accordion\">\u003csummary>01 / A gentler morning\u003cspan>+\u003c/span>\u003c/summary>\u003cdiv class=\"rte\">\u003cp>With compatible lights and scheduling, a morning routine can bring light into your room gradually. Choose the timing and brightness that work for you.\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"accordion\">\u003csummary>02 / A little more focus\u003cspan>+\u003c/span>\u003c/summary>\u003cdiv class=\"rte\">\u003cp>A single scene can set compatible desk lighting and reduce distractions. Keep the controls close, so you can change the mood whenever you need.\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"accordion\">\u003csummary>03 / Wind down your way\u003cspan>+\u003c/span>\u003c/summary>\u003cdiv class=\"rte\">\u003cp>Group compatible lamps into an evening scene. Build routines around real habits, and keep a manual switch available.\u003c/p>\u003c/div>\u003c/details>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"wrap section-pad narrow\">\u003cp class=\"eyebrow\">BEFORE YOU CONNECT\u003c/p>\u003ch2>A few things worth knowing.\u003c/h2>\u003cdetails class=\"accordion\">\u003csummary>Will it work with my devices?\u003cspan>+\u003c/span>\u003c/summary>\u003cdiv class=\"rte\">\u003cp>Compatibility depends on the exact hub, device model, protocol, and software. Review the confirmed compatibility list on the product page before buying.\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"accordion\">\u003csummary>Does a hub need an internet connection?\u003cspan>+\u003c/span>\u003c/summary>\u003cdiv class=\"rte\">\u003cp>Some systems support local controls; others rely on cloud services. Offline behavior varies by product and integration. Check the specific product documentation.\u003c/p>\u003c/div>\u003c/details>\u003cdetails class=\"accordion\">\u003csummary>Are there subscriptions or extra accessories?\u003cspan>+\u003c/span>\u003c/summary>\u003cdiv class=\"rte\">\u003cp>Requirements vary. Check the listing for included accessories, optional services, subscription costs, and any extra bridges or adapt 003cdiv class=\"details__content text-base rte\">\n                          \u003cdiv class=\"specification grid grid-cols-12 gap-6 md:gap-10\">\u003cdiv class=\"col-span-full\">\u003cdiv class=\"grid grid-cols-12 gap-6 md:gap-10\">\u003cdiv class=\"col-span-full md:col-span-6\">\u003ch6 class=\"leading-none tracking-none\">Bluetooth Version\u003c/h6>\u003cp>5.3\u003c/p>\u003c/div>\u003cdiv class=\"col-span-full md:col-span-6\">\u003ch6 class=\"leading-none tracking-none\">Dual Device Connection\u003c/h6>\u003cp>Supported\u003c/p>\u003c/div>\u003cdiv class=\"col-span-full md:col-span-6\">\u003ch6 class=\"leading-none tracking-none\">Voice Control\u003c/h6>\u003cp>Supported\u003c/p>\u003c/div>\u003cdiv class=\"col-span-full md:col-span-6\">\u003ch6 class=\"leading-none tracking-none\">FlashRecord\u003c/h6>\u003cp>Supported\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n                        \u003c/div>\n                      \u003c/details>\n                    \u003c/div>\u003cdiv class=\"accordion\">\n                      \u003cdetails class=\"details\" is=\"accordion-details\">\n                        \u003csummary class=\"details__summary flex items-center justify-between gap-2 cursor-pointer\">\n                          \u003cspan class=\"heading text-base-xl font-medium leading-none flex items-center gap-2d5 md:gap-3\">Battery &amp; Charging\u003c/span>\u003csvg class=\"icon icon-plus-2 icon-xs shrink-0\" viewBox=\"0 0 14 14\" stroke=\"currentColor\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" role=\"presentation\">\n      \u003cpath stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M7 1V13M13 7H1\">\u003c/path>\n    \u003c/svg>\u003c/summary>\n                        \u003cdiv class=\"details__content text-base rte\">\n                          \u003cdiv class=\"specification grid grid-cols-12 gap-6 md:gap-10\">\u003cdiv class=\"col-span-full\">\u003cdiv class=\"grid grid-cols-12 gap-6 md:gap-10\">\u003cdiv class=\"col-span-full md:col-span-6\">\u003ch6 class=\"leading-none tracking-none\">Earbud Battery Life\u003c/h6>\u003cp>19 hours\u003c/p>\u003c/div>\u003cdiv class=\"col-span-full md:col-span-6\">\u003ch6 class=\"leading-none tracking-none\">Earbuds + Charging Case Battery Life\u003c/h6>\u003cp>53 hours\u003c/p>\u003c/div>\u003cdiv class=\"col-span-full md:col-span-6\">\u003ch6 class=\"leading-none tracking-none\">Earbud Battery Capacity\u003c/h6>\u003cp>115mAh\u003c/p>\u003c/div>\u003cdiv class=\"col-span-full md:col-span-6\">\u003ch6 class=\"leading-none tracking-none\">Charging Case Battery Capacity\u003c/h6>\u003cp>750mAh\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n                        \u003c/div>\n                      \u003c/details>\n                    \u003c/div>\u003cdiv class=\"accordion\">\n                      \u003cdetails class=\"details\" is=\"accordion-details\">\n                        \u003csummary class=\"details__summary flex items-center justify-between gap-2 cursor-pointer\">\n                          \u003cspan class=\"heading text-base-xl font-medium leading-none flex items-center gap-2d5 md:gap-3\">Design &amp; Weight\u003c/span>\u003csvg class=\"icon icon-plus-2 icon-xs shrink-0\" viewBox=\"0 0 14 14\" stroke=\"currentColor\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" role=\"presentation\">\n      \u003cpath stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M7 1V13M13 7H1\">\u003c/path>\n    \u003c/svg>\u003c/summary>\n                        \u003cdiv class=\"details__content text-base rte\">\n                          \u003cdiv class=\"specification grid grid-cols-12 gap-6 md:gap-10\">\u003cdiv class=\"col-span-full\">\u003cdiv class=\"grid grid-cols-12 gap-6 md:gap-10\">\u003cdiv class=\"col-span-full md:col-span-6\">\u003ch6 class=\"leading-none tracking-none\">Earbud Weight\u003c/h6>\u003cp>10.5g\u003c/p>\u003c/div>\u003cdiv class=\"col-span-full md:col-span-6\">\u003ch6 class=\"leading-none tracking-none\">Charging Case Weight\u003c/h6>\u003cp>55.5g\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n                        \u003c/div>\n                      \u003c/details>\n                    \u003c/div>\u003c/accordions-details>\n      \u003c/div>\u003cdiv class=\"grow-0\">\n          \u003csticky-element class=\"specs__sidebar flex flex-col gap-7d5 md:gap-10 relative lg:sticky top-0 text-center\">\n            \u003csvg class=\"icon-box\" viewBox=\"0 0 234 74\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" role=\"presentation\">\n              \u003cpath d=\"M0 20C0 8.95431 8.95431 0 20 0H214C225.046 0 234 8.9543 234 20V74H0V20Z\" fill=\"currentColor\">\u003c/path>\n              \u003crect x=\"58\" y=\"32\" width=\"118\" height=\"19\" rx=\"9.5\" class=\"fill\">\u003c/rect>\n              \u003ccircle cx=\"117.5\" cy=\"32.5\" r=\"11.5\" class=\"fill\">\u003c/circle>\n            \u003c/svg>\n            \u003cp class=\"heading lg:text-3xl text-2xl leading-none tracking-tight\">Included in the Box\u003c/p>\n            \u003cul class=\"flex flex-wrap items-start justify-center gap-6 md:gap-10\">\u003cli class=\"shrink-0 grid gap-2d5\">\u003cdiv class=\"media relative flex items-center justify-center rounded-full\">\u003cimg src=\"assets/on-e22e6311e235.svg\" alt=\"\" width=\"48\" height=\"48\" loading=\"lazy\" sizes=\"96px\" is=\"lazy-image\">\u003c/div>\u003cp class=\"text-base\">Earphones\u003c/p>\u003c/li>\u003cli class=\"shrink-0 grid gap-2d5\">\u003cdiv class=\"media relative flex items-center justify-center rounded-full\">\u003cimg src=\"assets/on-0602cc94f5b3.svg\" alt=\"\" width=\"48\" height=\"48\" loading=\"lazy\" sizes=\"96px\" is=\"lazy-image\">\u003c/div>\u003cp class=\"text-base\">Charging Case\u003c/p>\u003c/li>\u003cli class=\"shrink-0 grid gap-2d5\">\u003cdiv class=\"media relative flex items-center justify-center rounded-full\">\u003cimg src=\"assets/on-df59e8e51f93.svg\" alt=\"\" width=\"48\" height=\"48\" loading=\"lazy\" sizes=\"96px\" is=\"lazy-image\">\u003c/div>\u003cp class=\"text-sm\">USB-C Cable\u003c/p>\u003c/li>\u003cli class=\"shrink-0 grid gap-2d5\">\u003cdiv class=\"media relative flex items-center justify-center rounded-full\">\u003cimg src=\"assets/on-70dcafec86d1.svg\" alt=\"\" width=\"48\" height=\"48\" loading=\"lazy\" sizes=\"96px\" is=\"lazy-image\">\u003c/div>\u003cp class=\"text-sm\">Quick Start Guide\u003c/p>\u003c/li>\u003c/ul>\n          \u003c/sticky-element>\n        \u003c/div>\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\n\u003c/div>\n\u003cdiv data-on-section=\"13\" id=\"opennote-section-opennote-13\" class=\"shopify-section\">\u003cstyle>\n  #opennote-section-opennote-13 {\n    --section-padding-top: 72px;\n    --section-padding-bottom: 72px;--color-background: 23 23 23;--color-foreground: 255 255 255;\n  --color-border: var(--color-foreground)/ 0.1;\n  --color-border-dark: var(--color-foreground)/ 0.4;\n  --color-border-light: var(--color-foreground)/ 0.06;--color-highlight: 245 95 12;--color-overlay: 255 255 255;--overlay-opacity: 0.04;}\n\u003c/style>\n\n\u003cdiv class=\"section section--padding section--rounded relative\">\n  \u003cdiv class=\"page-width relative\">\u003cdiv class=\"title-wrapper leading-none gap-4 lg:gap-8 flex flex-col text-left md:items-end md:flex-row md:justify-between relative z-1\">\u003cdiv class=\"grid gap-4\">\u003ch2 class=\"heading title-md\">FAQs\u003c/h2>\u003c/div>\u003c/div>\u003cdiv class=\"faqs with-border flex flex-col lg:flex-row relative z-1\">\n        \u003cdiv class=\"grow grid gap-8 md:gap-12\">\u003cdiv class=\"faq\">\u003cdiv class=\"accordion\">\n                    \u003cdetails class=\"details\" is=\"accordion-details\">\n                      \u003csummary class=\"details__summary flex items-center justify-between gap-2 cursor-pointer\">\n                        \u003cspan class=\"text-base lg:text-lg xl:text-xl font-medium leading-tight\">What exactly is OpenNote?\u003c/span>\u003csvg class=\"icon icon-plus-2 icon-xs shrink-0\" viewBox=\"0 0 14 14\" stroke=\"currentColor\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" role=\"presentation\">\n      \u003cpath stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M7 1V13M13 7H1\">\u003c/path>\n    \u003c/svg>\u003c/summary>\n                      \u003cdiv class=\"details__content text-base rte\">\u003cp>OpenNote is an AI-powered note-taking device built into open-ear earbuds.\u003cbr>\u003cbr>It records conversations, transcribes them into text, and turns them into structured summaries, insights, and action items \u2014 automatically.\u003c/p>\u003c/div>\n                    \u003c/details>\n                  \u003c/div>\u003cdiv class=\"accordion\">\n                    \u003cdetails class=\"details\" is=\"accordion-details\">\n                      \u003csummary class=\"details__summary flex items-center justify-between gap-2 cursor-pointer\">\n                        \u003cspan class=\"text-base lg:text-lg xl:text-xl font-medium leading-tight\">How is OpenNote different from a normal voice recorder?\u003c/span>\u003csvg class=\"icon icon-plus-2 icon-xs shrink-0\" viewBox=\"0 0 14 14\" stroke=\"currentColor\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" role=\"presentation\">\n      \u003cpath stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M7 1V13M13 7H1\">\u003c/path>\n    \u003c/svg>\u003c/summary>\n                      \u003cdiv class=\"details__content text-base rte\">\u003cp>Unlike traditional recorders, OpenNote doesn\u2019t just capture audio.\u003cbr>\u003cbr>It understands conversations \u2014 turning them into searchable transcripts, summaries, and answers you can actually use.\u003c/p>\u003c/div>\n                    \u003c/details>\n                  \u003c/div>\u003cdiv class=\"accordion\">\n                    \u003cdetails class=\"details\" is=\"accordion-details\">\n                      \u003csummary class=\"details__summary flex items-center justify-between gap-2 cursor-pointer\">\n                        \u003cspan class=\"text-base lg:text-lg xl:text-xl font-medium leading-tight\">What can OpenNote record?\u003c/span>\u003csvg class=\"icon icon-plus-2 icon-xs shrink-0\" viewBox=\"0 0 14 14\" stroke=\"currentColor\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" role=\"presentation\">\n      \u003cpath stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M7 1V13M13 7H1\">\u003c/path>\n    \u003c/svg>\u003c/summary>\n                      \u003cdiv class=\"details__content text-base rte\">\u003cp>OpenNote can capture:\u003c/p>\u003cul>\u003cli>Phone and internet calls\u003cbr>\u003c/li>\u003cli>In-person meetings\u003cbr>\u003c/li>\u003cli>Podcasts, videos, and online content\u003cbr>\u003c/li>\u003cli>Personal voice notes and ideas\u003c/li>\u003c/ul>\u003c/div>\n                    \u003c/details>\n                  \u003c/div>\u003cdiv class=\"accordion\">\n                    \u003cdetails class=\"details\" is=\"accordion-details\">\n                      \u003csummary class=\"details__summary flex items-center justify-between gap-2 cursor-pointer\">\n                        \u003cspan class=\"text-base lg:text-lg xl:text-xl font-medium leading-tight\">Can I record without my phone?\u003c/span>\u003csvg class=\"icon icon-plus-2 icon-xs shrink-0\" viewBox=\"0 0 14 14\" stroke=\"currentColor\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" role=\"presentation\">\n      \u003cpath stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M7 1V13M13 7H1\">\u003c/path>\n    \u003c/svg>\u003c/summary>\n                      \u003cdiv class=\"details__content text-base rte\">\u003cp>Yes.\u003cbr>You can start recording directly from the OpenNote earbuds \u2014 no phone needed.\u003c/p>\u003c/div>\n                    \u003c/details>\n                  \u003c/div>\u003cdiv class=\"accordion\">\n                    \u003cdetails class=\"details\" is=\"accordion-details\">\n                      \u003csummary class=\"details__summary flex items-center justify-between gap-2 cursor-pointer\">\n                        \u003cspan class=\"text-base lg:text-lg xl:text-xl font-medium leading-tight\">Is it legal to record conversations?\u003c/span>\u003csvg class=\"icon icon-plus-2 icon-xs shrink-0\" viewBox=\"0 0 14 14\" stroke=\"currentColor\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" role=\"presentation\">\n      \u003cpath stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M7 1V13M13 7H1\">\u003c/path>\n    \u003c/svg>\u003c/summary>\n                      \u003cdiv class=\"details__content text-base rte\">\u003cp>Recording laws vary by country and region.\u003cbr>\u003cbr>OpenNote provides customizable recording notifications to help you stay compliant with local regulations.\u003c/p>\u003cp>We recommend always informing participants before recording.\u003c/p>\u003c/div>\n                    \u003c/details>\n                  \u003c/div>\u003cdiv class=\"accordion\">\n                    \u003cdetails class=\"details\" is=\"accordion-details\">\n                      \u003csummary class=\"details__summary flex items-center justify-between gap-2 cursor-pointer\">\n                        \u003cspan class=\"text-base lg:text-lg xl:text-xl font-medium leading-tight\">What kind of summaries can OpenNote generate?\u003c/span>\u003csvg class=\"icon icon-plus-2 icon-xs shrink-0\" viewBox=\"0 0 14 14\" stroke=\"currentColor\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" role=\"presentation\">\n      \u003cpath stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M7 1V13M13 7H1\">\u003c/path>\n    \u003c/svg>\u003c/summary>\n                      \u003cdiv class=\"details__content text-base rte\">\u003cp>OpenNote automatically creates:\u003c/p>\u003cul>\u003cli>Key points\u003cbr>\u003c/li>\u003cli>Action items\u003cbr>\u003c/li>\u003cli>Structured summaries\u003cbr>\u003c/li>\u003cli>Mind maps\u003c/li>\u003c/ul>\u003cp>You can also customize the format using templates or your own prompts.\u003c/p>\u003c/div>\n                    \u003c/details>\n                  \u003c/div>\u003cdiv class=\"accordion\">\n                    \u003cdetails class=\"details\" is=\"accordion-details\">\n                      \u003csummary class=\"details__summary flex items-center justify-between gap-2 cursor-pointer\">\n                        \u003cspan class=\"text-base lg:text-lg xl:text-xl font-medium leading-tight\">Can I edit or refine the AI results?\u003c/span>\u003csvg class=\"icon icon-plus-2 icon-xs shrink-0\" viewBox=\"0 0 14 14\" stroke=\"currentColor\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" role=\"presentation\">\n      \u003cpath stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M7 1V13M13 7H1\">\u003c/path>\n    \u003c/svg>\u003c/summary>\n                      \u003cdiv class=\"details__content text-base rte\">\u003cp>Yes.\u003cbr>You can regenerate, edit, or ask AI to adjust the summary based on your needs \u2014 shorter, more detailed, or focused on specific topics.\u003c/p>\u003c/div>\n                    \u003c/details>\n                  \u003c/div>\u003cdiv class=\"accordion\">\n                    \u003cdetails class=\"details\" is=\"accordion-details\">\n                      \u003csummary class=\"details__summary flex items-center justify-between gap-2 cursor-pointer\">\n                        \u003cspan class=\"text-base lg:text-lg xl:text-xl font-medium leading-tight\">Can I upload my own files?\u003c/span>\u003csvg class=\"icon icon-plus-2 icon-xs shrink-0\" viewBox=\"0 0 14 14\" stroke=\"currentColor\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" role=\"presentation\">\n      \u003cpath stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M7 1V13M13 7H1\">\u003c/path>\n    \u003c/svg>\u003c/summary>\n                      \u003cdiv class=\"details__content text-base rte\">\u003cp>Yes.\u003cbr>You can upload audio recordings, documents, or notes, and viaim App will process them with the same AI capabilities.\u003c/p>\u003c/div>\n                    \u003c/details>\n                  \u003c/div>\u003cdiv class=\"accordion\">\n                    \u003cdetails class=\"details\" is=\"accordion-details\">\n                      \u003csummary class=\"details__summary flex items-center justify-between gap-2 cursor-pointer\">\n                        \u003cspan class=\"text-base lg:text-lg xl:text-xl font-medium leading-tight\">Do I need the app to use OpenNote?\u003c/span>\u003csvg class=\"icon icon-plus-2 icon-xs shrink-0\" viewBox=\"0 0 14 14\" stroke=\"currentColor\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" role=\"presentation\">\n      \u003cpath stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M7 1V13M13 7H1\">\u003c/path>\n    \u003c/svg>\u003c/summary>\n                      \u003cdiv class=\"details__content text-base rte\">\u003cp>The app is used to control recordings and manage device settings.\u003cbr>\u003cbr>For deeper work like editing summaries and organizing notes, you can use the web platform.\u003c/p>\u003c/div>\n                    \u003c/details>\n                  \u003c/div>\u003cdiv class=\"accordion\">\n                    \u003cdetails class=\"details\" is=\"accordion-details\">\n                      \u003csummary class=\"details__summary flex items-center justify-between gap-2 cursor-pointer\">\n                        \u003cspan class=\"text-base lg:text-lg xl:text-xl font-medium leading-tight\">Do I need a subscription to use OpenNote?\u003c/span>\u003csvg class=\"icon icon-plus-2 icon-xs shrink-0\" viewBox=\"0 0 14 14\" stroke=\"currentColor\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" role=\"presentation\">\n      \u003cpath stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M7 1V13M13 7H1\">\u003c/path>\n    \u003c/svg>\u003c/summary>\n                      \u003cdiv class=\"details__content text-base rte\">\u003cp>No.\u003cbr>You get 600 minutes of transcription every month for free \u2014 no subscription required.\u003c/p>\u003c/div>\n                    \u003c/details>\n                  \u003c/div>\u003cdiv class=\"accordion\">\n                    \u003cdetails class=\"details\" is=\"accordion-details\">\n                      \u003csummary class=\"details__summary flex items-center justify-between gap-2 cursor-pointer\">\n                        \u003cspan class=\"text-base lg:text-lg xl:text-xl font-medium leading-tight\">Are there any hidden fees?\u003c/span>\u003csvg class=\"icon icon-plus-2 icon-xs shrink-0\" viewBox=\"0 0 14 14\" stroke=\"currentColor\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" role=\"presentation\">\n      \u003cpath stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M7 1V13M13 7H1\">\u003c/path>\n    \u003c/svg>\u003c/summary>\n                      \u003cdiv class=\"details__content text-base rte\">\u003cp>No.\u003cbr>All pricing is transparent, and you only upgrade if you choose to.\u003c/p>\u003c/div>\n                    \u003c/details>\n                  \u003c/div>\u003cdiv class=\"accordion\">\n                    \u003cdetails class=\"details\" is=\"accordion-details\">\n                      \u003csummary class=\"details__summary flex items-center justify-between gap-2 cursor-pointer\">\n                        \u003cspan class=\"text-base lg:text-lg xl:text-xl font-medium leading-tight\">Is it just for work?\u003c/span>\u003csvg class=\"icon icon-plus-2 icon-xs shrink-0\" viewBox=\"0 0 14 14\" stroke=\"currentColor\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" role=\"presentation\">\n      \u003cpath stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M7 1V13M13 7H1\">\u003c/path>\n    \u003c/svg>\u003c/summary>\n                      \u003cdiv class=\"details__content text-base rte\">\u003cp>Not at all.\u003cbr>While OpenNote is built for professional use, it\u2019s also perfect for learning, personal notes, and everyday ideas.\u003c/p>\u003c/div>\n                    \u003c/details>\n                  \u003c/div>\u003cdiv class=\"accordion\">\n                    \u003cdetails class=\"details\" is=\"accordion-details\">\n                      \u003csummary class=\"details__summary flex items-center justify-between gap-2 cursor-pointer\">\n                        \u003cspan class=\"text-base lg:text-lg xl:text-xl font-medium leading-tight\">What\u2019s the difference between OpenNote and RecDot?\u003c/span>\u003csvg class=\"icon icon-plus-2 icon-xs shrink-0\" viewBox=\"0 0 14 14\" stroke=\"currentColor\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" role=\"presentation\">\n      \u003cpath stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M7 1V13M13 7H1\">\u003c/path>\n    \u003c/svg>\u003c/summary>\n                      \u003cdiv class=\"details__content text-base rte\">\u003cp>Both share the same AI engine \u2014 78-language transcription, summaries, and action items.\u003cbr>\u003cbr>OpenNote uses an \u003cstrong>open-ear design with ENC\u003c/strong> and a 53-hour battery, so you stay aware of your surroundings while recording.\u003cbr>RecDot uses an \u003cstrong>in-ear design with 48dB ANC\u003c/strong> and a 36-hour battery, built for deeper noise isolation and one-tap recording from both the earbuds and the charging case.\u003c/p>\u003c/div>\n                    \u003c/details>\n                  \u003c/div>\u003cdiv class=\"accordion\">\n                    \u003cdetails class=\"details\" is=\"accordion-details\">\n                      \u003csummary class=\"details__summary flex items-center justify-between gap-2 cursor-pointer\">\n                        \u003cspan class=\"text-base lg:text-lg xl:text-xl font-medium leading-tight\">Which one should I choose for meetings \u2014 OpenNote or RecDot?\u003c/span>\u003csvg class=\"icon icon-plus-2 icon-xs shrink-0\" viewBox=\"0 0 14 14\" stroke=\"currentColor\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" role=\"presentation\">\n      \u003cpath stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M7 1V13M13 7H1\">\u003c/path>\n    \u003c/svg>\u003c/summary>\n                      \u003cdiv class=\"details__content text-base rte\">\u003cp>If you want to stay aware of your surroundings \u2014 in-person meetings, walking, multitasking \u2014 while still capturing every word, OpenNote\u2019s open-ear design is the better fit.\u003cbr>\u003cbr>If you need noise isolation in loud environments or want to start recording from the charging case, RecDot is the better choice. Transcription and summary quality are identical on both.\u003c/p>\u003c/div>\n                    \u003c/details>\n                  \u003c/div>\u003cdiv class=\"accordion\">\n                    \u003cdetails class=\"details\" is=\"accordion-details\">\n                      \u003csummary class=\"details__summary flex items-center justify-between gap-2 cursor-pointer\">\n                        \u003cspan class=\"text-base lg:text-lg xl:text-xl font-medium leading-tight\">Can OpenNote also start recording from the charging case like RecDot?\u003c/span>\u003csvg class=\"icon icon-plus-2 icon-xs shrink-0\" viewBox=\"0 0 14 14\" stroke=\"currentColor\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" role=\"presentation\">\n      \u003cpath stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M7 1V13M13 7H1\">\u003c/path>\n    \u003c/svg>\u003c/summary>\n                      \u003cdiv class=\"details__content text-base rte\">\u003cp>Currently, OpenNote\u2019s FlashRecord starts recording directly from the earbuds.\u003cbr>Case-button recording is a RecDot-exclusive feature \u2014 see the \u003ca href=\"/products/viaim-recdot\">RecDot product page\u003c/a> for details.\u003c/p>\u003c/div>\n                    \u003c/details>\n                  \u003c/div>\u003c/div>\n        \u003c/div>\u003c/div>\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003csection class=\"page-width on-reviews\" id=\"on-reviews\" data-preview-reviews=\"\">\u003cdiv class=\"on-review-head\">\u003cdiv>\u003ch2>Customer Reviews\u003c/h2>\u003cp>\u003cspan class=\"on-stars\">\u2605\u2605\u2605\u2605\u2606\u003c/span> 4.4 \u00b7 31 reviews\u003c/p>\u003csmall>Reference reviews from viaim \u00b7 layout preview\u003c/small>\u003c/div>\u003cbutton type=\"button\" data-write-review=\"\">Write a review\u003c/button>\u003c/div>\u003cp data-review-notice=\"\" hidden=\"\">Review submission works through the review app connected to your Shopify store.\u003c/p>\u003cdiv class=\"on-review-controls\">\u003cinput type=\"search\" data-review-search=\"\" placeholder=\"Search reviews\" aria-label=\"Search reviews\">\u003cselect data-review-sort=\"\" aria-label=\"Sort reviews\">\u003coption value=\"recent\">Most Recent\u003c/option>\u003coption value=\"highest\">Highest Rating\u003c/option>\u003coption value=\"lowest\">Lowest Rating\u003c/option>\u003c/select>\u003c/div>\u003cdiv class=\"on-review-list\">\u003carticle class=\"on-review-entry\" data-rating=\"1\" data-index=\"0\">\u003cdiv class=\"on-review-author\">Herb Harris\u003c/div>\u003cdiv class=\"on-stars\" aria-label=\"1 out of 5 stars\">\u2605\u2606\u2606\u2606\u2606\u003c/div>\u003ch3>I have not received my product\u003c/h3>\u003cp>I have not received my product. It still shows in process since June 11th. Sad\u003c/p>\u003c/article>\u003carticle class=\"on-review-entry\" data-rating=\"5\" data-index=\"1\">\u003cdiv class=\"on-review-author\">Cynthia\u003c/div>\u003cdiv class=\"on-stars\" aria-label=\"5 out of 5 stars\">\u2605\u2605\u2605\u2605\u2605\u003c/div>\u003ch3>nice looking earbuds\u003c/h3>\u003cp>The earbuds is nice looking, and it can record any calls, that's great for me\u003c/p>\u003c/article>\u003carticle class=\"on-review-entry\" data-rating=\"5\" data-index=\"2\">\u003cdiv class=\"on-review-author\">Rachel Peters\u003c/div>\u003cdiv class=\"on-stars\" aria-label=\"5 out of 5 stars\">\u2605\u2605\u2605\u2605\u2605\u003c/div>\u003ch3>Pairing Issues - Simple Fix\u003c/h3>\u003cp>Just a tip - I was having a hard time trying to pair these, what they fail to mention is there are these little tiny plastic stickers over the tips of the earbuds.  Once you remove those and following the pairing instructions you will be good to go - they work great!!\u003c/p>\u003c/article>\u003carticle class=\"on-review-entry\" data-rating=\"5\" data-index=\"3\">\u003cdiv class=\"on-review-author\">Rico Lyu\u003c/div>\u003cdiv class=\"on-stars\" aria-label=\"5 out of 5 stars\">\u2605\u2605\u2605\u2605\u2605\u003c/div>\u003ch3>Good\uff01\u003c/h3>\u003cp>The open-ear design of these earbuds is perfect for outdoor activities and commuting! The voice-to-text feature is super useful for taking notes during meetings or classes. It's honestly so practical!\u003c/p>\u003c/article>\u003carticle class=\"on-review-entry\" data-rating=\"5\" data-index=\"4\">\u003cdiv class=\"on-review-author\">Diego G.\u003c/div>\u003cdiv class=\"on-stars\" aria-label=\"5 out of 5 stars\">\u2605\u2605\u2605\u2605\u2605\u003c/div>\u003ch3>Very helpful and powerful sets w high quality\u003c/h3>\u003cp>The media could not be loaded.\n\u003cbr>                \n\u003cbr>            \n\u003cbr>                \n\u003cbr>            \n\u003cbr>            \n\u003cbr>        \n\u003cbr>    \n\u003cbr>    \u003c/p>\n\n\u003cp>  \n\u003cbr>  \n\u003cbr>    This is a def stunning product I ever had and I am so proud of my decision. Package made in a very nice quality, def a decent gift for Christmas and holiday or just a bday gift. Def worth the price especially it\u2019s not just an ai note it\u2019s a very nice earbuds as well. I try to test out its ability on live recordings and transcription, it does have what ever it happens on the TV. And the sounds quality it\u2019s very good. So multi-usage. Size it\u2019s slightly bigger than Apple, but I like it, it\u2019s not an insert type so more capable for long-wear. Very easy to set up, satisfied shopping experience. My iphone compatible with this sets.\u003c/p>\u003c/article>\u003carticle class=\"on-review-entry\" data-rating=\"5\" data-index=\"5\">\u003cdiv class=\"on-review-author\">Alan\u003c/div>\u003cdiv class=\"on-stars\" aria-label=\"5 out of 5 stars\">\u2605\u2605\u2605\u2605\u2605\u003c/div>\u003ch3>money spent worth\u003c/h3>\u003cp>These earbuds are awesome! The live translation works super smoothly\u2014great for trips or chatting with people who speak other languages. The recording feature is clear and super handy for saving notes. Plus, they sound amazing and feel comfy even after hours. Totally worth it!\u003c/p>\u003c/article>\u003carticle class=\"on-review-entry\" data-rating=\"5\" data-index=\"6\">\u003cdiv class=\"on-review-author\">Cansab\u003c/div>\u003cdiv class=\"on-stars\" aria-label=\"5 out of 5 stars\">\u2605\u2605\u2605\u2605\u2605\u003c/div>\u003ch3>High quality earphones\u003c/h3>\u003cp>Very impressed with the sound quality of these earphones! The open-ear design is very comfortable and doesn\u2019t hurt my ear even if I wear them for a long time. It may take some time to get used to wearing them in the beginning. Very easy to pair with my phone and you can connect two devices at the same time. The AI recording and transcribing function is pretty cool, and it\u2019s a nice function to have for taking meeting notes. I love the design of the earphones too, looks very clean and high quality with the waterproof and leather coating. Really happy with them overall.\u003c/p>\u003c/article>\u003carticle class=\"on-review-entry\" data-rating=\"5\" data-index=\"7\">\u003cdiv class=\"on-review-author\">X028\u003c/div>\u003cdiv class=\"on-stars\" aria-label=\"5 out of 5 stars\">\u2605\u2605\u2605\u2605\u2605\u003c/div>\u003ch3>Absolutely Impressive \u2014 Perfect Tool for Work, Study, and Daily Use!\u003c/h3>\u003cp>The transcription is spot-on \u2014 saves me so much time taking notes. The open-ear design is comfy, and the battery lasts all day. Perfect for meetings, interviews, or even just recording ideas on the go. Totally worth it!\u003c/p>\u003c/article>\u003carticle class=\"on-review-entry\" data-rating=\"5\" data-index=\"8\">\u003cdiv class=\"on-review-author\">Zoe\u003c/div>\u003cdiv class=\"on-stars\" aria-label=\"5 out of 5 stars\">\u2605\u2605\u2605\u2605\u2605\u003c/div>\u003ch3>Comfy and AI enhanced\u003c/h3>\u003cp>Got these earbuds a week ago and honestly I\u2019m impressed. The open-ear design is super comfy and I can still hear stuff around me, which is nice. The AI recording thing is actually pretty cool, I tried it in a meeting and it picked up everything clearly. Battery lasts long too. Only thing is they look kinda big at first, but after wearing for a bit it\u2019s fine. Overall really happy with them.\u003c/p>\u003c/article>\u003carticle class=\"on-review-entry\" data-rating=\"5\" data-index=\"9\">\u003cdiv class=\"on-review-author\">emma li\u003c/div>\u003cdiv class=\"on-stars\" aria-label=\"5 out of 5 stars\">\u2605\u2605\u2605\u2605\u2605\u003c/div>\u003ch3>Beyond expectation!\u003c/h3>\u003cp>I mean, wow! I didn\u2019t expect it to be this good! Super Comfortable and Smart.The fit is perfect, even for long hours. AI recording and transcription are quick and accurate. The packaging is great too. Feel like a real premium product.  Quite happy with the purchase.\u003c/p>\u003c/article>\u003carticle class=\"on-review-entry\" data-rating=\"5\" data-index=\"10\">\u003cdiv class=\"on-review-author\">Anonymous\u003c/div>\u003cdiv class=\"on-stars\" aria-label=\"5 out of 5 stars\">\u2605\u2605\u2605\u2605\u2605\u003c/div>\u003ch3>Best ai\u003c/h3>\u003cp>This one is really easy to use and also makes my life much easier. After you finish talking, they give the summary right away. The amazing part is they have the mind map, which is also great. I highly recommend people to use this.\u003c/p>\u003c/article>\u003carticle class=\"on-review-entry\" data-rating=\"5\" data-index=\"11\">\u003cdiv class=\"on-review-author\">ibenz2910\u003c/div>\u003cdiv class=\"on-stars\" aria-label=\"5 out of 5 stars\">\u2605\u2605\u2605\u2605\u2605\u003c/div>\u003ch3>Good set of earbuds and excellent quality for this price range\u003c/h3>\u003cp>I never had any experience with AI bluetooth earbuds before so this product from the company provide excellent first time experience and quality; will be supporting their future products\u003c/p>\u003c/article>\u003carticle class=\"on-review-entry\" data-rating=\"4\" data-index=\"12\">\u003cdiv class=\"on-review-author\">Anonymous\u003c/div>\u003cdiv class=\"on-stars\" aria-label=\"4 out of 5 stars\">\u2605\u2605\u2605\u2605\u2606\u003c/div>\u003ch3>easy to use right out of the box\u003c/h3>\u003cp>easy to use right out of the box. customer service was prompt with a delivery snafu. My initial review is that the product does what it says it does.\u003c/p>\u003c/article>\u003carticle class=\"on-review-entry\" data-rating=\"2\" data-index=\"13\">\u003cdiv class=\"on-review-author\">Mike long\u003c/div>\u003cdiv class=\"on-stars\" aria-label=\"2 out of 5 stars\">\u2605\u2605\u2606\u2606\u2606\u003c/div>\u003ch3>Not the most comfortable after long use\u003c/h3>\u003cp>works well for recording meetings, but after wearing it for a long time it can feel a little uncomfortable.\u003c/p>\u003c/article>\u003carticle class=\"on-review-entry\" data-rating=\"4\" data-index=\"14\">\u003cdiv class=\"on-review-author\">Terry wagner\u003c/div>\u003cdiv class=\"on-stars\" aria-label=\"4 out of 5 stars\">\u2605\u2605\u2605\u2605\u2606\u003c/div>\u003ch3>The app is really helpful for reviewing notes\u003c/h3>\u003cp>Recording meetings is simple, and the app makes it easy to go back and read the transcript later. The summaries help a lot when meetings get long.\u003c/p>\u003c/article>\u003carticle class=\"on-review-entry\" data-rating=\"3\" data-index=\"15\">\u003cdiv class=\"on-review-author\">Anna cardone\u003c/div>\u003cdiv class=\"on-stars\" aria-label=\"3 out of 5 stars\">\u2605\u2605\u2605\u2606\u2606\u003c/div>\u003ch3>Takes a little time to process\u003c/h3>\u003cp>The recordings work well, but sometimes the transcript takes a bit of time to generate after longer meetings.\u003c/p>\u003c/article>\u003carticle class=\"on-review-entry\" data-rating=\"5\" data-index=\"16\">\u003cdiv class=\"on-review-author\">Thwood\u003c/div>\u003cdiv class=\"on-stars\" aria-label=\"5 out of 5 stars\">\u2605\u2605\u2605\u2605\u2605\u003c/div>\u003ch3>Nice for reviewing discussions\u003c/h3>\u003cp>The app is very easy to use, the summary helps me quickly find the key points of discussion\u003c/p>\u003c/article>\u003carticle class=\"on-review-entry\" data-rating=\"5\" data-index=\"17\">\u003cdiv class=\"on-review-author\">Keith\u003c/div>\u003cdiv class=\"on-stars\" aria-label=\"5 out of 5 stars\">\u2605\u2605\u2605\u2605\u2605\u003c/div>\u003ch3>very great earphones for work\u003c/h3>\u003cp>Recording works smoothly and the transcription helps when I need to go back and find specific points\u003c/p>\u003c/article>\u003carticle class=\"on-review-entry\" data-rating=\"4\" data-index=\"18\">\u003cdiv class=\"on-review-author\">Fhaynes\u003c/div>\u003cdiv class=\"on-stars\" aria-label=\"4 out of 5 stars\">\u2605\u2605\u2605\u2605\u2606\u003c/div>\u003ch3>Helpful but still needs small edits\u003c/h3>\u003cp>The transcription is pretty good, though sometimes I still clean it up a bit. Overall it makes meeting notes much easier.\u003c/p>\u003c/article>\u003carticle class=\"on-review-entry\" data-rating=\"4\" data-index=\"19\">\u003cdiv class=\"on-review-author\">Daniyal\u003c/div>\u003cdiv class=\"on-stars\" aria-label=\"4 out of 5 stars\">\u2605\u2605\u2605\u2605\u2606\u003c/div>\u003ch3>Surprisingly accurate\u003c/h3>\u003cp>The transcription is better than I expected. Still needs small edits sometimes, but overall it\u2019s really useful.\u003c/p>\u003c/article>\u003carticle class=\"on-review-entry\" data-rating=\"3\" data-index=\"20\">\u003cdiv class=\"on-review-author\">John D\u003c/div>\u003cdiv class=\"on-stars\" aria-label=\"3 out of 5 stars\">\u2605\u2605\u2605\u2606\u2606\u003c/div>\u003ch3>Not bad\u003c/h3>\u003cp>The transcription and direct recording functions are great, but the comfort of the earphones themselves didn't meet my expectations.\u003c/p>\u003c/article>\u003carticle class=\"on-review-entry\" data-rating=\"4\" data-index=\"21\">\u003cdiv class=\"on-review-author\">Anonymous\u003c/div>\u003cdiv class=\"on-stars\" aria-label=\"4 out of 5 stars\">\u2605\u2605\u2605\u2605\u2606\u003c/div>\u003ch3>Works great for meetings\u003c/h3>\u003cp>I use it mostly for work meetings. Recording is easy and the transcription is pretty accurate. The audio quality can be better.\u003c/p>\u003c/article>\u003carticle class=\"on-review-entry\" data-rating=\"5\" data-index=\"22\">\u003cdiv class=\"on-review-author\">Anonymous\u003c/div>\u003cdiv class=\"on-stars\" aria-label=\"5 out of 5 stars\">\u2605\u2605\u2605\u2605\u2605\u003c/div>\u003ch3>So far\u003c/h3>\u003cp>So far so good\u003c/p>\u003c/article>\u003carticle class=\"on-review-entry\" data-rating=\"5\" data-index=\"23\">\u003cdiv class=\"on-review-author\">Lore Venable\u003c/div>\u003cdiv class=\"on-stars\" aria-label=\"5 out of 5 stars\">\u2605\u2605\u2605\u2605\u2605\u003c/div>\u003ch3>AMAZING SOUND QUALITY\u003c/h3>\u003cp>I purchased these at the recommendation of a friend and am not disappointed. After only an hour I find them to be extremely comfortable to wear and the sound quality is better than the Apple AirPods I use. After removing the tabs the were quick and easy to pair with my Mac. The build quality is also very nice. Use of faux leather gives them the feel of something that should be more expensive. I haven't used them for recording yet, but have no doubt they will perform very well.\u003c/p>\u003c/article>\u003carticle class=\"on-review-entry\" data-rating=\"4\" data-index=\"24\">\u003cdiv class=\"on-review-author\">Vinnie Alibrandi\u003c/div>\u003cdiv class=\"on-stars\" aria-label=\"4 out of 5 stars\">\u2605\u2605\u2605\u2605\u2606\u003c/div>\u003ch3>Record Left and Right and 32 float\u003c/h3>\u003cp>Really appreciate the life enhancing features!! Reallyyy wish we could record in stereo Left side and Right side earbud microphones!! I am well educated on the left and right noise canceling reasons however we would benefit greatly to have two channels Left and Right recordings. So many other reasons I am happy to share with you as a pro audio engineer. Also 48k 32bit float would be as beneficial(!) 32bit floating point makes everything so clear! Please consider this feature update! Viaim would lead the world market with these two features!\u003c/p>\u003c/article>\u003carticle class=\"on-review-entry\" data-rating=\"5\" data-index=\"25\">\u003cdiv class=\"on-review-author\">Susan Anz\u003c/div>\u003cdiv class=\"on-stars\" aria-label=\"5 out of 5 stars\">\u2605\u2605\u2605\u2605\u2605\u003c/div>\u003ch3>Would buy again\u003c/h3>\u003cp>Easy to wear, great sound and comfortable.\u003c/p>\u003c/article>\u003carticle class=\"on-review-entry\" data-rating=\"5\" data-index=\"26\">\u003cdiv class=\"on-review-author\">YC\u003c/div>\u003cdiv class=\"on-stars\" aria-label=\"5 out of 5 stars\">\u2605\u2605\u2605\u2605\u2605\u003c/div>\u003ch3>Wow Impressed!\u003c/h3>\u003cp>I tried this AI live translation earphone at a conference and was really impressed! It picked up voices clearly even in a busy room, and the translation was surprisingly accurate and quick! Recommend to use for multilingual meetings!\u003c/p>\u003c/article>\u003c/div>\u003cdiv class=\"on-review-pager\">\u003cbutton type=\"button\" aria-label=\"Previous reviews\" data-review-prev=\"\">\u2190\u003c/button>\u003cspan data-review-page=\"\">\u003c/span>\u003cbutton type=\"button\" aria-label=\"Next reviews\" data-review-next=\"\">\u2192\u003c/button>\u003c/div>\u003c/section>\u003c/main>\u003cdiv class=\"on-services page-width\">\u003cdiv>\u003cstrong>12-month Warranty\u003c/strong>\u003csmall>Your products always protected\u003c/small>\u003c/div>\u003cdiv>\u003cstrong>Fast Free
