Wearable displays \u003cspan>\u2192\u003c/span>\u003c/div>\u003cp>Read the field guide\u003c/p>\u003c/a>\u003ca class=\"on-mega-card\" style=\"--item:2\" href=\"technology.html#spatial-displays\">\u003cdiv class=\"on-mega-card-image\">\u003cimg src=\"assets/home-workflow-frame-v2.webp\" width=\"500\" height=\"300\" alt=\"\" style=\"object-fit:cover\">\u003c/div>\u003cdiv class=\"on-mega-card-title\">Spatial displays \u003cspan>\u2192\u003c/span>\u003c/div>\u003cp>Read the field guide\u003c/p>\u003c/a>\u003ca class=\"on-mega-card\" style=\"--item:3\" href=\"technology.html#companions\">\u003cdiv class=\"on-mega-card-image\">\u003cimg src=\"assets/robot-living-cinematic.webp\" width=\"500\" height=\"300\" alt=\"\" style=\"object-fit:cover\">\u003c/div>\u003cdiv class=\"on-mega-card-title\">Companion robotics \u003cspan>\u2192\u003c/span>\u003c/div>\u003cp>Read the field guide\u003c/p>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003c/details>\u003ca href=\"nexus-hub.html\" class=\"nx-hover-button\">\u003cspan class=\"nx-hover-label\">Nexus Hub\u003c/span>\u003cspan class=\"nx-hover-fill\" aria-hidden=\"true\">Nexus Hub\u003c/span>\u003c/a>\u003cdetails>\u003csummary class=\"nx-hover-button\">\u003cspan class=\"nx-hover-label\">Explore\u003c/span>\u003cspan class=\"nx-hover-fill\" aria-hidden=\"true\">Explore\u003c/span>\u003c/summary>\u003cdiv class=\"on-mini\">\u003cdiv class=\"on-menu-surface\">\u003ca href=\"wearables.html\" data-scroll-experience-link=\"\">3D Scroll Experience \u003cspan aria-hidden=\"true\">\u2197\u003c/span>\u003c/a>\u003ca href=\"our-story.html\">Our story \u003cspan>\u2197\u003c/span>\u003c/a>\u003ca href=\"shop.html\">Discover the collection \u003cspan>\u2197\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/details>\u003cdetails>\u003csummary class=\"nx-hover-button\">\u003cspan class=\"nx-hover-label\">Support\u003c/span>\u003cspan class=\"nx-hover-fill\" aria-hidden=\"true\">Support\u003c/span>\u003c/summary>\u003cdiv class=\"on-mini\">\u003cdiv class=\"on-menu-surface\">\u003ca href=\"product-guide.html\">Product guide \u003cspan>\u2197\u003c/span>\u003c/a>\u003ca href=\"faq.html\">FAQs \u003cspan>\u2197\u003c/span>\u003c/a>\u003ca href=\"contact.html\">Contact us \u003cspan>\u2197\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/details>\u003c/nav>\u003cdiv class=\"on-header-icons\">\u003ca href=\"#search\" aria-label=\"Search\">\u003csvg viewBox=\"0 0 24 24\">\u003ccircle cx=\"10\" cy=\"10\" r=\"7\">\u003c/circle>\u003cpath d=\"m15 15 6 6\">\u003c/path>\u003c/svg>\u003c/a>\u003ca href=\"#account\" aria-label=\"Account\">\u003csvg viewBox=\"0 0 24 24\">\u003ccircle cx=\"12\" cy=\"7\" r=\"4\">\u003c/circle>\u003cpath d=\"M3 23v-3c0-7 18-7 18 0v3\">\u003c/path>\u003c/svg>\u003c/a>\u003ca href=\"#cart\" aria-label=\"Cart\">\u003csvg viewBox=\"0 0 24 24\">\u003cpath d=\"M1 2h3l3 14h13l3-11H5\">\u003c/path>\u003ccircle cx=\"9\" cy=\"21\" r=\"1\">\u003c/circle>\u003ccircle cx=\"19\" cy=\"21\" r=\"1\">\u003c/circle>\u003c/svg>\u003c/a>\u003c/div>\u003c/div>\u003cdiv class=\"on-menu-backdrop\" aria-hidden=\"true\">\u003c/div>\u003c/header>\u003cmain class=\"ag\" id=\"MainContent\">\u003cnav class=\"ag-local\" aria-label=\"MI-1 navigation\">\u003ca class=\"ag-model\" href=\"mi-1.html\" aria-label=\"MI-1 by Nexora\">\u003cimg class=\"mi-lockup mi-app-icon\" src=\"assets/mi1-app-icon.svg\" alt=\"MI-1 by Nexora\" width=\"160\" height=\"47\">\u003c/a>\u003cdiv>\u003ca href=\"#ag-play\">Highlights\u003c/a>\u003ca href=\"#ag-modes\">Interaction\u003c/a>\u003ca href=\"#ag-details\">Specs\u003c/a>\u003ca href=\"#ag-faq\">FAQ\u003c/a>\u003c/div>\u003ca class=\"ag-btn\" href=\"buy-mi-1.html\">Buy now \u2197\u003c/a>\u003c/nav>\u003csection class=\"ag ag-story-hero\">\u003cdiv class=\"ag-shell ag-hero\">\u003cdiv>\u003cimg class=\"mi-hero-logo\" src=\"assets/mi1-lockup.svg\" alt=\"MI-1 by Nexora\" width=\"320\" height=\"94\">\u003cp class=\"ag-kicker\">01 / ROBOTICS FOR EVERYDAY PLAY\u003c/p>\u003ch1>A little robot.\u003cbr>\u003cem>For their curiosity.\u003c/em>\u003c/h1>\u003cp class=\"ag-lead\">Meet MI-1. Expressive eyes, playful movement and offline voice commands. A new way to share a little curiosity with your cat.\u003c/p>\u003cdiv class=\"ag-actions\">\u003ca class=\"ag-btn\" href=\"buy-mi-1.html\">Buy now \u003cspan>\u2197\u003c/span>\u003c/a>\u003ca class=\"ag-btn secondary\" href=\"#ag-play\">Discover play modes \u2192\u003c/a>\u003c/div>\u003cp class=\"ag-note\">Expressive screen \u00b7 Offline voice commands \u00b7 Interactive pet play\u003c/p>\u003c/div>\u003cdiv class=\"ag-art\">\u003csmall>MI-1 / INTERACTIVE PET ROBOT\u003c/small>\u003cimg src=\"assets/ag100-black-stock.jpg\" alt=\"MI-1 black stock model with round ears and expressive white eyes\" width=\"2000\" height=\"2000\" fetchpriority=\"high\">\u003cdiv class=\"ag-caption\">\u003cspan>A personality in motion.\u003c/span>\u003cspan>01 / MI-1\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\u003cdiv class=\"ag-shell\">\u003cdiv class=\"ag-strip\">\u003cdiv>Responds to your voice\u003cspan>Offline English &amp; Chinese commands\u003c/span>\u003c/div>\u003cdiv>Made for interaction\u003cspan>Screen expressions and growth stages\u003c/span>\u003c/div>\u003cdiv>More ways to play\u003cspan>Manual, automatic and remote modes\u003c/span>\u003c/div>\u003c/div>\u003csection class=\"ag-scroll-story\" id=\"ag-scroll-story\" aria-labelledby=\"ag-scroll-title\">\u003cdiv class=\"ag-scroll-intro\">\u003cp class=\"ag-kicker\">A CLOSER LOOK\u003c/p>\u003ch2 id=\"ag-scroll-title\">Small by design.\u003cbr>Full of character.\u003c/h2>\u003cp>Scroll to meet the details.\u003c/p>\u003c/div>\u003cdiv class=\"ag-scroll-layout\">\u003cdiv class=\"ag-scroll-stage\">\u003cimg class=\"ag-scroll-frame is-current\" src=\"assets/ag100-black-stock.jpg\" width=\"2000\" height=\"2000\" alt=\"Black MI-1, front view\" data-frame=\"0\">\u003cimg class=\"ag-scroll-frame\" src=\"assets/ag100-black-angle.jpg\" width=\"2000\" height=\"2000\" alt=\"Black MI-1, angled view\" data-frame=\"1\" loading=\"lazy\">\u003cimg class=\"ag-scroll-frame\" src=\"assets/ag100-white-stock.jpg\" width=\"2000\" height=\"2000\" alt=\"White MI-1, front view\" data-frame=\"2\" loading=\"lazy\">\u003cdiv class=\"ag-scroll-meter\" aria-hidden=\"true\">\u003cspan>\u003c/span>\u003c/div>\u003cspan class=\"ag-stage-label\">MI-1 / A closer look at MI-1\u003c/span>\u003c/div>\u003cdiv class=\"ag-scroll-steps\">\u003carticle data-step=\"0\">\u003cspan>01 / EXPRESSION\u003c/span>\u003ch3>A face you'll\u003cbr>want to meet.\u003c/h3>\u003cp>A 1.83-inch display gives MI-1 its expressive character. Interaction unlocks additional faces through its growth stages.\u003c/p>\u003c/article>\u003carticle data-step=\"1\">\u003cspan>02 / INTERACTION\u003c/span>\u003ch3>A playful\u003cbr>change of pace.\u003c/h3>\u003cp>Choose automatic movement or take control with the transmitter. Supported voice commands add another way to interact.\u003c/p>\u003ca href=\"#ag-modes\">Explore the modes \u2197\u003c/a>\u003c/article>\u003carticle data-step=\"2\">\u003cspan>03 / YOUR FINISH\u003c/span>\u003ch3>Black.\u003cbr>White. Yours.\u003c/h3>\u003cp>Two understated finishes. The same little character.\u003c/p>\u003ca href=\"buy-mi-1.html\">Choose your MI-1 \u2197\u003c/a>\u003c/article>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"ag-overview\" aria-label=\"MI-1 at a glance\">\u003ca class=\"ag-overview-photo\" href=\"#ag-life-title\">\u003cimg src=\"assets/ag100-people-life-scale2.webp\" alt=\"Generated scene showing the palm-sized black MI-1 beside a woman and her cat\" width=\"1536\" height=\"1024\" loading=\"lazy\">\u003cspan>A little closer.\u003csmall>Shared moments, real character.\u003c/small>\u003c/span>\u003c/a>\u003ca class=\"ag-overview-detail\" href=\"#ag-modes\">\u003cspan>YOUR VOICE. YOUR MOVE.\u003c/span>\u003cstrong>Say hello\u003cbr>to interaction.\u003c/strong>\u003csmall>Offline English &amp; Chinese commands \u2197\u003c/small>\u003c/a>\u003ca class=\"ag-overview-detail light\" href=\"#ag-details\">\u003cspan>SMALL DETAILS\u003c/span>\u003cstrong>1.83\u2033\u003c/strong>\u003csmall>An expressive TFT display \u2197\u003c/small>\u003c/a>\u003c/section>\u003csection class=\"ag-section\" id=\"ag-play\">\u003cp class=\"ag-kicker\">Make room for a little mischief\u003c/p>\u003ch2>Not every moment\u003cbr>needs to be serious.\u003c/h2>\u003cdiv class=\"ag-grid\">\u003carticle class=\"ag-card\">\u003cb>01 / EXPRESSION\u003c/b>\u003cdiv class=\"ag-expression\" aria-hidden=\"true\">\u003ci>\u003c/i>\u003ci>\u003c/i>\u003c/div>\u003ch3>A face with\u003cbr>something to say.\u003c/h3>\u003cp>A 1.83-inch display brings expressions to life. Usage-based growth stages unlock additional screen feedback as you interact.\u003c/p>\u003c/article>\u003carticle class=\"ag-card\">\u003cb>02 / PET PLAY\u003c/b>\u003cdiv class=\"ag-symbol\" aria-hidden=\"true\">\u2197\u003c/div>\u003ch3>Their new\u003cbr>playtime sidekick.\u003c/h3>\u003cp>Feather play, sound effects and a built-in laser add variety to supervised play sessions with your pet.\u003c/p>\u003c/article>\u003carticle class=\"ag-card\">\u003cb>03 / MOVEMENT\u003c/b>\u003cdiv class=\"ag-symbol\" aria-hidden=\"true\">\u25ce\u003c/div>\u003ch3>Let curiosity\u003cbr>take the lead.\u003c/h3>\u003cp>Switch between automatic movement and hands-on control. Infrared obstacle sensing helps it adjust its path.\u003c/p>\u003c/article>\u003c/div>\u003c/section>\u003csection class=\"ag-modes\" id=\"ag-modes\">\u003cdiv>\u003cp class=\"ag-kicker\">Your moment. Your mode.\u003c/p>\u003ch2>Play your way.\u003c/h2>\u003cp class=\"ag-note\">Keep pet play supervised. Obstacle sensing is not a guarantee against falls; use on a safe floor away from stairs.\u003c/p>\u003c/div>\u003cdiv>\u003cdiv class=\"ag-tabs\" role=\"tablist\" aria-label=\"Play modes\">\u003cbutton type=\"button\" id=\"ag-tab-0\" role=\"tab\" aria-selected=\"true\" aria-controls=\"ag-panel-0\" tabindex=\"0\">Automatic\u003c/button>\u003cbutton type=\"button\" id=\"ag-tab-1\" role=\"tab\" aria-selected=\"false\" aria-controls=\"ag-panel-1\" tabindex=\"-1\">Remote\u003c/button>\u003cbutton type=\"button\" id=\"ag-tab-2\" role=\"tab\" aria-selected=\"false\" aria-controls=\"ag-panel-2\" tabindex=\"-1\">Voice\u003c/button>\u003c/div>\u003cdiv class=\"ag-panel\" id=\"ag-panel-0\" role=\"tabpanel\" aria-labelledby=\"ag-tab-0\">Let the robot follow its automatic play routine, with infrared obstacle detection helping it change course.\u003c/div>\u003cdiv class=\"ag-panel\" id=\"ag-panel-1\" role=\"tabpanel\" aria-labelledby=\"ag-tab-1\" hidden=\"\">Take control using the transmitter. Direct movement and adjust play to the space around you.\u003c/div>\u003cdiv class=\"ag-panel\" id=\"ag-panel-2\" role=\"tabpanel\" aria-labelledby=\"ag-tab-2\" hidden=\"\">Use supported English or Chinese commands without cloud conversation. MI-1 is a voice-command pet toy; open-ended ChatGPT-style conversation is not confirmed.\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"ag-section ag-specs\" id=\"ag-details\">\u003cdiv>\u003cp class=\"ag-kicker\">Small details. Real character.\u003c/p>\u003ch2>Meet the hardware.\u003c/h2>\u003cp class=\"ag-note\">Specifications and functions below are provided by the supplier. Nexora sample testing is pending.\u003c/p>\u003c/div>\u003cdl>\u003cdiv>\u003cdt>Model\u003c/dt>\u003cdd>Wellturn MI-1\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Display\u003c/dt>\u003cdd>1.83-inch TFT\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Main battery\u003c/dt>\u003cdd>1,500 mAh\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Transmitter battery\u003c/dt>\u003cdd>450 mAh\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Charging\u003c/dt>\u003cdd>USB-C / 5V 1A\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Body\u003c/dt>\u003cdd>ABS + PC\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Voice commands\u003c/dt>\u003cdd>English &amp; Chinese, offline\u003c/dd>\u003c/div>\u003c/dl>\u003c/section>\u003csection class=\"ag-section\" id=\"ag-faq\" style=\"padding-top:0\">\u003cp class=\"ag-kicker\">Good to know\u003c/p>\u003ch2>A few practical answers.\u003c/h2>\u003cdetails>\u003csummary>Does it have open-ended AI conversations?\u003c/summary>\u003cp>The supplier lists offline voice-command recognition. We have not confirmed open-ended conversation, personal memory or a companion app, and do not advertise those capabilities.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>Is this a home security camera?\u003c/summary>\u003cp>MI-1 is presented here as an interactive pet robot. Camera monitoring and remote video calls are not confirmed for this model.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>Can I order it now?\u003c/summary>\u003cp>MI-1 is US$99 per robot with free standard shipping to Canada and the USA. Choose your finish and quantity, then pay securely at checkout.\u003c/p>\u003c/details>\u003c/section>\u003csection class=\"ag-life ag-editorial-life\" aria-labelledby=\"ag-life-title\">\u003cdiv class=\"ag-life-heading\">\u003cp class=\"ag-kicker\">AT HOME WITH MI-1\u003c/p>\u003ch2 id=\"ag-life-title\">Small moments.\u003cbr>More character.\u003c/h2>\u003c/div>\u003carticle class=\"ag-editorial-row\">\u003cimg src=\"assets/ag100-life-day-v3.webp\" alt=\"Illustrative generated lifestyle scene: A man and ginger cat watching the small black MI-1 on the floor\" width=\"1536\" height=\"1024\" loading=\"lazy\" decoding=\"async\">\u003cdiv>\u003cp class=\"ag-kicker\">01 / A MOMENT TOGETHER\u003c/p>\u003ch2>Make room\u003cbr>for a little play.\u003c/h2>\u003cp>A curious cat. A familiar room. A small companion that brings something playful to the everyday.\u003c/p>\u003ca class=\"ag-btn secondary\" href=\"#ag-modes\">Explore interaction \u2197\u003c/a>\u003c/div>\u003c/article>\u003carticle class=\"ag-editorial-row\">\u003cimg src=\"assets/ag100-cat-life-scale2.webp\" alt=\"Illustrative generated lifestyle scene: A curious cat beside the black MI-1\" width=\"1536\" height=\"1024\" loading=\"lazy\" decoding=\"async\">\u003cdiv>\u003cp class=\"ag-kicker\">02 / FOLLOW THEIR CURIOSITY\u003c/p>\u003ch2>Their next\u003cbr>little discovery.\u003c/h2>\u003cp>Movement, sound effects and feather play bring variety to supervised playtime. Choose automatic play or take the controls yourself.\u003c/p>\u003ca class=\"ag-btn secondary\" href=\"#ag-modes\">Explore interaction \u2197\u003c/a>\u003c/div>\u003c/article>\u003carticle class=\"ag-editorial-row\">\u003cimg src=\"assets/ag100-life-evening-v3.webp\" alt=\"Illustrative generated lifestyle scene: A woman and tabby cat with the small MI-1 in a softly lit evening living room\" width=\"1536\" height=\"1024\" loading=\"lazy\" decoding=\"async\">\u003cdiv>\u003cp class=\"ag-kicker\">03 / THE MOMENTS IN BETWEEN\u003c/p>\u003ch2>A little character.\u003cbr>A lot to enjoy.\u003c/h2>\u003cp>Make time for a shared moment at home. Expressive eyes and playful interactions give MI-1 its unmistakable personality.\u003c/p>\u003ca class=\"ag-btn secondary\" href=\"#ag-modes\">Explore interaction \u2197\u003c/a>\u003c/div>\u003c/article>\u003cp class=\"ag-life-caption\">A little character for the moments you share. Explore MI-1 at home.\u003c/p>\u003c/section>\u003csection class=\"ag-end\">\u003cp class=\"ag-kicker\" style=\"color:inherit\">A playful addition to your everyday\u003c/p>\u003ch2>Meet your next\u003cbr>little sidekick.\u003c/h2>\u003cp>MI-1 is joining the Nexora collection. Ordering details will appear here when available.\u003c/p>\u003ca class=\"ag-btn\" href=\"buy-mi-1.html\">Choose your MI-1 \u2197\u003c/a>\u003c/section>\u003c/div>\u003csection class=\"mi-guide ag-shell\">\u003cp class=\"ag-kicker\">THE MI-1 GUIDE\u003c/p>\u003ch2>Get to know every side.\u003c/h2>\u003cdiv class=\"mi-guide-group\">\u003ch3>Play modes\u003c/h3>\u003cdiv class=\"mi-guide-grid\">\u003carticle id=\"mi-auto\">\u003cp class=\"ag-kicker\">Automatic play\u003c/p>\u003ch4>Movement for curious cats\u003c/h4>\u003cp>Switch to automatic mode for moving play. Infrared sensors help detect obstacles. Use a clear floor area and supervise your cat.\u003c/p>\u003c/article>\u003carticle id=\"mi-remote\">\u003cp class=\"ag-kicker\">Remote control\u003c/p>\u003ch4>Take a turn together\u003c/h4>\u003cp>Direct movement with the handheld transmitter. This is local remote control, not phone control over the internet.\u003c/p>\u003c/article>\u003carticle id=\"mi-toys\">\u003cp class=\"ag-kicker\">Laser &amp; feather\u003c/p>\u003ch4>More ways to invite play\u003c/h4>\u003cp>The feather attachment and built-in laser add variety. Avoid eyes and reflective surfaces, supervise play, and inspect attachments regularly.\u003c/p>\u003c/article>\u003c/div>\u003c/div>\u003cdiv class=\"mi-guide-group\">\u003ch3>Interaction\u003c/h3>\u003cdiv class=\"mi-guide-grid\">\u003carticle id=\"mi-voice\">\u003cp class=\"ag-kicker\">Voice commands\u003c/p>\u003ch4>A few words. A response.\u003c/h4>\u003cp>The MI-1 recognizes supported English and Chinese commands offline. Its documented wake phrase is \u201cHi WILL\u201d, followed by a command such as \u201cGo forward\u201d. A custom MI-1 wake phrase is not confirmed.\u003c/p>\u003c/article>\u003carticle id=\"mi-touch\">\u003cp class=\"ag-kicker\">Touch &amp; expressions\u003c/p>\u003ch4>Character you can interact with\u003c/h4>\u003cp>Tap or stroke the head sensor for responses and sounds. Its expressions are interactive play features, not evidence of human-like feelings.\u003c/p>\u003c/article>\u003carticle id=\"mi-growth\">\u003cp class=\"ag-kicker\">Growth stages\u003c/p>\u003ch4>Character through play\u003c/h4>\u003cp>The supplier describes four growth stages with different faces and responses as playtime accumulates. This is not confirmed personal memory or learning about your cat.\u003c/p>\u003c/article>\u003c/div>\u003c/div>\u003cdiv class=\"mi-guide-group\">\u003ch3>Product guide\u003c/h3>\u003cdiv class=\"mi-guide-grid\">\u003carticle id=\"mi-setup\">\u003cp class=\"ag-kicker\">Getting started\u003c/p>\u003ch4>Make room for a first hello\u003c/h4>\u003cp>Charge the robot and pair the supplied remote following the included manual. Try manual control in a clear, dry space before exploring automatic play.\u003c/p>\u003c/article>\u003carticle id=\"mi-connect\">\u003cp class=\"ag-kicker\">Connectivity\u003c/p>\u003ch4>Designed for offline play\u003c/h4>\u003cp>The supplier lists a 433 MHz remote and offline voice commands. A phone app, camera recording, Wi-Fi control, open-ended AI chat and Synapses integration are not confirmed.\u003c/p>\u003c/article>\u003carticle id=\"mi-care\">\u003cp class=\"ag-kicker\">Care &amp; play\u003c/p>\u003ch4>A little attention goes a long way\u003c/h4>\u003cp>Designed for interactive cat play. Keep the robot dry and supervise sessions. Stop if your cat appears uncomfortable. Follow the included manual for charging and replacing attachments.\u003c/p>\u003c/article>\u003c/div>\u003c/div>\u003cp class=\"mi-guide-source\">Features refer to the underlying Wellturn MI-1 hardware. Consult the supplied manual before use.\u003c/p>\u003c/section>\u003c/main>\u003cfooter class=\"ag ag-footer\">\u003cdiv>\u003ca class=\"ag-footer-logo\" href=\"index.html\">NEXORA\u003c/a>\u003cp>A more considered tomorrow.\u003c/p>\u003c/div>\u003cnav aria-label=\"Explore Nexora\">\u003cspan>EXPLORE\u003c/span>\u003ca href=\"shop.html\">The collection\u003c/a>\u003ca href=\"technology.html\">Technology\u003c/a>\u003ca href=\"nexus-hub.html\">Nexus Hub\u003c/a>\u003c/nav>\u003cnav aria-label=\"Product information\">\u003cspan>MI-1\u003c/span>\u003ca href=\"#ag-play\">Discover the robot\u003c/a>\u003ca href=\"#ag-details\">Specifications\u003c/a>\u003ca href=\"contact.html\">Contact &amp; support\u003c/a>\u003c/nav>\u003cdiv class=\"ag-footer-bottom\">MI-1 by Nexora \u00b7 Hardware model: Wellturn MI-1. \u00a9 2026 Nexora \u003cspan>Thoughtful technology. Everyday possibility.\u003c/span>\u003c/div>\u003c/footer>\u00  display, movement, offline voice commands and automatic or remote-controlled play.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>Does it have conversational AI or a phone app?\u003c/summary>\u003cp>We do not offer MI-1 as a conversational AI assistant. Offline English and Chinese commands are supported; open-ended conversation, phone-app control and camera monitoring are not confirmed features.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>Can I order now?\u003c/summary>\u003cp>You can choose a finish and save MI-1 in your basket. Paid checkout is not open yet. Adding it to your basket does not place an order or reserve stock.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>How much is MI-1?\u003c/summary>\u003cp>The launch price is US$99 per robot. Shipping and taxes are not included in the basket estimate. Final costs will be shown before payment once ordering opens.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>Where do you ship, and how long does delivery take?\u003c/summary>\u003cp>Launch destinations and delivery times have not been announced. These will be published before orders open.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>What is the return policy?\u003c/summary>\u003cp>Return and warranty terms will be available before checkout opens. No paid orders are currently being accepted.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>Are the lifestyle images photographs of the product in use?\u003c/summary>\u003cp>The lifestyle scenes are AI-generated illustrations based on supplier imagery. Manufacturer product photographs are identified in the gallery.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>Are the other Nexora products available?\u003c/summary>\u003cp>MI-1 is our first launch. Other products shown in the collection are previews; their individual pages describe their status.\u003c/p>\u003c/details>\u003cdiv class=\"info-links\">\u003ca href=\"product-guide.html\">MI-1 product guide \u2197\u003c/a>\u003ca href=\"conta d AI conversation.\u003c/p>\u003c/section>\u003csection>\u003ch2>Play, your way.\u003c/h2>\u003cp>Choose automatic play or use the remote control. Movement, sound effects and feather play add variety to supervised time with your cat. Infrared obstacle sensing is part of the hardware specification.\u003c/p>\u003c/section>\u003csection>\u003ch2>Choose a finish.\u003c/h2>\u003cp>The selection page lets you compare black and white manufacturer images. The lifestyle gallery illustrates the black model. Select your finish and quantity before adding MI-1 to your basket.\u003c/p>\u003cdiv class=\"info-links\">\u003ca href=\"buy-mi-1.html\">Choose your MI-1 \u2197\u003c/a>\u003c/div>\u003c/section>\u003csection>\u003ch2>Before the first play.\u003c/h2>\u003cp>Use the manufacturer\u2019s supplied manual for charging, setup and operating instructions. MI-1 is a cat-play product. Supervise play, check attachments before use and keep the play area away from stairs and exposed edges.\u003c/p>\u003cp>This guide is an overview, not a replacement for the product manual. We\u2019ll add the matching setup manual when the launch configuration is confirmed.\u003c/p>\u003c/section>\u003cdiv class=\"info-links\">\u003ca href=\"mi-1.html#ag-details\">Full specifications \u2197\u003c/a>\u003ca href=\"faq.html\">Read the FAQs \u2197\u003c/a>\u003c/div>\u003c/main>\u003cfooter class=\"ag ag-footer\">\u003cdiv>\u003ca class=\"ag-footer-logo\" href=\"index.html\">NEXORA\u003c/a>\u003cp>A more considered tomorrow.\u003c/p>\u003c/div>\u003cnav aria-label=\"Explore Nexora\">\u003cspan>EXPLORE\u003c/span>\u003ca href=\"shop.html\">The collection\u003c/a>\u003ca href=\"technology.html\">Technology\u003c/a>\u003ca href=\"nexus-hub.html\">Nexus Hub\u003c/a>\u003c/nav>\u003cnav aria-label=\"Product information\">\u003cspan>MI-1\u003c/span>\u003ca href=\"mi-1.html#ag-play\">Discover the robot\u003c/a>\u003ca href=\"mi-1.html#ag-details\">Specifications\u003c/a>\u003ca href=\"contact.html\">Contact &amp; 24 24\">\u003ccircle cx=\"10\" cy=\"10\" r=\"7\">\u003c/circle>\u003cpath d=\"m15 15 6 6\">\u003c/path>\u003c/svg>\u003c/a>\u003ca href=\"#account\" aria-label=\"Account\">\u003csvg viewBox=\"0 0 24 24\">\u003ccircle cx=\"12\" cy=\"7\" r=\"4\">\u003c/circle>\u003cpath d=\"M3 23v-3c0-7 18-7 18 0v3\">\u003c/path>\u003c/svg>\u003c/a>\u003ca href=\"#cart\" aria-label=\"Cart\">\u003csvg viewBox=\"0 0 24 24\">\u003cpath d=\"M1 2h3l3 14h13l3-11H5\">\u003c/path>\u003ccircle cx=\"9\" cy=\"21\" r=\"1\">\u003c/circle>\u003ccircle cx=\"19\" cy=\"21\" r=\"1\">\u003c/circle>\u003c/svg>\u003c/a>\u003c/div>\u003c/div>\u003cdiv class=\"on-menu-backdrop\" aria-hidden=\"true\">\u003c/div>\u003c/header>\u003cmain id=\"MainContent\" class=\"nx-info\">\u003cp class=\"eyebrow\">Nexora / Store FAQs\u003c/p>\u003ch1>Your Nexora questions.\u003c/h1>\u003cp class=\"intro\">The collection, shopping and support\u2014all in one place.\u003c/p>\u003cdetails open>\u003csummary>What is Nexora?\u003c/summary>\u003cp>Nexora is a store for distinctive gadgets, robotics, wearables and technology for everyday life. MI-1 is our first product launch; other items in the collection are previews of products we are exploring.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>Is everything in the collection available to buy?\u003c/summary>\u003cp>Not yet. Check each product page for its availability. Collection previews are not available to order, and paid checkout is not currently open.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>Are all Nexora products AI-powered?\u003c/summary>\u003cp>No. Features vary by product. Some use simple controls or programmed interactions; others may include AI features. Refer to the individual product specifications rather than assuming every gadget has conversational AI.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>How do prices and payments work?\u003c/summary>\u003cp>Prices show their currency on the product page. Basket totals do not currently include shipping or taxes. Payment options and final costs will be shown before payment when checkout opens.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>Where does Nexora ship?\u003c/summary>\u003cp>Our launch destinations and delivery estimates have not been announced. Shipping information will be published before paid orders open.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>What are your return and warranty terms?\u003c/summary>\u003cp>Return and warranty terms will be published before orders open. Product-specific coverage will be stated clearly; do not assume the same coverage applies to every item.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>Does adding to my basket reserve stock?\u003c/summary>\u003cp>No. The basket saves your selections in this browser. It does not reserve stock, take payment or place an order.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>How do I choose the right product?\u003c/summary>\u003cp>Compare the features and specifications on the product page. Compatibility, controls and connectivity differ between products. If something is unclear, email ednbusiness73@gmail.com before ordering.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>How can I contact Nexora?\u003c/summary>\u003cp>Email \u003ca href=\"mailto:ednbusiness73@gmail.com\">ednbusiness73@gmail.com\u003c/a> with the product name and your question.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>Where can I find MI-1 answers?\u003c/summary>\u003cp>Visit the \u003ca href=\"faq.html?theme=white\">MI-1 FAQ\u003c/a> for its features, finishes and launch information.\u003c/p>\u003c/details>\u003cdiv class=\"info-links\">\u003ca href=\"shop.html\">Explore the collection \u2197\u003c/a>\u003ca href=\"store-contact.html?theme=blue\">Contact Nexora \u2197\u003c/a>\u003c/div>\u003c/main>\u003cfooter class=\"ag ag-footer\">\u003cdiv>\u003ca class=\"ag-footer-logo\" href=\"index.html\">NEXORA\u003c/a>\u003cp>A more considered tomorrow.\u003c/p>\u003c/div>\u003cnav aria-label=\"Explore Nexora\">\u003cspan>EXPLORE\u003c/span>\u003ca href=\"shop.html\">The collection\u003c/a>\u003ca href=\"technology.html\">Technology\u003c/a>\u003ca href=\"nexus-hub.html\">Nexus Hub\u003c/a>\u003c/nav>\u003cnav aria-label=\"Product information\">\u003cspan>MI-1\u003c/span>\u003ca href=\"mi-1.html#ag-play\">Discover the robot\u003c/a>\u003ca href=\"mi-1.html#ag-details\">Specifications\u003c/a>\u003ca href=\"store-contact.html?theme=blue\">Contact &amp; support\u003c/a>\u003c/nav>\u003cdiv class=\"ag-footer-bottom\">MI-1 by Nexora \u00b7 Hardware model: Wellturn MI-1. \u00a9 2026 Nexora \u003cspan>Thoughtful technology. Everyday possibility.\u003c/span>\u003c/div>\u003c/footer>\u003cscript src=\"assets/nexora-cart.js\">\u003c/script>\u003cscript src=\"assets/nexora-discovery.js\">\u003c/script>\u003c/body>\u003c/html>","store-guide.html":"\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>Product guide \u2014 Nexora\u003c/title>\u003clink rel=\"stylesheet\" href=\"assets/theme.css\">\u003cscript src=\"assets/theme.js\" defer=\"\">\u003c/script>\u003cscript src=\"assets/product.js\" defer=\"\">\u003c/script>\u003clink rel=\"stylesheet\" href=\"assets/shared-navigation.css\">\u003clink rel=\"stylesheet\" href=\"assets/catalog.css\">\u003cscript src=\"assets/opennote-menu.js?v=lf2\" defer=\"\">\u003c/script>\u003cscript src=\"assets/catalog.js\" defer=\"\">\u003c/script>\u003clink rel=\"stylesheet\" href=\"assets/robot-eye-test.css\">\u003cscript src=\"assets/robot-eye-test.js\" defer=\"\">\u003c/script>\u003clink rel=\"stylesheet\" href=\"assets/navigation-type.css?v=1\">\u003clink rel=\"preload\" href=\"assets/inter-latin-standard-normal.woff2\" as=\"font\" type=\"font/woff2\" crossorigin=\"\">\u003clink rel=\"stylesheet\" href=\"assets/header-stability.css\">\u003cscript src=\"assets/motion-umd.js\" defer=\"\">\u003c/script>\u003cscript sr c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/details>\u003cdetails>\u003csummary class=\"nx-hover-button\">\u003cspan class=\"nx-hover-label\">Support\u003c/span>\u003cspan class=\"nx-hover-fill\" aria-hidden=\"true\">Support\u003c/span>\u003c/summary>\u003cdiv class=\"on-mini\">\u003cdiv class=\"on-menu-surface\">\u003ca href=\"product-guide.html\">Product guide \u003cspan>\u2197\u003c/span>\u003c/a>\u003ca href=\"faq.html\">FAQs \u003cspan>\u2197\u003c/span>\u003c/a>\u003ca href=\"contact.html\">Contact us \u003cspan>\u2197\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/details>\u003c/nav>\u003cdiv class=\"on-header-icons\">\u003ca href=\"#search\" aria-label=\"Search\">\u003csvg viewBox=\"0 0 24 24\">\u003ccircle cx=\"10\" cy=\"10\" r=\"7\">\u003c/circle>\u003cpath d=\"m15 15 6 6\">\u003c/path>\u003c/svg>\u003c/a>\u003ca href=\"#account\" aria-label=\"Account\">\u003csvg viewBox=\"0 0 24 24\">\u003ccircle cx=\"12\" cy=\"7\" r=\"4\">\u003c/circle>\u003cpath d=\"M3 23v-3c0-7 18-7 18 0v3\">\u003c/path>\u003c/svg>\u003c/a>\u003ca href=\"#cart\" aria-label=\"Cart\">\u003csvg viewBox=\"0 0 24 24\">\u003cpath d=\"M1 2h3l3 14h13l3-11H5\">\u003c/path>\u003ccircle cx=\"9\" cy=\"21\" r=\"1\">\u003c/circle>\u003ccircle cx=\"19\" cy=\"21\" r=\"1\">\u003c/circle>\u003c/svg>\u003c/a>\u003c/div>\u003c/div>\u003cdiv class=\"on-menu-backdrop\" aria-hidden=\"true\">\u003c/div>\u003c/header>\u003cmain class=\"ag\" id=\"MainContent\">\u003cnav class=\"ag-local\" aria-label=\"MI-1 navigation\">\u003ca class=\"ag-model\" href=\"mi-1.html\" aria-label=\"MI-1 by Nexora\">\u003cimg class=\"mi-lockup mi-app-icon\" src=\"assets/mi1-app-icon.svg\" alt=\"MI-1 by Nexora\" width=\"160\" height=\"47\">\u003c/a>\u003cdiv>\u003ca href=\"#ag-play\">Highlights\u003c/a>\u003ca href=\"#ag-modes\">Interaction\u003c/a>\u003ca href=\"#ag-details\">Specs\u003c/a>\u003ca href=\"#ag-faq\">FAQ\u003c/a>\u003c/div>\u003ca class=\"ag-btn\" href=\"buy-mi-1.html\">Buy now \u2197\u003c/a>\u003c/nav>\u003csection class=\"ag ag-story-hero\">\u003cdiv class=\"ag-shell ag-hero\">\u003cdiv>\u003cimg class=\"mi-hero-logo\" src=\"assets/mi1-lockup.svg\" alt=\"MI-1 by Nexora\" width=\"320\" height=\"94\">\u003cp class=\"ag-kicker\">01 / ROBOTICS FOR EVERYDAY PLAY\u003c/p>\u003ch1>A little robot.\u003cbr>\u003cem>For their curiosity.\u003c/em>\u003c/h1>\u003cp class=\"ag-lead\">Meet MI-1. Expressive eyes, playful movement and offline voice commands. A new way to share a little curiosity with your cat.\u003c/p>\u003cdiv class=\"ag-actions\">\u003ca class=\"ag-btn\" href=\"buy-mi-1.html\">Buy now \u003cspan>\u2197\u003c/span>\u003c/a>\u003ca class=\"ag-btn secondary\" href=\"#ag-play\">Discover play modes \u2192\u003c/a>\u003c/div>\u003cp class=\"ag-note\">Expressive screen \u00b7 Offline voice commands \u00b7 Interactive pet play\u003c/p>\u003c/div>\u003cdiv class=\"ag-art\">\u003csmall>MI-1 / INTERACTIVE PET ROBOT\u003c/small>\u003cimg src=\"assets/ag100-black-stock.jpg\" alt=\"MI-1 black stock model with round ears and expressive white eyes\" width=\"2000\" height=\"2000\" fetchpriority=\"high\">\u003cdiv class=\"ag-caption\">\u003cspan>A personality in motion.\u003c/span>\u003cspan>01 / MI-1\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\u003cdiv class=\"ag-shell\">\u003cdiv class=\"ag-strip\">\u003cdiv>Responds to your voice\u003cspan>Offline English &amp; Chinese commands\u003c/span>\u003c/div>\u003cdiv>Made for interaction\u003cspan>Screen expressions and growth stages\u003c/span>\u003c/div>\u003cdiv>More ways to play\u003cspan>Manual, automatic and remote modes\u003c/span>\u003c/div>\u003c/div>\u003csection class=\"ag-scroll-story\" id=\"ag-scroll-story\" aria-labelledby=\"ag-scroll-title\">\u003cdiv class=\"ag-scroll-intro\">\u003cp class=\"ag-kicker\">A CLOSER LOOK\u003c/p>\u003ch2 id=\"ag-scroll-title\">Small by design.\u003cbr>Full of character.\u003c/h2>\u003cp>Scroll to meet the details.\u003c/p>\u003c/div>\u003cdiv class=\"ag-scroll-layout\">\u003cdiv class=\"ag-scroll-stage\">\u003cimg class=\"ag-scroll-frame is-current\" src=\"assets/ag100-black-stock.jpg\" width=\"2000\" height=\"2000\" alt=\"Black MI-1, front view\" data-frame=\"0\">\u003cimg class=\"ag-scroll-frame\" src=\"assets/ag100-black-angle.jpg\" width=\"2000\" height=\"2000\" alt=\"Black MI-1, angled view\" data-frame=\"1\" loading=\"lazy\">\u003cimg class=\"ag-scroll-frame\" src=\"assets/ag100-white-stock.jpg\" width=\"2000\" height=\"2000\" alt=\"White MI-1, front view\" data-frame=\"2\" loading=\"lazy\">\u003cdiv class=\"ag-scroll-meter\" aria-hidden=\"true\">\u003cspan>\u003c/span>\u003c/div>\u003cspan class=\"ag-stage-label\">MI-1 / A closer look at MI-1\u003c/span>\u003c/div>\u003cdiv class=\"ag-scroll-steps\">\u003carticle data-step=\"0\">\u003cspan>01 / EXPRESSION\u003c/span>\u003ch3>A face you'll\u003cbr>want to meet.\u003c/h3>\u003cp>A 1.83-inch display gives MI-1 its expressive character. Interaction unlocks additional faces through its growth stages.\u003c/p>\u003c/article>\u003carticle data-step=\"1\">\u003cspan>02 / INTERACTION\u003c/span>\u003ch3>A playful\u003cbr>change of pace.\u003c/h3>\u003cp>Choose automatic movement or take control with the transmitter. Supported voice commands add another way to interact.\u003c/p>\u003ca href=\"#ag-modes\">Explore the modes \u2197\u003c/a>\u003c/article>\u003carticle data-step=\"2\">\u003cspan>03 / YOUR FINISH\u003c/span>\u003ch3>Black.\u003cbr>White. Yours.\u003c/h3>\u003cp>Two understated finishes. The same little character.\u003c/p>\u003ca href=\"buy-mi-1.html\">Choose your MI-1 \u2197\u003c/a>\u003c/article>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"ag-overview\" aria-label=\"MI-1 at a glance\">\u003ca class=\"ag-overview-photo\" href=\"#ag-life-title\">\u003cimg src=\"assets/ag100-people-life-scale2.webp\" alt=\"Generated scene showing the palm-sized black MI-1 beside a woman and her cat\" width=\"1536\" height=\"1024\" loading=\"lazy\">\u003cspan>A little closer.\u003csmall>Shared moments, real character.\u003c/small>\u003c/span>\u003c/a>\u003ca class=\"ag-overview-detail\" href=\"#ag-modes\">\u003cspan>YOUR VOICE. YOUR MOVE.\u003c/span>\u003cstrong>Say hello\u003cbr>to interaction.\u003c/strong>\u003csmall>Offline English &amp; Chinese commands \u2197\u003c/small>\u003c/a>\u003ca class=\"ag-overview-detail light\" href=\"#ag-details\">\u003cspan>SMALL DETAILS\u003c/span>\u003cstrong>1.83\u2033\u003c/strong>\u003csmall>An expressive TFT display \u2197\u003c/small>\u003c/a>\u003c/section>\u003csection class=\"ag-section\" id=\"ag-play\">\u003cp class=\"ag-kicker\">Make room for a little mischief\u003c/p>\u003ch2>Not every moment\u003cbr>needs to be serious.\u003c/h2>\u003cdiv class=\"ag-grid\">\u003carticle class=\"ag-card\">\u003cb>01 / EXPRESSION\u003c/b>\u003cdiv class=\"ag-expression\" aria-hidden=\"true\">\u003ci>\u003c/i>\u003ci>\u003c/i>\u003c/div>\u003ch3>A face with\u003cbr>something to say.\u003c/h3>\u003cp>A 1.83-inch display brings expressions to life. Usage-based growth stages unlock additional screen feedback as you interact.\u003c/p>\u003c/article>\u003carticle class=\"ag-card\">\u003cb>02 / PET PLAY\u003c/b>\u003cdiv class=\"ag-symbol\" aria-hidden=\"true\">\u2197\u003c/div>\u003ch3>Their new\u003cbr>playtime sidekick.\u003c/h3>\u003cp>Feather play, sound effects and a built-in laser add variety to supervised play sessions with your pet.\u003c/p>\u003c/article>\u003carticle class=\"ag-card\">\u003cb>03 / MOVEMENT\u003c/b>\u003cdiv class=\"ag-symbol\" aria-hidden=\"true\">\u25ce\u003c/div>\u003ch3>Let curiosity\u003cbr>take the lead.\u003c/h3>\u003cp>Switch between automatic movement and hands-on control. Infrared obstacle sensing helps it adjust its path.\u003c/p>\u003c/article>\u003c/div>\u003c/section>\u003csection class=\"ag-modes\" id=\"ag-modes\">\u003cdiv>\u003cp class=\"ag-kicker\">Your moment. Your mode.\u003c/p>\u003ch2>Play your way.\u003c/h2>\u003cp class=\"ag-note\">Keep pet play supervised. Obstacle sensing is not a guarantee against falls; use on a safe floor away from stairs.\u003c/p>\u003c/div>\u003cdiv>\u003cdiv class=\"ag-tabs\" role=\"tablist\" aria-label=\"Play modes\">\u003cbutton type=\"button\" id=\"ag-tab-0\" role=\"tab\" aria-selected=\"true\" aria-controls=\"ag-panel-0\" tabindex=\"0\">Automatic\u003c/button>\u003cbutton type=\"button\" id=\"ag-tab-1\" role=\"tab\" aria-selected=\"false\" aria-controls=\"ag-panel-1\" tabindex=\"-1\">Remote\u003c/button>\u003cbutton type=\"button\" id=\"ag-tab-2\" role=\"tab\" aria-selected=\"false\" aria-controls=\"ag-panel-2\" tabindex=\"-1\">Voice\u003c/button>\u003c/div>\u003cdiv class=\"ag-panel\" id=\"ag-panel-0\" role=\"tabpanel\" aria-labelledby=\"ag-tab-0\">Let the robot follow its automatic play routine, with infrared obstacle detection helping it change course.\u003c/div>\u003cdiv class=\"ag-panel\" id=\"ag-panel-1\" role=\"tabpanel\" aria-labelledby=\"ag-tab-1\" hidden=\"\">Take control using the transmitter. Direct movement and adjust play to the space around you.\u003c/div>\u003cdiv class=\"ag-panel\" id=\"ag-panel-2\" role=\"tabpanel\" aria-labelledby=\"ag-tab-2\" hidden=\"\">Use supported English or Chinese commands without cloud conversation. MI-1 is a voice-command pet toy; open-ended ChatGPT-style conversation is not confirmed.\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"ag-section ag-specs\" id=\"ag-details\">\u003cdiv>\u003cp class=\"ag-kicker\">Small details. Real character.\u003c/p>\u003ch2>Meet the hardware.\u003c/h2>\u003cp class=\"ag-note\">Specifications and functions below are provided by the supplier. Nexora sample testing is pending.\u003c/p>\u003c/div>\u003cdl>\u003cdiv>\u003cdt>Model\u003c/dt>\u003cdd>Wellturn MI-1\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Display\u003c/dt>\u003cdd>1.83-inch TFT\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Main battery\u003c/dt>\u003cdd>1,500 mAh\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Transmitter battery\u003c/dt>\u003cdd>450 mAh\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Charging\u003c/dt>\u003cdd>USB-C / 5V 1A\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Body\u003c/dt>\u003cdd>ABS + PC\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Voice commands\u003c/dt>\u003cdd>English &amp; Chinese, offline\u003c/dd>\u003c/div>\u003c/dl>\u003c/section>\u003csection class=\"ag-section\" id=\"ag-faq\" style=\"padding-top:0\">\u003cp class=\"ag-kicker\">Good to know\u003c/p>\u003ch2>A few practical answers.\u003c/h2>\u003cdetails>\u003csummary>Does it have open-ended AI conversations?\u003c/summary>\u003cp>The supplier lists offline voice-command recognition. We have not confirmed open-ended conversation, personal memory or a companion app, and do not advertise those capabilities.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>Is this a home security camera?\u003c/summary>\u003cp>MI-1 is presented here as an interactive pet robot. Camera monitoring and remote video calls are not confirmed for this model.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>Can I order it now?\u003c/summary>\u003cp>MI-1 is US$99 per robot with free standard shipping to Canada and the USA. Choose your finish and quantity, then pay securely at checkout.\u003c/p>\u003c/details>\u003c/section>\u003csection class=\"ag-life ag-editorial-life\" aria-labelledby=\"ag-life-title\">\u003cdiv class=\"ag-life-heading\">\u003cp class=\"ag-kicker\">AT HOME WITH MI-1\u003c/p>\u003ch2 id=\"ag-life-title\">Small moments.\u003cbr>More character.\u003c/h2>\u003c/div>\u003carticle class=\"ag-editorial-row\">\u003cimg src=\"assets/ag100-life-day-v3.webp\" alt=\"Illustrative generated lifestyle scene: A man and ginger cat watching the small black MI-1 on the floor\" width=\"1536\" height=\"1024\" loading=\"lazy\" decoding=\"async\">\u003cdiv>\u003cp class=\"ag-kicker\">01 / A MOMENT TOGETHER\u003c/p>\u003ch2>Make room\u003cbr>for a little play.\u003c/h2>\u003cp>A curious cat. A familiar room. A small companion that brings something playful to the everyday.\u003c/p>\u003ca class=\"ag-btn secondary\" href=\"#ag-modes\">Explore interaction \u2197\u003c/a>\u003c/div>\u003c/article>\u003carticle class=\"ag-editorial-row\">\u003cimg src=\"assets/ag100-cat-life-scale2.webp\" alt=\"Illustrative generated lifestyle scene: A curious cat beside the black MI-1\" width=\"1536\" height=\"1024\" loading=\"lazy\" decoding=\"async\">\u003cdiv>\u003cp class=\"ag-kicker\">02 / FOLLOW THEIR CURIOSITY\u003c/p>\u003ch2>Their next\u003cbr>little discovery.\u003c/h2>\u003cp>Movement, sound effects and feather play bring variety to supervised playtime. Choose automatic play or take the controls yourself.\u003c/p>\u003ca class=\"ag-btn secondary\" href=\"#ag-modes\">Explore interaction \u2197\u003c/a>\u003c/div>\u003c/article>\u003carticle class=\"ag-editorial-row\">\u003cimg src=\"assets/ag100-life-evening-v3.webp\" alt=\"Illustrative generated lifestyle scene: A woman and tabby cat with the small MI-1 in a softly lit evening living room\" width=\"1536\" height=\"1024\" loading=\"lazy\" decoding=\"async\">\u003cdiv>\u003cp class=\"ag-kicker\">03 / THE MOMENTS IN BETWEEN\u003c/p>\u003ch2>A little character.\u003cbr>A lot to enjoy.\u003c/h2>\u003cp>Make time for a shared moment at home. Expressive eyes and playful interactions give MI-1 its unmistakable personality.\u003c/p>\u003ca class=\"ag-btn secondary\" href=\"#ag-modes\">Explore interaction \u2197\u003c/a>\u003c/div>\u003c/article>\u003cp class=\"ag-life-caption\">A little character for the moments you share. Explore MI-1 at home.\u003c/p>\u003c/section>\u003csection class=\"ag-end\">\u003cp class=\"ag-kicker\" style=\"color:inherit\">A playful addition to your everyday\u003c/p>\u003ch2>Meet your next\u003cbr>little sidekick.\u003c/h2>\u003cp>MI-1 is joining the Nexora collection. Ordering details will appear here when available.\u003c/p>\u003ca class=\"ag-btn\" href=\"buy-mi-1.html\">Choose your MI-1 \u2197\u003c/a>\u003c/section>\u003c/div>\u003csection class=\"mi-guide ag-shell\">\u003cp class=\"ag-kicker\">THE MI-1 GUIDE\u003c/p>\u003ch2>Get to know every side.\u003c/h2>\u003cdiv class=\"mi-guide-group\">\u003ch3>Play modes\u003c/h3>\u003cdiv class=\"mi-guide-grid\">\u003carticle id=\"mi-auto\">\u003cp class=\"ag-kicker\">Automatic play\u003c/p>\u003ch4>Movement for curious cats\u003c/h4>\u003cp>Switch to automatic mode for moving play. Infrared sensors help detect obstacles. Use a clear floor area and supervise your cat.\u003c/p>\u003c/article>\u003carticle id=\"mi-remote\">\u003cp class=\"ag-kicker\">Remote control\u003c/p>\u003ch4>Take a turn together\u003c/h4>\u003cp>Direct movement with the handheld transmitter. This is local remote control, not phone control over the internet.\u003c/p>\u003c/article>\u003carticle id=\"mi-toys\">\u003cp class=\"ag-kicker\">Laser &amp; feather\u003c/p>\u003ch4>More ways to invite play\u003c/h4>\u003cp>The feather attachment and built-in laser add variety. Avoid eyes and reflective surfaces, supervise play, and inspect attachments regularly.\u003c/p>\u003c/article>\u003c/div>\u003c/div>\u003cdiv class=\"mi-guide-group\">\u003ch3>Interaction\u003c/h3>\u003cdiv class=\"mi-guide-grid\">\u003carticle id=\"mi-voice\">\u003cp class=\"ag-kicker\">Voice commands\u003c/p>\u003ch4>A few words. A response.\u003c/h4>\u003cp>The MI-1 recognizes supported English and Chinese commands offline. Its documented wake phrase is \u201cHi WILL\u201d, followed by a command such as \u201cGo forward\u201d. A custom MI-1 wake phrase is not confirmed.\u003c/p>\u003c/article>\u003carticle id=\"mi-touch\">\u003cp class=\"ag-kicker\">Touch &amp; expressions\u003c/p>\u003ch4>Character you can interact with\u003c/h4>\u003cp>Tap or stroke the head sensor for responses and sounds. Its expressions are interactive play features, not evidence of human-like feelings.\u003c/p>\u003c/article>\u003carticle id=\"mi-growth\">\u003cp class=\"ag-kicker\">Growth stages\u003c/p>\u003ch4>Character through play\u003c/h4>\u003cp>The supplier describes four growth stages with different faces and responses as playtime accumulates. This is not confirmed personal memory or learning about your cat.\u003c/p>\u003c/article>\u003c/div>\u003c/div>\u003cdiv class=\"mi-guide-group\">\u003ch3>Product guide\u003c/h3>\u003cdiv class=\"mi-guide-grid\">\u003carticle id=\"mi-setup\">\u003cp class=\"ag-kicker\">Getting started\u003c/p>\u003ch4>Make room for a first hello\u003c/h4>\u003cp>Charge the robot and pair the supplied remote following the included manual. Try manual control in a clear, dry space before exploring automatic play.\u003c/p>\u003c/article>\u003carticle id=\"mi-connect\">\u003cp class=\"ag-kicker\">Connectivity\u003c/p>\u003ch4>Designed for offline play\u003c/h4>\u003cp>The supplier lists a 433 MHz remote and offline voice commands. A phone app, camera recording, Wi-Fi control, open-ended AI chat and Synapses integration are not confirmed.\u003c/p>\u003c/article>\u003carticle id=\"mi-care\">\u003cp class=\"ag-kicker\">Care &amp; play\u003c/p>\u003ch4>A little attention goes a long way\u003c/h4>\u003cp>Designed for interactive cat play. Keep the robot dry and supervise sessions. Stop if your cat appears uncomfortable. Follow the included manual for charging and replacing attachments.\u003c/p>\u003c/article>\u003c/div>\u003c/div>\u003cp class=\"mi-guide-source\">Features refer to the underlying Wellturn MI-1 hardware. Consult the supplied manual before use.\u003c/p>\u003c/section>\u003c/main>\u003cfooter class=\"ag ag-footer\">\u003cdiv>\u003ca class=\"ag-footer-logo\" href=\"index.html\">NEXORA\u003c/a>\u003cp>A more considered tomorrow.\u003c/p>\u003c/div>\u003cnav aria-label=\"Explore Nexora\">\u003cspan>EXPLORE\u003c/span>\u003ca href=\"shop.html\">The collection\u003c/a>\u003ca href=\"technology.html\">Technology\u003c/a>\u003ca href=\"nexus-hub.html\">Nexus Hub\u003c/a>\u003c/nav>\u003cnav aria-label=\"Product information\">\u003cspan>MI-1\u003c/span>\u003ca href=\"#ag-play\">Discover the robot\u003c/a>\u003ca href=\"#ag-details\">Specifications\u003c/a>\u003ca href=\"contact.html\">Contact &amp; support\u003c/a>\u003c/nav>\u003cdiv class=\"ag-footer-bottom\">MI-1 by Nexora \u00b7 Hardware model: Wellturn MI-1. \u00a9 2026 Nexora \u003cspan>Thoughtful technology. Everyday possibility.\u003c/span>\u003c/div>\u003c/footer>\u003cscript src=\"assets/ag100-launch.js\" defer=\"\">\u003c/script>\u003cscript src=\"assets/ag100-scroll.js\" defer=\"\">\u003c/script>\u003cscript src=\"assets/nexora-cart.js\">\u003c/script>\u003cscript src=\"assets/nexora-discovery.js\">\u003c/script>\u003cscript src=\"assets/mi1-motion.js\">\u003c/script>\u003c/body>\u003c/html>","buy-mi-1.html":"\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>Choose your MI-1 \u2014 Nexora\u003c/title>\u003clink rel=\"stylesheet\" href=\"assets/theme.css\">\u003cscript src=\"assets/theme.js\" defer=\"\">\u003c/script>\u003cscript src=\"assets/product.js\" defer=\"\">\u003c/script>\u003clink rel=\"stylesheet\" href=\"assets/shared-navigation.css\">\u003clink rel=\"stylesheet\" href=\"assets/catalog.css\">\u003cscript src=\"assets/opennote-menu.js?v=lf2\" defer=\"\">\u003c/script>\u003cscript src=\"assets/catalog.js\" defer=\"\">\u003c/script>\u003clink rel=\"stylesheet\" href=\"assets/robot-eye-test.css\">\u003cscript src=\"assets/robot-eye-test.js\" defer=\"\">\u003c/script>\u003clink rel=\"stylesheet\" href=\"assets/navigation-type.css?v=1\">\u003clink rel=\"preload\" href=\"assets/inter-latin-standard-normal.woff2\" as=\"font\" type=\"font/woff2\" crossorigin=\"\">\u003clink rel=\"stylesheet\" href=\"assets/header-stability.css\">\u003cscript src=\"assets/motion-umd.js\" defer=\"\">\u003c/script>\u003cscript src=\"assets/header-magnet.js\" defer=\"\">\u003c/script>\u003cmeta name=\"description\" content=\"Meet MI-1: expressive eyes, offline voice commands and interactive pet play. Discover Nexora\u2019s playful robot compan s\u003c/div>\u003cdiv class=\"ag-buy-grid\">\u003cdiv class=\"ag-gallery\">\u003cdiv class=\"ag-buy-image\">\u003cimg id=\"ag-buy-photo\" src=\"assets/ag100-black-stock.jpg\" alt=\"Black MI-1 supplier product photograph\" width=\"2000\" height=\"2000\">\u003cspan id=\"ag-photo-label\">Black / Product view\u003c/span>\u003c/div>\u003cdiv class=\"ag-thumbnails\" aria-label=\"Product gallery\">\u003cbutton type=\"button\" data-photo=\"product\" aria-pressed=\"true\" aria-label=\"Product photograph\">\u003cimg src=\"assets/ag100-black-stock.jpg\" id=\"ag-product-thumb\" alt=\"\" width=\"100\" height=\"100\">\u003c/button>\u003cbutton type=\"button\" data-photo=\"people\" aria-pressed=\"false\" aria-label=\"Lifestyle scene with person\">\u003cimg src=\"assets/ag100-people-life-scale2.webp\" alt=\"\" width=\"100\" height=\"100\">\u003c/button>\u003cbutton type=\"button\" data-photo=\"cat\" aria-pressed=\"false\" aria-label=\"Lifestyle scene with cat\">\u003cimg src=\"assets/ag100-cat-life-scale2.webp\" alt=\"\" width=\"100\" height=\"100\">\u003c/button>\u003c/div>\u003cp class=\"ag-note\">Explore the gallery for a closer look. Lifestyle scenes show the Black finish.\u003c/p>\u003c/div>\u003csection class=\"ag-purchase\" aria-labelledby=\"ag-buy-title\">\u003cp class=\"ag-kicker\">MI-1 / CHOOSE YOUR COMPANION\u003c/p>\u003ch1 id=\"ag-buy-title\">\u003cimg class=\"mi-buy-logo\" src=\"assets/mi1-lockup.svg\" alt=\"MI-1 by Nexora\" width=\"320\" height=\"94\">\u003c/h1>\u003cp class=\"ag-buy-subtitle\">A little robot. For their curiosity.\u003c/p>\u003cp class=\"ag-lead\">Expressive eyes, offline voice commands and a playful new way to spend time with your cat.\u003c/p>\u003cdiv class=\"ag-price\">\u003cstrong>US$99\u003c/strong>\u003cspan>Launch price \u00b7 Per robot\u003c/span>\u003c/div>\u003cfieldset class=\"ag-colors\">\u003clegend>Finish \u2014 \u003cspan id=\"ag-finish\">Black\u003c/span>\u003c/legend>\u003clabel>\u003cinput type=\"radio\" name=\"finish\" value=\"black\" checked=\"\">\u003cspan class=\"ag-swatch black\">\u003c/span>Black\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"finish\" value=\"white\">\u003cspan class=\"ag-swatch white\">\u003c/span>White\u003c/label>\u003c/fieldset>\u003cdiv class=\"ag-quantity\">\u003clabel for=\"ag-qty\">Quantity\u003c/label>\u003cdiv>\u003cbutton type=\"button\" id=\"ag-minus\" aria-label=\"Decrease quantity\">\u2212\u003c/button>\u003cinput id=\"ag-qty\" type=\"number\" value=\"1\" min=\"1\" max=\"10\" inputmode=\"numeric\" aria-label=\"Quantity\">\u003cbutton type=\"button\" id=\"ag-plus\" aria-label=\"Increase quantity\">+\u003c/button>\u003c/div>\u003c/div>\u003cbutton class=\"ag-order\" type=\"button\" disabled=\"\">Add to basket\u003c/button>\u003cp class=\"ag-order-note\" aria-live=\"polite\" id=\"ag-selection\">Black \u00b7 1 robot selected. Free standard shipping to Canada and the USA.\u003c/p>\u003ca class=\"ag-return\" href=\"mi-1.html\">Explore the full MI-1 experience \u2197\u003c/a>\u003cdetails open=\"\">\u003csummary>What makes it different\u003c/summary>\u003cp>A 1.83-inch expression display, voice-command interaction, infrared obstacle sensing and automatic or remote-controlled play.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>Our first. Your new companion.\u003c/summary>\u003cp>MI-1 marks our first product launch. The 1 is a nod to where Nexora begins: a small companion, full of character, with a place in your family.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>Voice &amp; connectivity\u003c/summary>\u003cp>Supports offline English and Chinese commands. Open-ended AI conversation, a phone app and camera monitoring are not confirmed features.\u003c/p>\u003c/details>\u003c/section>\u003c/div>\u003csection class=\"ag-life ag-editorial-life ag-buy-lifestyle\" aria-labelledby=\"ag-life-title\">\u003cdiv class=\"ag-life-heading\">\u003cp class=\"ag-kicker\">AT HOME WITH MI-1\u003c/p>\u003ch2 id=\"ag-life-title\">Small moments.\u003cbr>More character.\u003c/h2>\u003c/div>\u003carticle class=\"ag-editorial-row\">\u003cimg src=\"assets/ag100-life-day-v3.webp\" alt=\"Illustrative generated lifestyle scene: A man and ginger cat watching the small black MI-1 on the floor\" width=\"1536\" height=\"1024\" loading=\"lazy\" decoding=\"async\">\u003cdiv>\u003cp class=\"ag-kicker\">01 / A MOMENT TOGETHER\u003c/p>\u003ch2>Make room\u003cbr>for a little play.\u003c/h2>\u003cp>A curious cat. A familiar room. A small companion that brings something playful to the everyday.\u003c/p>\u003ca class=\"ag-btn secondary\" href=\"mi-1.html#ag-modes\">Explore interaction \u2197\u003c/a>\u003c/div>\u003c/article>\u003carticle class=\"ag-editorial-row\">\u003cimg src=\"assets/ag100-cat-life-scale2.webp\" alt=\"Illustrative generated lifestyle scene: A curious cat beside the black MI-1\" width=\"1536\" height=\"1024\" loading=\"lazy\" decoding=\"async\">\u003cdiv>\u003cp class=\"ag-kicker\">02 / FOLLOW THEIR CURIOSITY\u003c/p>\u003ch2>Their next\u003cbr>little discovery.\u003c/h2>\u003cp>Movement, sound effects and feather play bring variety to supervised playtime. Choose automatic play or take the controls yourself.\u003c/p>\u003ca class=\"ag-btn secondary\" href=\"mi-1.html#ag-modes\">Explore interaction \u2197\u003c/a>\u003c/div>\u003c/article>\u003carticle class=\"ag-editorial-row\">\u003cimg src=\"assets/ag100-life-evening-v3.webp\" alt=\"Illustrative generated lifestyle scene: A woman and tabby cat with the small MI-1 in a softly lit evening living room\" width=\"1536\" height=\"1024\" loading=\"lazy\" decoding=\"async\">\u003cdiv>\u003cp class=\"ag-kicker\">03 / THE MOMENTS IN BETWEEN\u003c/p>\u003ch2>A little character.\u003cbr>A lot to enjoy.\u003c/h2>\u003cp>Make time for a shared moment at home. Expressive eyes and playful interactions give MI-1 its unmistakable personality.\u003c/p>\u003ca class=\"ag-btn secondary\" href=\"mi-1.html#ag-modes\">Explore interaction \u2197\u003c/a>\u003c/div>\u003c/article>\u003cp class=\"ag-life-caption\">A little character for the moments you share. Explore MI-1 at home.\u003c/p>\u003c/section>\u003c/main>\u003cfooter class=\"ag ag-footer\">\u003cdiv>\u003ca class=\"ag-footer-logo\" href=\"index.html\">NEXORA\u003c/a>\u003cp>A more considered tomorrow.\u003c/p>\u003c/div>\u003cnav aria-label=\"Explore Nexora\">\u003cspan>EXPLORE\u003c/span>\u003ca href=\"shop.html\">The collection\u003c/a>\u003ca href=\"technology.html\">Technology\u003c/a>\u003ca href=\"nexus-hub.html\">Nexus Hub\u003c/a>\u003c/nav>\u003cnav aria-label=\"Product information\">\u003cspan>MI-1\u003c/span>\u003ca href=\"mi-1.html#ag-play\">Discover the robot\u003c/a>\u003ca href=\"mi-1.html#ag-details\">Specifications\u003c/a>\u003ca href=\"contact.html\">Contact &amp; support\u003c/a>\u003c/nav>\u003cdiv class=\"ag-footer-bottom\">MI-1 by Nexora \u00b7 Hardware model: Wellturn MI-1. \u00a9 2026 Nexora \u003cspan>Thoughtful technology. Everyday possibility.\u003c/span>\u003c/div>\u003c/footer>\u003cscript src=\"assets/ag100-buy.js\" defer=\"\">\u003c/script>\u003cscript src=\"assets/nexora-cart.js\">\u003c/script>\u003cscript src=\"assets/nexora-discovery.js\">\u003c/script>\u003cscript src=\"assets/mi1-motion.js\">\u003c/script>\u003c/body>\u003c/html>"},"assets":{"assets/ag100-black-angle.jpg":{"external":true,"text":false,"path":"https://nexora.synapses.cloud/assets/batch-01/ag100-black-angle.jpg"},"assets/ag100-black-stock.jpg":{"external":true,"text":false,"path":"https://nexora.synapses.cloud/assets/batch-01/ag100-black-stock.jpg"},"assets/ag100-buy.js":{"external":true,"text":false,"path":"https://nexora.synapses.cloud/assets/batch-01/ag100-buy-v5.js"},"assets/ag100-cat-life-scale2.webp":{"external":true,"text":false,"path":"https://nexora.synapses.cloud/assets/batch-01/ag100-cat-life-scale2.webp"},"assets/ag100-cat-life.webp":{"external":true,"text":false,"path":"https://nexora.synapses.cloud/assets/batch-01/ag100-cat-life.webp"},"assets/ag100-experience.css":{"external":true,"t
