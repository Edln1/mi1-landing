o{opacity:1;transform:none}}}\n.taste{margin:0 0 60px;border-top:1px solid #41534d;padding-top:30px}.taste h2{font-size:clamp(28px,4vw,44px);max-width:700px}.taste h3{font-size:22px;font-weight:400;margin:34px 0 18px}.taste h4{font-size:21px;line-height:1.25;font-weight:400;margin:4px 0 12px}.taste-intro{font-size:17px;color:#c0cfcc;max-width:800px}.taste-note{font-size:12px;color:#9aada8}.taste-method{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:18px;margin:26px 0}.taste-method strong{font-size:13px;font-weight:500}.taste-method p,.taste-current p{font-size:13px;color:#aebbb8}.taste-current{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.taste-current>div{padding:20px;background:#111e1b;border:1px solid #2f433c;border-radius:10px}.taste-current strong{color:#add5c6;font-size:12px;font-weight:400}.taste-routes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.taste-route{padding:24px;border:1px solid #35443e;border-radius:12px;background:#0e1715}.taste-route>p:not(.eyebrow){font-size:14px;color:#becfc7}.taste-links{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:#b4dbcd}.taste-evidence{margin-top:24px;color:#acb9b5;font-size:13px}.taste-evidence summary{cursor:pointer;color:#d4e5df}.taste-evidence a{color:#c2e6da}@media(max-width:950px){.taste-method{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:700px){.taste-current,.taste-routes{grid-template-columns:1fr}.taste-route{padding:20px}}\u003c/style>\u003clink rel=\"stylesheet\" href=\"assets/mobile-repair.css\">\u003cstyle id=\"white-menu-repair\">/* Match the homepage drawer silhouette and motion. */\nbody.ag-white-store:not(.nx-support-blue) .on-header .on-mini.on-mega{background:transparent!important;border-radius:0!important}\nbody.ag-white-store:not(.nx-support-blue) .on-header .on-mega>.on-menu-surface{background:#f7f7f7!important;border-radius:0 0 18px 18px!important;transition:transform .6s cubic-bezier(.7,0,.2,1)!important;transform:translateY(-105%);box-shadow:0 14px 24px #0000000a}\nbody.ag-white-store:not(.nx-support-blue) .on-header .menu-visible>.on-mega>.on-menu-surface{transform:translateY(0)}\nbody.ag-white-store:not(.nx-support-blue) .on-header .on-mega-card-image{background:#f7f7f7!important;isolation:isolate}\nbody.ag-white-store:not(.nx-support-blue) .on-header .on-mega-card-image img{background:transparent!important;mix-blend-mode:multiply}\n@media(max-width:767px){body.ag-white-store:not(.nx-support-blue) .on-header .on-mega>.on-menu-surface{transform:none!important}}\n@media(prefers-reduced-motion:reduce){body.ag-white-store:not(.nx-support-blue) .on-header .on-mega>.on-menu-surface{transition:none!important}}\n\u003c/style>\u003c/head>\u003cbody>\u003cheader>\u003ca class=\"logo\" href=\"index.html\">NEXORA\u003c/a>\u003csmall>INTERNAL COLLECTION RESEARCH\u003c/small>\u003ca href=\"shop.html\">Back to the store \u2197\u003c/a>\u003c/header>\u003cmain>\u003csection class=\"intro\">\u003cp class=\"eyebrow\">Sourcing review / 8 September 2026 / US &amp; Canada\u003c/p>\u003ch1>The future people want.\u003cbr>\u003cspan>The hardware that exists.\u003c/span>\u003c/h1>\u003cp>A collection shaped by excitement, sci-fi nostalgia and remarkable real technology. Sales are one signal; the experience someone dreams of owning comes first.\u003c/p>\u003c/section>\u003csection class=\"taste\" id=\"market-taste\">\u003cp class=\"eyebrow\">Updated direction / excitement, nostalgia &amp; real technology\u003c/p>\u003ch2>Would someone dream of owning it?\u003c/h2>\u003cp class=\"taste-intro\">That question leads this search. A new product can deserve attention before it has large sales numbers. We evaluate emotional appeal separately from whether the exact hardware is ready to sell.\u003c/p>\u003cp class=\"taste-note\">The assessments below are our product judgments, not survey scores or claims of proven demand.\u003c/p>\u003cdiv class=\"taste-method\">\u003cdiv>\u003cstrong>Recognizable desire\u003c/strong>\u003cp>Does it give someone an experience they already wished existed in a film, comic or show?\u003c/p>\u003c/div>\u003cdiv>\u003cstrong>A real moment of surprise\u003c/strong>\u003cp>Is the remarkable effect visible in ordinary footage of the actual hardware?\u003c/p>\u003c/div>\u003cdiv>\u003cstrong>Design worth living with\u003c/strong>\u003cp>Would someone want it in a beautiful room after the novelty wears off?\u003c/p>\u003c/div>\u003cdiv>\u003cstrong>A reason to return\u003c/strong>\u003cp>Does personality, creativity, play or practical use make it rewarding repeatedly?\u003c/p>\u003c/div>\u003cdiv>\u003cstrong>Evidence that supports the judgment\u003c/strong>\u003cp>Use fan preferences, category response, exact sales and competitive saturation together. High sales are not a prerequisite for an interesting discovery.\u003c/p>\u003c/div>\u003c/div>\u003ch3>How the current collection feels\u003c/h3>\u003cdiv class=\"taste-current\">\u003cdiv>\u003ch4>SC-S1\u003c/h4>\u003cstrong>Strong identity\u003c/strong>\u003cp>A distinctive physical companion with a purpose at home. Prioritize the quality and personality of its real behavior.\u003c/p>\u003c/div>\u003cdiv>\u003ch4>DM03\u003c/h4>\u003cstrong>Promising emotional appeal\u003c/strong>\u003cp>A small expressive desk companion can feel personal. Repetitive animations or weak conversation would undermine that appeal.\u003c/p>\u003c/div>\u003cdiv>\u003ch4>Levitating speaker\u003c/h4>\u003cstrong>Strong first impression\u003c/strong>\u003cp>Visible levitation has immediate spectacle. Audio quality and finish must carry its value after the initial surprise.\u003c/p>\u003c/div>\u003cdiv>\u003ch4>AR99\u003c/h4>\u003cstrong>Strong fantasy; hardware gap\u003c/strong>\u003cp>Information in a lens is compelling. The current model\u2019s disputed specifications and limited display remain important.\u003c/p>\u003c/div>\u003cdiv>\u003ch4>Astronaut companion\u003c/h4>\u003cstrong>Weaker fit\u003c/strong>\u003cp>Space-themed styling supplies nostalgia, but distinctive interaction needs to supply the technology story. First replacement candidate.\u003c/p>\u003c/div>\u003c/div>\u003ch3>Experiences to pursue\u003c/h3>\u003cdiv class=\"taste-routes\">\u003cdiv class=\"taste-route\">\u003cp class=\"eyebrow\">01 / Lead direction\u003c/p>\u003ch4>A droid that belongs in your home\u003c/h4>\u003cp>Companionship, personality and the wish to own a small sci-fi droid.\u003c/p>\u003cdl>\u003cdt>The moment that sells the idea\u003c/dt>\u003cdd>It notices something, reacts, explores and returns home. The behavior makes the object feel present.\u003c/dd>\u003cdt>Our assessment\u003c/dt>\u003cdd>Strongest Nexora identity. SC-S1 is the current visual benchmark; DM03 is a smaller desktop interpretation. Their actual behavior still needs to live up to the story.\u003c/dd>\u003cdt>Actual hardware &amp; next check\u003c/dt>\u003cdd>Require a continuous real-device demo of spontaneous interaction, navigation where applicable, and the English app. Website eye animation cannot establish the robot\u2019s capabilities.\u003c/dd>\u003c/dl>\u003cdiv class=\"taste-links\">\u003ca href=\"https://www.starwars.com/news/poll-which-droid-is-your-favorite-r2-d2-or-bb-8\" target=\"_blank\" rel=\"noopener noreferrer\">Official droid fan poll \u2197\u003c/a>\u003c/div>\u003c/div>\u003cdiv class=\"taste-route\">\u003cp class=\"eyebrow\">02 / First new-category priority\u003c/p>\u003ch4>A personal image with real depth\u003c/h4>\u003cp>The holographic portrait or message you remember from science fiction, made personal.\u003c/p>\u003cdl>\u003cdt>The moment that sells the idea\u003c/dt>\u003cdd>Move your head and the image reveals a different view. Use a loved one, pet or an original 3D scene, rather than another promotional loop.\u003c/dd>\u003cdt>Our assessment\u003c/dt>\u003cdd>The E3D multiview frame has a clearer emotional use than a generic-looking 3D tablet. The tablet remains a useful alternative if its viewing experience and content workflow are better.\u003c/dd>\u003cdt>Actual hardware &amp; next check\u003c/dt>\u003cdd>E3D lists 49 views, cloud conversion and a Unity plug-in. This is a screen-bound depth display. Check view transitions, brightness, conversion artifacts and whether the software works for normal customers.\u003c/dd>\u003c/dl>\u003cdiv class=\"taste-links\">\u003ca href=\"https://www.e3d-meta.com/product/a-holographic-frame-that-combines-light-field-and-stereo-display-technology/\" target=\"_blank\" rel=\"noopener noreferrer\">E3D manufacturer \u2197\u003c/a>\u003ca href=\"https://www.kickstarter.com/projects/lookingglass/looking-glass-portrait\" target=\"_blank\" rel=\"noopener noreferrer\">Looking Glass category benchmark \u2197\u003c/a>\u003c/div>\u003c/div>\u003cdiv class=\"taste-route\">\u003cp class=\"eyebrow\">03 / Strong concept; find the right hardware\u003c/p>\u003ch4>Information through an ordinary-looking lens\u003c/h4>\u003cp>The appeal of a sci-fi heads-up display is receiving useful information while remaining in the real world.\u003c/p>\u003cdl>\u003cdt>The moment that sells the idea\u003c/dt>\u003cdd>A readable prompt appears in the lens during a real task, with the actual display shown honestly.\u003c/dd>\u003cdt>Our assessment\u003c/dt>\u003cdd>High emotional and technical fit. The current AR99\u2019s modest single-green display could disappoint someone expecting cinematic full-color AR. Better optics and software matter more than a dramatic product render.\u003c/dd>\u003cdt>Actual hardware &amp; next check\u003c/dt>\u003cdd>Resolve the exact AR99 configuration. A waveguide display, cinema glasses and camera-only AI glasses are different products; do not treat them as interchangeable.\u003c/dd>\u003c/dl>\u003cdiv class=\"taste-links\">\u003ca href=\"https://www.topaiglasses.com/ar99.html\" target=\"_blank\" rel=\"noopener noreferrer\">Current manufacturer specification \u2197\u003c/a>\u003c/div>\u003c/div>\u003cdiv class=\"taste-route\">\u003cp class=\"eyebrow\">04 / New sourcing direction\u003c/p>\u003ch4>A game board that moves for itself\u003c/h4>\u003cp>The animated tabletop-game fantasy: familiar physical objects appear to act on their own.\u003c/p>\u003cdl>\u003cdt>The moment that sells the idea\u003c/dt>\u003cdd>A remote opponent makes a move and a real piece travels across your board.\u003c/dd>\u003cdt>Our assessment\u003c/dt>\u003cdd>Strong visible surprise plus repeat use. Dejarik is the sci-fi association, but robotic chess recreates autonomous tabletop play, not holographic creatures. A restrained design could fit a premium home.\u003c/dd>\u003cdt>Actual hardware &amp; next check\u003c/dt>\u003cdd>Phantom demonstrates a branded product category and describes magnetic actuation. It is a benchmark, not an own-brand supplier. This pass did not establish a credible OEM board or an exact Alibaba transaction record.\u003c/dd>\u003c/dl>\u003cdiv class=\"taste-links\">\u003ca href=\"https://www.starwars.com/databank/dejarik\" target=\"_blank\" rel=\"noopener noreferrer\">Dejarik, official lore \u2197\u003c/a>\u003ca href=\"https://www.phantomchessboard.com/phantom-chess\" target=\"_blank\" rel=\"noopener noreferrer\">Phantom, branded benchmark only \u2197\u003c/a>\u003c/div>\u003c/div>\u003cdiv class=\"taste-route\">\u003cp class=\"eyebrow\">05 / Exploratory accent; below the core range\u003c/p>\u003ch4>A responsive liquid sculpture\u003c/h4>\u003cp>An apparent living material, reminiscent of sci-fi symbiotes or shape-changing matter.\u003c/p>\u003cdl>\u003cdt>The moment that sells the idea\u003c/dt>\u003cdd>Real magnetic liquid forms changing shapes in response to sound. The effect happens physically inside the chamber.\u003c/dd>\u003cdt>Our assessment\u003c/dt>\u003cdd>High visual curiosity, but a weaker match for the brief\u2019s advanced technology requirement. Keep it as a possible sculptural accent, not an automatic replacement for a robot or display.\u003c/dd>\u003cdt>Actual hardware &amp; next check\u003c/dt>\u003cdd>An Alibaba model 002 advertises OEM branding, AUX/sound pickup and no Bluetooth; its \u201cspeaker\u201d title alone does not establish audio playback. Indexed customization starts at 1,000 sets. No exact sold count verified. Inspect live motion, material quality and aging before promoting it.\u003c/dd>\u003c/dl>\u003cdiv class=\"taste-links\">\u003ca href=\"https://www.alibaba.com/product-detail/Simple-Interactive-Antigravity-Usb-Charge-Music_1601375924559.html\" target=\"_blank\" rel=\"noopener noreferrer\">Exact Alibaba lead \u2197\u003c/a>\u003ca href=\"https://ferrofluid.ferrotec.com/products/\" target=\"_blank\" rel=\"noopener noreferrer\">Ferrofluid material reference \u2197\u003c/a>\u003ca href=\"https://www.kickstarter.com/projects/2135529186/the-interactive-music-controlled-ferrofluid-masterpiece\" target=\"_blank\" rel=\"noopener noreferrer\">LYIEW SEED campaign \u2197\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003cdetails class=\"taste-evidence\">\u003csummary>Where taste meets evidence\u003c/summary>\u003cp>An official 2015 Star Trek poll of more than 7,000 fans put the holodeck first at 36%. That is evidence of an imagined experience\u2019s appeal among those respondents, not a modern US/Canada hardware survey. \u003ca href=\"https://www.startrek.com/news/piece-of-trek-tech-youd-want-to-have-is\" target=\"_blank\" rel=\"noopener noreferrer\">Read the poll \u2197\u003c/a>\u003c/p>\u003cp>Looking Glass Portrait attracted 8,051 campaign backers in 2020\u201321. LYIEW SEED\u2019s ferrofluid campaign attracted 32 in 2022. Those are separate historical category examples, not forecasts for our suppliers. Low volume alone does not disqualify an exciting discovery.\u003c/p>\u003cp>The R2-D2/BB-8 poll, Dejarik and symbiote associations establish cultural context. We have not measured what share of those fans want any exact Nexora product.\u003c/p>\u003c/details>\u003c/section>\u003ch2 id=\"hardware-shortlist\">The hardware shortlist\u003c/h2>\u003cdiv class=\"filters\" aria-label=\"Filter candidates\">\u003cbutton data-filter=\"all\" aria-pressed=\"true\">All leads\u003c/button>\u003cbutton data-filter=\"priority\" aria-pressed=\"false\">Priority research\u003c/button>\u003cbutton data-filter=\"hold\" aria-pressed=\"false\">Needs resolution\u003c/button>\u003cbutton data-filter=\"existing\" aria-pressed=\"false\">Current benchmark\u003c/button>\u003c/div>\u003cp class=\"count\" role=\"status\" aria-live=\"polite\">5 leads \u00b7 research status, not purchase availability\u003c/p>\u003csection class=\"grid\" aria-label=\"Candidate comparisons\">\u003carticle data-stage=\"priority\">\u003cdiv class=\"art\">\u003cimg src=\"https://s.alicdn.com/@sc04/kf/H2eebff48468943e8ab8aa6d59d0534afS.png_300x300.jpg\" alt=\"Eye-tracked 3D tablet \u2014 supplier illustration\" loading=\"eager\">\u003cspan class=\"tag priority\">Investigate first\u003c/span>\u003csmall>Supplier illustration\u003c/small>\u003c/div>\u003cdiv class=\"copy\">\u003cp class=\"eyebrow\">01 / Letine \u00b7 12.1-inch OEM lead\u003c/p>\u003ch2>Eye-tracked 3D tablet\u003c/h2>\u003cp class=\"concept\">Holographic messages \u2192 depth you can see without a headset.\u003c/p>\u003cdl>\u003cdt>Actual technology\u003c/dt>\u003cdd>Supplier advertises eye-tracked stereoscopic imagery. Screen-bound 3D; not a free-space hologram.\u003c/dd>\u003cdt>Supporting interest &amp; sales signals\u003c/dt>\u003cdd>13 sold on the exact Alibaba listing. No product reviews; sales period unknown.\u003c/dd>\u003cdt>Still to establish\u003c/dt>\u003cdd>Needs a matching demo, usable content workflow, branded sample and final software terms.\u003c/dd>\u003c/dl>\u003ca class=\"source\" href=\"https://www.alibaba.com/product-detail/12-1-Inch-Portable-MTK-Octa_1601756054969.html\" target=\"_blank\" rel=\"noopener noreferrer\">Open Alibaba listing \u003cspan aria-hidden=\"true\">\u2197\u003c/span>\u003c/a>\u003c/div>\u003c/article>\u003carticle data-stage=\"priority\">\u003cdiv class=\"art\">\u003cimg src=\"https://www.e3d-meta.com/wp-content/uploads/2024/08/holo-frame-image-1-600x600.png\" alt=\"Multiview depth frame \u2014 supplier illustration\" loading=\"lazy\">\u003cspan class=\"tag priority\">Added to storefront preview\u003c/span>\u003csmall>Supplier illustration\u003c/small>\u003c/div>\u003cdiv class=\"copy\">\u003cp class=\"eyebrow\">02 / E3D \u00b7 7.9-inch Holo Frame\u003c/p>\u003ch2>Multiview depth frame\u003c/h2>\u003cp class=\"concept\">A personal holographic portrait \u2192 a real multiview screen.\u003c/p>\u003cdl>\u003cdt>Actual technology\u003c/dt>\u003cdd>Manufacturer lists 49 views and multi-tile content. Panel resolution is not per-view resolution.\u003c/dd>\u003cdt>Supporting interest &amp; sales signals\u003c/dt>\u003cdd>Looking Glass Portrait: 8,051 backers. Category proxy only; no exact E3D Alibaba sales record verified.\u003c/dd>\u003cdt>Still to establish\u003c/dt>\u003cdd>Exact OEM rights, existing brand deployments, software license and sample terms remain open.\u003c/dd>\u003c/dl>\u003ca class=\"source\" href=\"lightfield-frame.html\">Explore Lightfield Frame \u003cspan aria-hidden=\"true\">\u2197\u003c/span>\u003c/a>\u003c/div>\u003c/article>\u003carticle data-stage=\"hold\">\u003cdiv class=\"art\">\u003cimg src=\"assets/ar99-display-glasses-studio-v1.webp\" alt=\"Optical information glasses \u2014 generated studio concept\" loading=\"lazy\">\u003cspan class=\"tag hold\">Resolve specifications\u003c/span>\u003csmall>Generated studio concept\u003c/small>\u003c/div>\u003cdiv class=\"copy\">\u003cp class=\"eyebrow\">03 / SmartXY AR99 \u00b7 existing collection\u003c/p>\u003ch2>Optical information glasses\u003c/h2>\u003cp class=\"concept\">EDITH-style assistance \u2192 information visible through a lens.\u003c/p>\u003cdl>\u003cdt>Actual technology\u003c/dt>\u003cdd>Manufacturer reference: camera-free, single-green right-eye display, connected to a phone.\u003c/dd>\u003cdt>Supporting interest &amp; sales signals\u003c/dt>\u003cdd>Rokid display-glasses campaign: 5,875 backers. Separate brand/category evidence, not AR99 orders.\u003c/dd>\u003cdt>Still to establish\u003c/dt>\u003cdd>Alibaba full-color claim conflicts with manufacturer reference. English app scope and exact configuration need confirmation.\u003c/dd>\u003c/dl>\u003ca class=\"source\" href=\"https://www.topaiglasses.com/ar99.html\" target=\"_blank\" rel=\"noopener noreferrer\">Open manufacturer reference \u003cspan aria-hidden=\"true\">\u2197\u003c/span>\u003c/a>\u003c/div>\u003c/article>\u003carticle data-stage=\"existing\">\u003cdiv class=\"art\">\u003cimg src=\"assets/sc-s1-companion-robot-card-real-v1.webp\" alt=\"SC-S1 mobile companion \u2014 generated lifestyle concept\" loading=\"lazy\">\u003cspan class=\"tag existing\">Current benchmark\u003c/span>\u003csmall>Generated lifestyle concept\u003c/small>\u003c/div>\u003cdiv class=\"copy\">\u003cp class=\"eyebrow\">04 / Longood \u00b7 existing collection\u003c/p>\u003ch2>SC-S1 mobile companion\u003c/h2>\u003cp class=\"concept\">A personal droid \u2192 a small mobile presence at home.\u003c/p>\u003cdl>\u003cdt>Actual technology\u003c/dt>\u003cdd>Supplier advertises a moving camera, two-way talk, pet play and automatic recharging.\u003c/dd>\u003cdt>Supporting interest &amp; sales signals\u003c/dt>\u003cdd>Loona: 7,811 campaign backers. SC-S1\u2019s inspected listing had no visible sold count.\u003c/dd>\u003cdt>Still to establish\u003c/dt>\u003cdd>Needs sample verification of navigation, docking and app continuity. Web eye animations are not firmware evidence.\u003c/dd>\u003c/dl>\u003ca class=\"source\" href=\"sc-s1-companion-robot.html\">View current product preview \u003cspan aria-hidden=\"true\">\u2197\u003c/span>\u003c/a>\u003c/div>\u003c/article>\u003carticle data-stage=\"hold\">\u003cdiv class=\"art\">\u003cimg src=\"https://ecdn6.globalso.com/upload/p/5335/image_other/2026-03/13.jpg\" alt=\"Holographic avatar capsule \u2014 supplier illustration\" loading=\"lazy\">\u003cspan class=\"tag hold\">On hold\u003c/span>\u003csmall>Supplier illustration\u003c/small>\u003c/div>\u003cdiv class=\"copy\">\u003cp class=\"eyebrow\">05 / Clientop \u00b7 Holo 5.5\u003c/p>\u003ch2>Holographic avatar capsule\u003c/h2>\u003cp class=\"concept\">A visible digital companion \u2192 only compelling if it truly interacts.\u003c/p>\u003cdl>\u003cdt>Actual technology\u003c/dt>\u003cdd>Manufacturer describes LCD imagery and Android. Actual optical depth and interactive service are unverified.\u003c/dd>\u003cdt>Supporting interest &amp; sales signals\u003c/dt>\u003cdd>25 sold on a multi-size Alibaba listing. Comparable avatar campaigns attracted 313\u2013357 backers each.\u003c/dd>\u003cdt>Still to establish\u003c/dt>\u003cdd>Manufacturer\u2019s embedded demo shows a square monitor, not this capsule. No launch recommendation.\u003c/dd>\u003c/dl>\u003ca class=\"source\" href=\"https://www.clientop.com/55-inch-3d-hologram-dispaly/\" target=\"_blank\" rel=\"noopener noreferrer\">Inspect manufacturer page \u003cspan aria-hidden=\"true\">\u2197\u003c/span>\u003c/a>\u003c/div>\u003c/article>\u003c/section>\u003csection class=\"notes\">\u003ch2>Read the evidence in context.\u003c/h2>\u003cp>Sold labels were inspected on Alibaba on 8 September 2026. Their time windows and geographic splits were not shown. They are not monthly sales or unique-buyer counts. Supplier imagery and specifications are claims to verify; generated images are explicitly labeled.\u003c/p>\u003cdetails>\u003csummary>Open campaign evidence and inspection notes\u003c/summary>\u003cul>\u003cli>\u003ca href=\"https://www.kickstarter.com/projects/lookingglass/looking-glass-portrait\">Looking Glass Portrait\u003c/a>: 8,051 backers, US$2,511,785; 2020\u201321 campaign.\u003c/li>\u003cli>\u003ca href=\"https://www.kickstarter.com/projects/rokid/new-rokid-glassesworlds-lighest-full-function-ai-glasses\">Rokid glasses\u003c/a>: 5,875 backers, HK$31,355,827; 2025 campaign.\u003c/li>\u003cli>\u003ca href=\"https://www.kickstarter.com/projects/keyitechnology/meet-loona-the-petbot-you-will-fall-in-love\">Loona\u003c/a>: 7,811 backers, US$3,004,517; 2022 campaign.\u003c/li>\u003cli>Closer avatar benchmarks: \u003ca href=\"https://www.kickstarter.com/projects/752925986/ai-holobox-chatgpt-powered-holographic-desktop-companion?lang=fr\">AI HoloBox\u003c/a> (355), \u003ca href=\"https://www.kickstarter.com/projects/faceai/faceal-your-personal-holographic-ai-assistant\">FaceAI\u003c/a> (357), \u003ca href=\"https://www.kickstarter.com/projects/810242876/animaview-a-real-time-ai-holographic-display\">AnimaView\u003c/a> (313). Backer counts concern separate global campaigns and cannot be summed as unique buyers.\u003c/li>\u003cli>\u003ca href=\"https://www.youtube.com/watch?v=SBtEByZUZWc\">Clientop\u2019s embedded demo\u003c/a> shows a square LCD monitor, not the Holo 5.5 capsule. This leaves its claimed experience unverified.\u003c/li>\u003c/ul>\u003c/details>\u003cp>Lightfield Frame has been added to the storefront as a collection preview, with a full product page. Ordering is not open. No supplier inquiries or purchases have been made.\u003c/p>\u003c/section>\u003c/main>\u003cfooter>Nexora \u00b7 Internal sourcing review \u00b7 No checkout or order collection\u003c/footer>\u003cscript>document.querySelectorAll('[data-filter]').forEach(button=>button.addEventListener('click',()=>{const filter=button.dataset.filter;document.querySelectorAll('[data-filter]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));let count=0;document.querySelectorAll('[data-stage]').forEach(card=>{card.hidden=filter!=='all'&&card.dataset.stage!==filter;if(!card.hidden)count++});document.querySelector('.count').textContent=count+' '+(count===1?'lead':'leads')+' \u00b7 research status, not purchase availability'}));\u003c/script>\u003cscript src=\"assets/nexora-cart.js\">\u003c/script>\u003cscript src=\"assets/nexora-discovery.js\">\u003c/script>\u003c/body>\u003c/html>","technology.html":"\u003c!DOCTYPE html>\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>Technology Journal \u2014 Nexora\u003c/title>\u003cmeta name=\"description\" content=\"Explore the technology behind voice recorders, display glasses, spatial frames and companion robots. Four illustrated Nexora field guides with interactive comparisons.\">\u003clink rel=\"stylesheet\" href=\"assets/shared-navigation.css\">\u003clink rel=\"stylesheet\" href=\"assets/navigation-type.css?v=1\">\u003clink rel=\"stylesheet\" href=\"assets/technology.css?v=1\">\u003cscript defer=\"\" src=\"assets/opennote-menu.js?v=lf2\">\u003c/script>\u003cscript defer=\"\" src=\"assets/technology.js?v=1\">\u003c/script>\u003clink rel=\"preload\" href=\"assets/inter-latin-standard-normal.woff2\" as=\"font\" type=\"font/woff2\" crossorigin=\"\">\u003clink rel=\"stylesheet\" href=\"assets/header-stability.css\">\u003cscript src=\"assets/motion-umd.js\" defer=\"\">\u003c/script>\u003cscript src=\"assets/header-magnet.js\" defer=\"\">\u003c/script>\u003clink rel=\"stylesheet\" href=\"assets/mobile-repair.css\">\u003cstyle id=\"white-menu-repair\">/* Match the homepage drawer silhouette and motion. */\nbody.ag-white-store:not(.nx-support-blue) .on-header .on-mini.on-mega{background:transparent!important;border-radius:0!important}\nbody.ag-white-store:not(.nx-support-blue) .on-header .on-mega>.on-menu-surface{background:#f7f7f7!important;border-radius:0 0 18px 18px!important;transition:transform .6s cubic-bezier(.7,0,.2,1)!important;transform:translateY(-105%);box-shadow:0 14px 24px #0000000a}\nbody.ag-white-store:not(.nx-support-blue) .on-header .menu-visible>.on-mega>.on-menu-surface{transform:translateY(0)}\nbody.ag-white-store:not(.nx-support-blue) .on-header .on-mega-card-image{background:#f7f7f7!important;isolation:isolate}\nbody.ag-white-store:not(.nx-support-blue) .on-header .on-mega ref=\"technology.html#spatial-displays\">\u003cdiv class=\"on-mega-card-image\">\u003cimg src=\"assets/home-workflow-frame-v2.webp\" width=\"500\" height=\"300\" alt=\"\" style=\"object-fit:cover\">\u003c/div>\u003cdiv class=\"on-mega-card-title\">Spatial displays \u003cspan>\u2192\u003c/span>\u003c/div>\u003cp>Read the field guide\u003c/p>\u003c/a>\u003ca class=\"on-mega-card\" style=\"--item:3\" href=\"technology.html#companions\">\u003cdiv class=\"on-mega-card-image\">\u003cimg src=\"assets/robot-living-cinematic.webp\" width=\"500\" height=\"300\" alt=\"\" style=\"object-fit:cover\">\u003c/div>\u003cdiv class=\"on-mega-card-title\">Companion robotics \u003cspan>\u2192\u003c/span>\u003c/div>\u003cp>Read the field guide\u003c/p>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003c/details>\u003ca href=\"nexus-hub.html\" class=\"nx-hover-button\">\u003cspan class=\"nx-hover-label\">Nexus Hub\u003c/span>\u003cspan class=\"nx-hover-fill\" aria-hidden=\"true\">Nexus Hub\u003c/span>\u003c/a>\u003cdetails>\u003csummary class=\"nx-hover-button\">\u003cspan class=\"nx-hover-label\">Explore\u003c/span>\u003cspan class=\"nx-hover-fill\" aria-hidden=\"true\">Explore\u003c/span>\u003c/summary>\u003cdiv class=\"on-mini\">\u003cdiv class=\"on-menu-surface\">\u003ca href=\"wearables.html\" data-scroll-experience-link=\"\">3D Scroll Experience \u003cspan aria-hidden=\"true\">\u2197\u003c/span>\u003c/a>\u003ca href=\"store-story.html?theme=blue\">Our story \u003cspan>\u2197\u003c/span>\u003c/a>\u003ca href=\"shop.html\">Discover the collection \u003cspan>\u2197\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/details>\u003cdetails>\u003csummary class=\"nx-hover-button\">\u003cspan class=\"nx-hover-label\">Support\u003c/span>\u003cspan class=\"nx-hover-fill\" aria-hidden=\"true\">Support\u003c/span>\u003c/summary>\u003cdiv class=\"on-mini\">\u003cdiv class=\"on-menu-surface\">\u003ca href=\"store-guide.html?theme=blue\">Product guide \u003cspan>\u2197\u003c/span>\u003c/a>\u003ca href=\"store-faq.html?theme=blue\">FAQs \u003cspan>\u2197\u003c/span>\u003c/a>\u003ca href=\"store-contact.html?theme=blue\">Contact us \u003cspan>\u2197\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/details>\u003c/nav>\u003cdiv class=\"on-header-icons\">\u003ca href=\"#search\" aria-label=\"Search\">\u003csvg viewBox=\"0 0 24 24\">\u003ccircle cx=\"10\" cy=\"10\" r=\"7\">\u003c/circle>\u003cpath d=\"m15 15 6 6\">\u003c/path>\u003c/svg>\u003c/a>\u003ca href=\"#account\" aria-label=\"Account\">\u003csvg viewBox=\"0 0 24 24\">\u003ccircle cx=\"12\" cy=\"7\" r=\"4\">\u003c/circle>\u003cpath d=\"M3 23v-3c0-7 18-7 18 0v3\">\u003c/path>\u003c/svg>\u003c/a>\u003ca href=\"#cart\" aria-label=\"Cart\">\u003csvg viewBox=\"0 0 24 24\">\u003cpath d=\"M1 2h3l3 14h13l3-11H5\">\u003c/path>\u003ccircle cx=\"9\" cy=\"21\" r=\"1\">\u003c/circle>\u003ccircle cx=\"19\" cy=\"21\" r=\"1\">\u003c/circle>\u003c/svg>\u003c/a>\u003c/div>\u003c/div>\u003cdiv class=\"on-menu-backdrop\" aria-hidden=\"true\">\u003c/div>\u003c/header>\u003cmain id=\"MainContent\">\u003csection class=\"tj-hero\">\u003cdiv>\u003cp class=\"tj-kicker\">NEXORA / TECHNOLOGY JOURNAL / VOL. 01\u003c/p>\u003ch1>Tomorrow,\u003cbr>\u003cem>explained.\u003c/em>\u003c/h1>\u003cp>A closer look at the ideas inside the objects.\u003cbr>Discover how they work. Find what feels like you.\u003c/p>\u003ca class=\"tj-hero-link\" href=\"#journal\">Open the journal \u003cspan>\u2193\u003c/span>\u003c/a>\u003c/div>\u003cdiv class=\"tj-cover-stack\" aria-hidden=\"true\">\u003cdiv class=\"tj-cover-back\">\u003c/div>\u003cdiv class=\"tj-mini-cover\">\u003cspan>NEXORA\u003cbr>FIELD NOTES\u003c/span>\u003cimg src=\"assets/ar99-display-glasses-studio-v1.webp\" alt=\"\">\u003cb>Objects from\u003cbr>a near future.\u003c/b>\u003csmall>VOICE / VISION / SPACE / COMPANIONS\u003c/small>\u003c/div>\u003c/div>\u003cdiv class=\"tj-hero-bottom\">\u003cspan>04 CHAPTERS. A WORLD OF POSSIBILITIES.\u003c/span>\u003cspan>Made for curious minds.\u003c/span>\u003c/div>\u003c/section>\u003cdiv class=\"tj-reader\" id=\"journal\">\u003caside class=\"tj-contents\">\u003cspan class=\"tj-kicker\">IN THIS VOLUME\u003c/span>\u003ch2>Contents\u003c/h2>\u003cnav aria-label=\"Journal chapters\">\u003ca href=\"#voice\" data-chapter-link=\"voice\">\u003cspan>01\u003c/span>\u003cb>Voice &amp; ideas\u003c/b>\u003ci>\u2197\u003c/i>\u003c/a>\u003ca href=\"#wearable-displays\" data-chapter-link=\"wearable-displays\">\u003cspan>02\u003c/span>\u003cb>Wearable displays\u003c/b>\u003ci>\u2197\u003c/i>\u003c/a>\u003ca href=\"#spatial-displays\" data-chapter-link=\"spatial-displays\">\u003cspan>03\u003c/span>\u003cb>Spatial displays\u003c/b>\u003ci>\u2197\u003c/i>\u003c/a>\u003ca href=\"#companions\" data-chapter-link=\"companions\">\u003cspan>04\u003c/span>\u003cb>Companion robotics\u003c/b>\u003ci>\u2197\u003c/i>\u003c/a>\u003c/nav>\u003cp>Four ways technology is finding a place in everyday life.\u003c/p>\u003ca class=\"tj-all-products\" href=\"shop.html#catalog-products\">Explore all products \u2192\u003c/a>\u003c/aside>\u003cdiv class=\"tj-pages\">\u003carticle class=\"tj-chapter\" id=\"voice\" aria-labelledby=\"title-voice\" data-chapter=\"voice\">\u003cdiv class=\"tj-spread\">\u003cdiv class=\"tj-editorial\">\u003cdiv class=\"tj-page-meta\">\u003cspan>FIELD NOTES / 01\u003c/span>\u003cspan>Voice &amp; ideas\u003c/span>\u003c/div>\u003ch2 id=\"title-voice\">Good ideas start\u003cbr>with a voice.\u003c/h2>\u003cp class=\"tj-deck\">From a passing thought to something you can return to.\u003c/p>\u003cp>A dedicated recorder gives a conversation a place to live. The microphone captures sound; software can turn that recording into words and then organise those words into something easier to revisit.\u003c/p>\u003cdiv class=\"tj-rule\">\u003c/div>\u003cspan class=\"tj-caption\">The future, in everyday objects.\u003c/span>\u003c/div>\u003cfigure class=\"tj-cover\">\u003cimg src=\"assets/ai-voice-recorder-life-v1.webp\" alt=\"Slim voice recorder on a walnut desk \u2014 generated lifestyle concept\" loading=\"lazy\">\u003cfigcaption>THE NEXORA JOURNAL \u003cspan>01 / 04\u003c/span>\u003c/figcaption>\u003c/figure>\u003c/div>\u003csection class=\"tj-explanation\">\u003cdiv>\u003cspan class=\"tj-kicker\">UNDER THE SURFACE\u003c/span>\u003ch3>Three steps. Different jobs.\u003c/h3>\u003cp>Recording, transcription and summarisation are separate stages. A recording stores the sound itself. Speech recognition estimates the words. A summariser selects and reorganises information. Keeping the original audio gives you something to check when a name, number or nuance matters.\u003c/p>\u003c/div>\u003cdiv class=\"tj-diagram\">\u003cdiv class=\"tj-wave\">\u003ci style=\"--h:12px\">\u003c/i>\u003ci style=\"--h:35px\">\u003c/i>\u003ci style=\"--h:58px\">\u003c/i>\u003ci style=\"--h:16px\">\u003c/i>\u003ci style=\"--h:39px\">\u003c/i>\u003ci style=\"--h:62px\">\u003c/i>\u003ci style=\"--h:20px\">\u003c/i>\u003ci style=\"--h:43px\">\u003c/i>\u003ci style=\"--h:66px\">\u003c/i>\u003ci style=\"--h:24px\">\u003c/i>\u003ci style=\"--h:47px\">\u003c/i>\u003ci style=\"--h:70px\">\u003c/i>\u003ci style=\"--h:28px\">\u003c/i>\u003ci style=\"--h:51px\">\u003c/i>\u003ci style=\"--h:74px\">\u003c/i>\u003ci style=\"--h:32px\">\u003c/i>\u003ci style=\"--h:55px\">\u003c/i>\u003ci style=\"--h:13px\">\u003c/i>\u003ci style=\"--h:36px\">\u003c/i>\u003ci style=\"--h:59px\">\u003c/i>\u003ci style=\"--h:17px\">\u003c/i>\u003ci style=\"--h:40px\">\u003c/i>\u003ci style=\"--h:63px\">\u003c/i>\u003ci style=\"--h:21px\">\u003c/i>\u003ci style=\"--h:44px\">\u003c/i>\u003ci style=\"--h:67px\">\u003c/i>\u003ci style=\"--h:25px\">\u003c/i>\u003ci style=\"--h:48px\">\u003c/i>\u003ci style=\"--h:71px\">\u003c/i>\u003ci style=\"--h:29px\">\u003c/i>\u003ci style=\"--h:52px\">\u003c/i>\u003ci style=\"--h:75px\">\u003c/i>\u003ci style=\"--h:33px\">\u003c/i>\u003ci style=\"--h:56px\">\u003c/i>\u003ci style=\"--h:14px\">\u003c/i>\u003c/div>\u003cspan class=\"tj-diagram-label\">A sound. A signal. A thought worth keeping.\u003c/span>\u003c/div>\u003c/section>\u003cdiv class=\"tj-facts\">\u003cdiv>\u003cspan>01\u003c/span>\u003ch4>Capture\u003c/h4>\u003cp>Sound becomes a file\u003c/p>\u003c/div>\u003cdiv>\u003cspan>02\u003c/span>\u003ch4>Transcribe\u003c/h4>\u003cp>Speech becomes text\u003c/p>\u003c/div>\u003cdiv>\u003cspan>03\u003c/span>\u003ch4>Summarise\u003c/h4>\u003cp>Text becomes a useful outline\u003c/p>\u003c/div>\u003c/div>\u003csection class=\"tj-variations\">\u003cdiv class=\"tj-section-head\">\u003cdiv>\u003cspan class=\"tj-kicker\">FIND YOUR FORMAT\u003c/span>\u003ch3>Same idea. Different possibilities.\u003c/h3>\u003c/div>\u003cspan class=\"tj-caption\">Select a format to explore \u2193\u003c/span>\u003c/div>\u003cdiv class=\"tj-variant-tabs\" role=\"tablist\" aria-label=\"Voice &amp; ideas formats\">\u003cbutton type=\"button\" role=\"tab\" id=\"tab-voice-0\" aria-selected=\"true\" aria-controls=\"panel-voice-0\" tabindex=\"0\" data-variant=\"0\">A dedicated recorder\u003cspan>\u2197\u003c/span>\u003c/button>\u003cbutton type=\"button\" role=\"tab\" id=\"tab-voice-1\" aria-selected=\"false\" aria-controls=\"panel-voice-1\" tabindex=\"-1\" data-variant=\"1\">Your phone\u003cspan>\u2197\u003c/span>\u003c/button>\u003cbutton type=\"button\" role=\"tab\" id=\"tab-voice-2\" aria-selected=\"false\" aria-controls=\"panel-voice-2\" tabindex=\"-1\" data-variant=\"2\">Recording earbuds\u003cspan>\u2197\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"tj-variant-panel\" role=\"tabpanel\" id=\"panel-voice-0\" aria-labelledby=\"tab-voice-0\">\u003cdiv class=\"tj-variant-photo\">\u003cimg src=\"assets/ai-voice-recorder-life-v1.webp\" alt=\"AI Voice Recorder \u2014 illustrative product imagery\" loading=\"lazy\">\u003c/div>\u003cdiv class=\"tj-variant-copy\">\u003cspan class=\"tj-kicker\">01 / Voice &amp; ideas\u003c/span>\u003ch4>A dedicated recorder\u003c/h4>\u003cp>A physical recording control and a separate device can make capturing a thought more deliberate. Our recorder preview lists 32GB storage; the final transcription service and fees are still being confirmed.\u003c/p>\u003ca class=\"tj-button\" href=\"ai-voice-recorder.html\">Explore AI Voice Recorder \u003cspan>\u2197\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003cdiv class=\"tj-variant-panel\" role=\"tabpanel\" id=\"panel-voice-1\" aria-labelledby=\"tab-voice-1\" hidden=\"\">\u003cdiv class=\"tj-variant-photo\">\u003cimg src=\"assets/home-day-work-v2.webp\" alt=\"A category comparison\" loading=\"lazy\">\u003cspan>Illustrative category reference\u003c/span>\u003c/div>\u003cdiv class=\"tj-variant-copy\">\u003cspan class=\"tj-kicker\">02 / Voice &amp; ideas\u003c/span>\u003ch4>Your phone\u003c/h4>\u003cp>A recording app keeps capture on a device you already carry. Microphone placement, app permissions and interruptions shape the experience. Transcription depends on the app you choose.\u003c/p>\u003cspan class=\"tj-caption\">A category comparison\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"tj-variant-panel\" role=\"tabpanel\" id=\"panel-voice-2\" aria-labelledby=\"tab-voice-2\" hidden=\"\">\u003cdiv class=\"tj-variant-photo\">\u003cimg src=\"assets/on-26c24e4771c5.jpg\" alt=\"Recorder showcase \u2014 illustrative product imagery\" loading=\"lazy\">\u003c/div>\u003cdiv class=\"tj-variant-copy\">\u003cspan class=\"tj-kicker\">03 / Voice &amp; ideas\u003c/span>\u003ch4>Recording earbuds\u003c/h4>\u003cp>Some earbud systems add recording to an audio accessory. Call capture, in-person capture and transcription can follow different workflows. The original recorder showcase explores this format.\u003c/p>\u003ca class=\"tj-button\" href=\"product.html\">Explore Recorder showcase \u003cspan>\u2197\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/section>\u003cdetails class=\"tj-question\">\u003csummary>Does AI recording mean everything happens on the device?\u003cspan>+\u003c/span>\u003c/summary>\u003cp>No. Audio capture can happen locally while transcription or summaries run through a phone or a cloud service. Languages, processing location, subscriptions and storage depend on the exact product and software package.\u003c/p>\u003c/details>\u003cdiv class=\"tj-footnotes\">\u003cp>The workflow illustration explains the category. It is not a live transcription service.\u003c/p>\u003cdetails>\u003csummary>Sources &amp; further reading\u003c/summary>\u003cp>Manufacturer references explain the underlying category; they do not imply that another brand\u2019s services are included with a Nexora product.\u003c/p>\u003ca href=\"https://support.plaud.ai/hc/en-us/articles/53793130069657-Transcribe-and-summarize\" target=\"_blank\" rel=\"noopener noreferrer\">Plaud: recording-to-text workflow \u2197\u003c/a>\u003ca href=\"https://www.alibaba.com/product-detail/Chat-GPT-AI-driven-32GB-Voice_1601799169978.html\" target=\"_blank\" rel=\"noopener noreferrer\">Our recorder hardware reference \u2197\u003c/a>\u003c/details>\u003c/div>\u003ca class=\"tj-next\" href=\"#wearable-displays\">\u003cspan>NEXT CHAPTER\u003c/span>\u003cstrong>Wearable displays\u003c/strong>\u003cb>\u2192\u003c/b>\u003c/a>\u003c/article>\u003carticle class=\"tj-chapter\" id=\"wearable-displays\" aria-labelledby=\"title-wearable-displays\" data-chapter=\"wearable-displays\">\u003cdiv class=\"tj-spread\">\u003cdiv class=\"tj-editorial\">\u003cdiv class=\"tj-page-meta\">\u003cspan>FIELD NOTES / 02\u003c/span>\u003cspan>Wearable displays\u003c/span>\u003c/div>\u003ch2 id=\"title-wearable-displays\">A little information.\u003cbr>A different perspective.\u003c/h2>\u003cp class=\"tj-deck\">Understanding what a display in a pair of glasses can actually do.\u003c/p>\u003cp>The most interesting interface might be the one that asks for less attention. A tiny display and carefully designed optics can put a short prompt into your field of view while the world around you stays visible.\u003c/p>\u003cdiv class=\"tj-rule\">\u003c/div>\u003cspan class=\"tj-caption\">The future, in everyday objects.\u003c/span>\u003c/div>\u003cfigure class=\"tj-cover\">\u003cimg src=\"assets/ar99-display-glasses-life-1.webp\" alt=\"AR99 glasses on a naturally lit desk \u2014 generated lifestyle concept\" loading=\"lazy\">\u003cfigcaption>THE NEXORA JOURNAL \u003cspan>02 / 04\u003c/span>\u003c/figcaption>\u003c/figure>\u003c/div>\u003csection class=\"tj-explanation\">\u003cdiv>\u003cspan class=\"tj-kicker\">UNDER THE SURFACE\u003c/span>\u003ch3>Small display. Carefully directed light.\u003c/h3>\u003cp>In the AR99 reference platform, a micro-LED light engine works with a waveguide to send a single-green image to the right eye. The glasses connect to a phone over Bluetooth. The hardware presents the information; the paired software determines which information is available.\u003c/p>\u003c/div>\u003cdiv class=\"tj-diagram\">\u003csvg viewBox=\"0 0 420 155\" fill=\"none\" aria-label=\"Light engine, lens and viewing path\">\u003crect x=\"30\" y=\"50\" width=\"100\" height=\"65\" rx=\"25\">\u003c/rect>\u003crect x=\"220\" y=\"50\" width=\"100\" height=\"65\" rx=\"25\">\u003c/rect>\u003cpath d=\"M130 68Q175 38 220 68M30 60 12 16m308 44 30-44\">\u003c/path>\u003cpath class=\"tj-light-path\" d=\"M337 31 288 70 247 89\">\u003c/path>\u003crect class=\"tj-green\" x=\"238\" y=\"68\" width=\"37\" height=\"22\" rx=\"2\">\u003c/rect>\u003cpath class=\"tj-green\" d=\"M242 75h22m-22 7h13\">\u003c/path>\u003c/svg>\u003cspan class=\"tj-diagram-label\">Light engine \u2192 waveguide \u2192 eye\u003c/span>\u003c/div>\u003c/section>\u003cdiv class=\"tj-facts\">\u003cdiv>\u003cspan>01\u003c/span>\u003ch4>Micro-LED\u003c/h4>\u003cp>Creates the image\u003c/p>\u003c/div>\u003cdiv>\u003cspan>02\u003c/span>\u003ch4>Waveguide\u003c/h4>\u003cp>Directs the light\u003c/p>\u003c/div>\u003cdiv>\u003cspan>03\u003c/span>\u003ch4>Right eye\u003c/h4>\u003cp>Receives the view\u003c/p>\u003c/div>\u003c/div>\u003csection class=\"tj-variations\">\u003cdiv class=\"tj-section-head\">\u003cdiv>\u003cspan class=\"tj-kicker\">FIND YOUR FORMAT\u003c/span>\u003ch3>Same idea. Different possibilities.\u003c/h3>\u003c/div>\u003cspan class=\"tj-caption\">Select a format to explore \u2193\u003c/span>\u003c/div>\u003cdiv class=\"tj-variant-tabs\" role=\"tablist\" aria-label=\"Wearable displays formats\">\u003cbutton type=\"button\" role=\"tab\" id=\"tab-wearable-displays-0\" aria-selected=\"true\" aria-controls=\"panel-wearable-displays-0\" tabindex=\"0\" data-variant=\"0\">Information glasses\u003cspan>\u2197\u003c/span>\u003c/button>\u003cbutton type=\"button\" role=\"tab\" id=\"tab-wearable-displays-1\" aria-selected=\"false\" aria-controls=\"panel-wearable-displays-1\" tabindex=\"-1\" data-variant=\"1\">Viewing glasses\u003cspan>\u2197\u003c/span>\u003c/button>\u003cbutton type=\"button\" role=\"tab\" id=\"tab-wearable-displays-2\" aria-selected=\"false\" aria-controls=\"panel-wearable-displays-2\" tabindex=\"-1\" data-variant=\"2\">Spatial headsets\u003cspan>\u2197\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"tj-variant-panel\" role=\"tabpanel\" id=\"panel-wearable-displays-0\" aria-labelledby=\"tab-wearable-displays-0\">\u003cdiv class=\"tj-variant-photo\">\u003cimg src=\"assets/ar99-display-glasses-studio-v1.webp\" alt=\"AR99 Display Glasses \u2014 illustrative product imagery\" loading=\"lazy\">\u003c/div>\u003cdiv class=\"tj-variant-copy\">\u003cspan class=\"tj-kicker\">01 / Wearable displays\u003c/span>\u003ch4>Information glasses\u003c/h4>\u003cp>A compact, glanceable interface for short pieces of information. The AR99 reference has a single-green, right-eye display and no camera. App functions and the final Nexora configuration remain under evaluation.\u003c/p>\u003ca class=\"tj-button\" href=\"ar99-display-glasses.html\">Explore AR99 Display Glasses \u003cspan>\u2197\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003cdiv class=\"tj-variant-panel\" role=\"tabpanel\" id=\"panel-wearable-displays-1\" aria-labelledby=\"tab-wearable-displays-1\" hidden=\"\">\u003cdiv class=\"tj-variant-photo\">\u003cimg src=\"assets/ar99-display-glasses-life-2.webp\" alt=\"Compare the display, not the label\" loading=\"lazy\">\u003cspan>Illustrative category reference\u003c/span>\u003c/div>\u003cdiv class=\"tj-variant-copy\">\u003cspan class=\"tj-kicker\">02 / Wearable displays\u003c/span>\u003ch4>Viewing glasses\u003c/h4>\u003cp>A different category built around watching a virtual screen. Colour, optics and connection requirements vary. A name containing \u201cAR\u201d does not tell you whether a device is for short prompts or full-screen viewing.\u003c/p>\u003cspan class=\"tj-caption\">Compare the display, not the label\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"tj-variant-panel\" role=\"tabpanel\" id=\"panel-wearable-displays-2\" aria-labelledby=\"tab-wearable-displays-2\" hidden=\"\">\u003cdiv class=\"tj-variant-photo\">\u003cimg src=\"assets/wearables-environment.webp\" alt=\"A different kind of interface\" loading=\"lazy\">\u003cspan>Illustrative category reference\u003c/span>\u003c/div>\u003cdiv class=\"tj-variant-copy\">\u003cspan class=\"tj-kicker\">03 / Wearable displays\u003c/span>\u003ch4>Spatial headsets\u003c/h4>\u003cp>A headset is a more enclosed format for larger digital workspaces and immersive content. Its fit, sensing and interaction requirements are different from a lightweight information display.\u003c/p>\u003cspan class=\"tj-caption\">A different kind of interface\u003c/span>\u003c/div>\u003c/div>\u003c/section>\u003cdetails class=\"tj-question\">\u003csummary>Can these glasses recognise everything I look at?\u003cspan>+\u003c/span>\u003c/summary>\u003cp>The AR99 reference has no camera. It displays information supplied by a paired phone or supported service. Seeing the outside world through the lens does not mean the device can capture or understand that world.\u003c/p>\u003c/details>\u003cdiv class=\"tj-footnotes\">\u003cp>Illustrations compare display categories. Only AR99 is included in the current Nexora eyewear preview.\u003c/p>\u003cdetails>\u003csummary>Sources &amp; further reading\u003c/summary>\u003cp>Manufacturer references explain the underlying category; they do not imply that another brand\u2019s services are included with a Nexora product.\u003c/p>\u003ca href=\"https://www.topaiglasses.com/ar99.html\" target=\"_blank\" rel=\"noopener noreferrer\">SmartXY: AR99 optics and reference configuration \u2197\u003c/a>\u003c/details>\u003c/div>\u003ca class=\"tj-next\" href=\"#spatial-displays\">\u003cspan>NEXT CHAPTER\u003c/span>\u003cstrong>Spatial displays\u003c/strong>\u003cb>\u2192\u003c/b>\u003c/a>\u003c/article>\u003carticle class=\"tj-chapter\" id=\"spatial-displays\" aria-labelledby=\"title-spatial-displays\" data-chapter=\"spatial-displays\">\u003cdiv class=\"tj-spread\">\u003cdiv class=\"tj-editorial\">\u003cdiv class=\"tj-page-meta\">\u003cspan>FIELD NOTES / 03\u003c/span>\u003cspan>Spatial displays\u003c/span>\u003c/div>\u003ch2 id=\"title-spatial-displays\">A nostalgic touch.\u003cbr>Another dimension.\u003c/h2>\u003cp class=\"tj-deck\">A familiar frame, with an unfamiliar sense of depth.\u003c/p>\u003cp>A picture frame is already a small window onto somewhere else. A multiview display adds another ingredient: different perspectives, directed toward different viewing positions.\u003c/p>\u003cdiv class=\"tj-rule\">\u003c/div>\u003cspan class=\"tj-caption\">The future, in everyday objects.\u003c/span>\u003c/div>\u003cfigure class=\"tj-cover\">\u003cimg src=\"assets/lightfield-frame-life-2-v1.webp\" alt=\"Wooden Lightfield Frame displaying a pet portrait \u2014 generated lifestyle concept\" loading=\"lazy\">\u003cfigcaption>THE NEXORA JOURNAL \u003cspan>03 / 04\u003c/span>\u003c/figcaption>\u003c/figure>\u003c/div>\u003csection class=\"tj-explanation\">\u003cdiv>\u003cspan class=\"tj-kicker\">UNDER THE SURFACE\u003c/span>\u003ch3>The picture changes with your point of view.\u003c/h3>\u003cp>A light-field display presents multiple views of suitable content. As your position changes, you see a different perspective. The impression of depth belongs to the display and its viewing zone. The effect depends on the source content, optics and where you stand.\u003c/p>\u003c/div>\u003cdiv class=\"tj-diagram\">\u003cdiv class=\"tj-depth-scene\">\u003cspan class=\"tj-view-ray r1\">\u003c/span>\u003cspan class=\"tj-view-ray r2\">\u003c/span>\u003cspan class=\"tj-view-ray r3\">\u003c/span>\u003cdiv class=\"tj-depth-frame\">\u003cspan class=\"tj-depth-orb\">\u003c/span>\u003ci>\u003c/i>\u003c/div>\u003c/div>\u003clabel class=\"tj-angle-label\">Viewing direction \u003coutput>Centre view\u003c/output>\u003cinput type=\"range\" min=\"-30\" max=\"30\" value=\"0\" aria-label=\"Illustrated viewing direction\">\u003c/label>\u003c/div>\u003c/section>\u003cdiv class=\"tj-facts\">\u003cdiv>\u003cspan>01\u003c/span>\u003ch4>Content\u003c/h4>\u003cp>Prepared with depth\u003c/p>\u003c/div>\u003cdiv>\u003cspan>02\u003c/span>\u003ch4>Multiple views\u003c/h4>\u003cp>Different perspectives\u003c/p>\u003c/div>\u003cdiv>\u003cspan>03\u003c/span>\u003ch4>Viewing zone\u003c/h4>\u003cp>Your position matters\u003c/p>\u003c/div>\u003c/div>\u003csection class=\"tj-variations\">\u003cdiv class=\"tj-section-head\">\u003cdiv>\u003cspan class=\"tj-kicker\">FIND YOUR FORMAT\u003c/span>\u003ch3>Same idea. Different possibilities.\u003c/h3>\u003c/div>\u003cspan class=\"tj-caption\">Select a format to explore \u2193\u003c/span>\u003c/div>\u003cdiv class=\"tj-variant-tabs\" role=\"tablist\" aria-label=\"Spatial displays formats\">\u003cbutton type=\"button\" role=\"tab\" id=\"tab-spatial-displays-0\" aria-selected=\"true\" aria-controls=\"panel-spatial-displays-0\" tabindex=\"0\" data-variant=\"0\">A digital photo frame\u003cspan>\u2197\u003c/span>\u003c/button>\u003cbutton type=\"button\" role=\"tab\" id=\"tab-spatial-displays-1\" aria-selected=\"false\" aria-controls=\"panel-spatial-displays-1\" tabindex=\"-1\" data-variant=\"1\">A multiview frame\u003cspan>\u2197\u003c/span>\u003c/button>\u003cbutton type=\"button\" role=\"tab\" id=\"tab-spatial-displays-2\" aria-selected=\"false\" aria-controls=\"panel-spatial-displays-2\" tabindex=\"-1\" data-variant=\"2\">A prepared 3D scene\u003cspan>\u2197\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"tj-variant-panel\" role=\"tabpanel\" id=\"panel-spatial-displays-0\" aria-labelledby=\"tab-spatial-displays-0\">\u003cdiv class=\"tj-variant-photo\">\u003cimg src=\"assets/lightfield-frame-life-2-v1.webp\" alt=\"The familiar starting point\" loading=\"lazy\">\u003cspan>Illustrative category reference\u003c/span>\u003c/div>\u003cdiv class=\"tj-variant-copy\">\u003cspan class=\"tj-kicker\">01 / Spatial displays\u003c/span>\u003ch4>A digital photo frame\u003c/h4>\u003cp>A flat screen shows a single view of a photo or video. It can still make a beautiful object; moving sideways does not reveal another viewpoint in the picture.\u003c/p>\u003cspan class=\"tj-caption\">The familiar starting point\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"tj-variant-panel\" role=\"tabpanel\" id=\"panel-spatial-displays-1\" aria-labelledby=\"tab-spatial-displays-1\" hidden=\"\">\u003cdiv class=\"tj-variant-photo\">\u003cimg src=\"assets/lightfield-frame-life-1-v1.webp\" alt=\"Lightfield Frame \u2014 illustrative product imagery\" loading=\"lazy\">\u003c/div>\u003cdiv class=\"tj-variant-copy\">\u003cspan class=\"tj-kicker\">02 / Spatial displays\u003c/span>\u003ch4>A multiview frame\u003c/h4>\u003cp>Different views make suitable imagery feel dimensional without glasses. Our Lightfield Frame preview uses a natural-wood enclosure and a 7.9-inch display; content preparation is part of the experience.\u003c/p>\u003ca class=\"tj-button\" href=\"lightfield-frame.html\">Explore Lightfield Frame \u003cspan>\u2197\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003cdiv class=\"tj-variant-panel\" role=\"tabpanel\" id=\"panel-spatial-displays-2\" aria-labelledby=\"tab-spatial-displays-2\" hidden=\"\">\u003cdiv class=\"tj-variant-photo\">\u003cimg src=\"assets/home-workflow-frame-v2.webp\" alt=\"The image is part of the technology\" loading=\"lazy\">\u003cspan>Illustrative category reference\u003c/span>\u003c/div>\u003cdiv class=\"tj-variant-copy\">\u003cspan class=\"tj-kicker\">03 / Spatial displays\u003c/span>\u003ch4>A prepared 3D scene\u003c/h4>\u003cp>Depth-aware photos and rendered 3D scenes provide different kinds of source material. More views alone cannot recover every hidden surface from an ordinary photograph. Content quality matters as much as the frame.\u003c/p>\u003cspan class=\"tj-caption\">The image is part of the technology\u003c/span>\u003c/div>\u003c/div>\u003c/section>\u003cdetails class=\"tj-question\">\u003csummary>Does the picture float out into the room?\u003cspan>+\u003c/span>\u003c/summary>\u003cp>No. This is a screen-based depth effect. Promotional images sometimes illustrate depth with objects outside a frame, but the hardware still presents its image through the display. The slider below is a schematic of viewing direction, not a simulation of the final hardware.\u003c/p>\u003c/details>\u003cdiv class=\"tj-footnotes\">\u003cp>Move the viewing-angle slider to explore the principle. The diagram is illustrative.\u003c/p>\u003cdetails>\u003csummary>Sources &amp; further reading\u003c/summary>\u003cp>Manufacturer references explain the underlying category; they do not imply that another brand\u2019s services are included with a Nexora product.\u003c/p>\u003ca href=\"https://blog.lookingglassfactory.com/unlocking-the-third-dimension-how-looking-glass-brings-3d-to-life/\" target=\"_blank\" rel=\"noopener noreferrer\">Looking Glass: multiview content explained \u2197\u003c/a>\u003ca href=\"https://www.e3d-meta.com/product/a-holographic-frame-that-combines-light-field-and-stereo-display-technology/\" target=\"_blank\" rel=\"noopener noreferrer\">E3D: frame platform \u2197\u003c/a>\u003c/details>\u003c/div>\u003ca class=\"tj-next\" href=\"#companions\">\u003cspan>NEXT CHAPTER\u003c/span>\u003cstrong>Companion robotics\u003c/strong>\u003cb>\u2192\u003c/b>\u003c/a>\u003c/article>\u003carticle class=\"tj-chapter\" id=\"companions\" aria-labelledby=\"title-companions\" data-chapter=\"companions\">\u003cdiv class=\"tj-spread\">\u003cdiv class=\"tj-editorial\">\u003cdiv class=\"tj-page-meta\">\u003cspan>FIELD NOTES / 04\u003c/span>\u003cspan>Companion robotics\u003c/span>\u003c/div>\u003ch2 id=\"title-companions\">A little character.\u003cbr>A place in your day.\u003c/h2>\u003cp class=\"tj-deck\">What makes a moving camera different from a desktop companion?\u003c/p>\u003cp>A face, a voice and a little movement can change how a piece of technology feels. But \u201ccompanion robot\u201d covers very different objects. Start with its physical job: does it move through a room, stay on your desk, or offer a voice interface?\u003c/p>\u003cdiv class=\"tj-rule\">\u003c/div>\u003cspan class=\"tj-caption\">The future, in everyday objects.\u003c/span>\u003c/div>\u003cfigure class=\"tj-cover\">\u003cimg src=\"assets/home-story-robot-v3.webp\" alt=\"SC-S1 robot beside a cat at home \u2014 generated lifestyle concept\" loading=\"lazy\">\u003cfigcaption>THE NEXORA JOURNAL \u003cspan>04 / 04\u003c/span>\u003c/figcaption>\u003c/figure>\u003c/div>\u003csection class=\"tj-explanation\">\u003cdiv>\u003cspan class=\"tj-kicker\">UNDER THE SURFACE\u003c/span>\u003ch3>Hardware gives personality a place to live.\u003c/h3>\u003cp>A mobile home camera combines a view of the room with movement and communication. A desktop companion focuses on nearby interaction: a display, touch input, audio or a cloud conversation service. Animated expressions make an interface approachable; they do not establish that a device has feelings.\u003c/p>\u003c/div>\u003cdiv class=\"tj-diagram\">\u003cdiv class=\"tj-robot-face\">\u003ci>\u003c/i>\u003ci>\u003c/i>\u003cspan>\u2323\u003c/span>\u003c/div>\u003cdiv class=\"tj-robot-base\">\u003c/div>\u003cspan class=\"tj-diagram-label\">An expressive interface. A physical presence.\u003c/span>\u003c/div>\u003c/section>\u003cdiv class=\"tj-facts\">\u003cdiv>\u003cspan>01\u003c/span>\u003ch4>Sense\u003c/h4>\u003cp>Camera, touch or voice\u003c/p>\u003c/div>\u003cdiv>\u003cspan>02\u003c/span>\u003ch4>Respond\u003c/h4>\u003cp>Software and services\u003c/p>\u003c/div>\u003cdiv>\u003cspan>03\u003c/span>\u003ch4>Express\u003c/h4>\u003cp>Movement, sound or a face\u003c/p>\u003c/div>\u003c/div>\u003csection class=\"tj-variations\">\u003cdiv class=\"tj-section-head\">\u003cdiv>\u003cspan class=\"tj-kicker\">FIND YOUR FORMAT\u003c/span>\u003ch3>Same idea. Different possibilities.\u003c/h3>\u003c/div>\u003cspan class=\"tj-caption\">Select a format to explore \u2193\u003c/span>\u003c/div>\u003cdiv class=\"tj-variant-tabs\" role=\"tablist\" aria-label=\"Companion robotics formats\">\u003cbutton type=\"button\" role=\"tab\" id=\"tab-companions-0\" aria-selected=\"true\" aria-controls=\"panel-companions-0\" tabindex=\"0\" data-variant=\"0\">Mobile companion\u003cspan>\u2197\u003c/span>\u003c/button>\u003cbutton type=\"button\" role=\"tab\" id=\"tab-companions-1\" aria-selected=\"false\" aria-controls=\"panel-companions-1\" tabindex=\"-1\" data-variant=\"1\">Desktop companion\u003cspan>\u2197\u003c/span>\u003c/button>\u003cbutton type=\"button\" role=\"tab\" id=\"tab-companions-2\" aria-selected=\"false\" aria-controls=\"panel-companions-2\" tabindex=\"-1\" data-variant=\"2\">Character companion\u003cspan>\u2197\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"tj-variant-panel\" role=\"tabpanel\" id=\"panel-companions-0\" aria-labelledby=\"tab-companions-0\">\u003cdiv class=\"tj-variant-photo\">\u003cimg src=\"assets/robot-living-cinematic.webp\" alt=\"SC-S1 Companion Robot \u2014 illustrative product imagery\" loading=\"lazy\">\u003c/div>\u003cdiv class=\"tj-variant-copy\">\u003cspan class=\"tj-kicker\">01 / Companion robotics\u003c/span>\u003ch4>Mobile companion\u003c/h4>\u003cp>SC-S1 is a compact mobile home-camera platform. Remote viewing and two-way talk make it useful for checking in on a space. Exact connectivity and home conditions determine where it works well.\u003c/p>\u003ca class=\"tj-button\" href=\"sc-s1-companion-robot.html\">Explore SC-S1 Companion Robot \u003cspan>\u2197\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003cdiv class=\"tj-variant-panel\" role=\"tabpanel\" id=\"panel-companions-1\" aria-labelledby=\"tab-companions-1\" hidden=\"\">\u003cdiv class=\"tj-variant-photo\">\u003cimg src=\"assets/dm03-desktop-companion-card-real-v1.webp\" alt=\"DM03 Desktop Companion \u2014 illustrative product imagery\" loading=\"lazy\">\u003c/div>\u003cdiv class=\"tj-variant-copy\">\u003cspan class=\"tj-kicker\">02 / Companion robotics\u003c/span>\u003ch4>Desktop companion\u003c/h4>\u003cp>DM03 takes a stationary approach: a small expressive display, a rounded form and supplier-listed touch and voice interaction. Its conversation services require a connection; the final software package is being evaluated.\u003c/p>\u003ca class=\"tj-button\" href=\"dm03-desktop-companion.html\">Explore DM03 Desktop Companion \u003cspan>\u2197\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003cdiv class=\"tj-variant-panel\" role=\"tabpanel\" id=\"panel-companions-2\" aria-labelledby=\"tab-companions-2\" hidden=\"\">\u003cdiv class=\"tj-variant-photo\">\u003cimg src=\"assets/astronaut-desktop-companion-life-2.webp\" alt=\"Astronaut Desktop Companion \u2014 illustrative product imagery\" loading=\"lazy\">\u003c/div>\u003cdiv class=\"tj-variant-copy\">\u003cspan class=\"tj-kicker\">03 / Companion robotics\u003c/span>\u003ch4>Character companion\u003c/h4>\u003cp>The Astronaut platform makes its personality visible in its shape, LED face and clock display. It stays on a surface rather than walking around a room. Cloud conversation and service terms are being evaluated.\u003c/p>\u003ca class=\"tj-button\" href=\"astronaut-desktop-companion.html\">Explore Astronaut Desktop Companion \u003cspan>\u2197\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/section>\u003cdetails class=\"tj-question\">\u003csummary>Does every companion navigate around the house?\u003cspan>+\u003c/span>\u003c/summary>\u003cp>No. Stationary desktop models and mobile camera robots have different hardware. Even movement does not guarantee autonomous mapping or obstacle handling. Check the specific model rather than assuming a capability from its appearance.\u003c/p>\u003c/details>\u003cdiv class=\"tj-footnotes\">\u003cp>Product previews describe supplier platforms. Final services, availability and configurations are listed on the individual product pages.\u003c/p>\u003cdetails>\u003csummary>Sources &amp; further reading\u003c/summary>\u003cp>Manufacturer references explain the underlying category; they do not imply that another brand\u2019s services are included with a Nexora product.\u003c/p>\u003ca href=\"https://www.spaexi.com/al-companion-pet/al-companion-pet-dimi.html\" target=\"_blank\" rel=\"noopener noreferrer\">SPAEXI: desktop companion reference \u2197\u003c/a>\u003ca href=\"https://www.enabot.com/home-robot/ebo-se\" target=\"_blank\" rel=\"noopener noreferrer\">Enabot: mobile camera category example \u2197\u003c/a>\u003ca href=\"https://isolaos.com/product-astropal\" target=\"_blank\" rel=\"noopener noreferrer\">Astronaut platform reference \u2197\u003c/a>\u003c/details>\u003c/div>\u003ca class=\"tj-next\" href=\"#voice\">\u003cspan>NEXT CHAPTER\u003c/span>\u003cstrong>Voice &amp; ideas\u003c/strong>\u003cb>\u2192\u003c/b>\u003c/a>\u003c/article>\u003c/div>\u003c/div>\u003cfooter class=\"tj-footer\">\u003ca href=\"index.html\">NEXORA\u003c/a>\u003cp>A little ahead. Right at home.\u003c/p>\u003ca href=\"shop.html\">Explore the collection \u2197\u003c/a>\u003c/footer>\u003c/main>\u003cscript src=\"assets/nexora-cart.js\">\u003c/script>\u003cscript src=\"assets/nexora-discovery.js\">\u003c/script>\u003c/body>\u003c/html>","wearables
